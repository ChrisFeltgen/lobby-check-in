      // The Edit account window: name, User ID and role, plus a password reset for other accounts.
      // Changes only go to the server when Save or Reset is pressed.
      function openAccountDialog(u) {
        var isSelf = u.id === state.user.id;
        var canChangeRole = state.user.role === 'admin' && !isSelf;

        var overlay = el('div', 'modal-backdrop');
        var dialog = el('div', 'modal');
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');
        function close() { overlay.remove(); }
        overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
        document.addEventListener('keydown', function onKey(e) {
          if (e.key === 'Escape' && document.body.contains(overlay)) { close(); document.removeEventListener('keydown', onKey); }
        });

        dialog.appendChild(el('h3', null, 'Edit account'));

        var name = document.createElement('input');
        name.value = u.displayName;
        name.maxLength = 100;
        dialog.appendChild(labelled('Display name', name));

        var userId = document.createElement('input');
        userId.value = u.username;
        userId.maxLength = 40;
        dialog.appendChild(labelled('User ID (the name used to sign in)', userId));

        var role = roleOptions(u.role, false);
        role.disabled = !canChangeRole;
        dialog.appendChild(labelled(isSelf ? 'Role (you cannot change your own)' : 'Role', role));

        var saveErr = el('p', 'err');
        var saveBtn = el('button', 'primary', 'Save changes');
        saveBtn.type = 'button';
        saveBtn.addEventListener('click', function () {
          var patch = {};
          if (name.value.trim() !== u.displayName) patch.displayName = name.value.trim();
          if (userId.value.trim() !== u.username) patch.username = userId.value.trim();
          if (canChangeRole && role.value !== u.role) patch.role = role.value;
          if (!Object.keys(patch).length) { close(); return; }
          saveBtn.disabled = true;
          api('/api/users/' + u.id, { method: 'PATCH', body: JSON.stringify(patch) })
            .then(function () { close(); return loadUsers(); })
            .catch(function (err) { saveErr.textContent = err.message; saveBtn.disabled = false; });
        });
        dialog.appendChild(saveErr);

        // Password reset: not for your own account, which is changed on My account.
        if (!isSelf) {
          var resetHead = el('h4', null, 'Reset password');
          dialog.appendChild(resetHead);
          var newPw = document.createElement('input');
          newPw.type = 'password';
          newPw.placeholder = 'At least ' + minPassword() + ' characters';
          newPw.autocomplete = 'new-password';
          // The password field and its button share one row; the tick box and message sit below.
          var resetRow = el('div', 'reset-row');
          newPw.placeholder = 'New password (at least ' + minPassword() + ' characters)';
          resetRow.appendChild(newPw);
          dialog.appendChild(resetRow);
          var mustChange = document.createElement('input');
          mustChange.type = 'checkbox';
          mustChange.checked = defaultMustChange();
          var mustChangeLabel = el('label', 'check-row');
          mustChangeLabel.appendChild(mustChange);
          mustChangeLabel.appendChild(document.createTextNode(' Require user to change password on next sign-on'));
          dialog.appendChild(mustChangeLabel);
          var resetErr = el('p', 'err');
          var resetBtn = el('button', 'secondary', 'Reset password');
          resetBtn.type = 'button';
          resetBtn.addEventListener('click', function () {
            resetErr.textContent = '';
            if (newPw.value.length < minPassword()) { resetErr.textContent = 'The new password must be at least ' + minPassword() + ' characters.'; return; }
            resetBtn.disabled = true;
            api('/api/users/' + u.id, {
              method: 'PATCH',
              body: JSON.stringify({ password: newPw.value, requirePasswordChange: mustChange.checked })
            }).then(function () {
              newPw.value = '';
              resetErr.textContent = 'Password reset.';
              resetErr.className = 'health-ok';
              return loadUsers();
            }).catch(function (err) {
              resetErr.textContent = err.message;
            }).finally(function () { resetBtn.disabled = false; });
          });
          resetRow.appendChild(resetBtn);
          dialog.appendChild(resetErr);
        }

        var actions = el('div', 'modal-actions');
        var closeBtn = el('button', 'secondary', 'Close');
        closeBtn.type = 'button';
        closeBtn.addEventListener('click', close);
        actions.appendChild(closeBtn);
        actions.appendChild(saveBtn);
        dialog.appendChild(actions);

        overlay.appendChild(dialog);
        document.body.appendChild(overlay);
        name.focus();
      }

      async function loadUsers() {

      // ================= Reports =================
      // The dialog loads one day's tickets from the server, then works out every number on
      // screen from those rows here, so switching between views never needs another request.
      var REPORT_VIEWS = [
        { key: 'history', label: 'Ticket history' },
        { key: 'services', label: 'Service summary' },
        { key: 'staff', label: 'Staff performance' },
        { key: 'hourly', label: 'Hourly trends' }
      ];
      var STATUS_LABEL = { waiting: 'Waiting', called: 'Called', serving: 'Serving', served: 'Served', removed: 'Removed' };
      var report = { from: '', to: '', view: 'history', search: '', tickets: [], loading: false, error: '', seq: 0 };
      var reportRoot = null;
      var reportInputs = {};

      function pad2(n) { return (n < 10 ? '0' : '') + n; }
      function todayIso() {
        var d = new Date();
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      }

      function minutesBetween(from, to) {
        if (!from || !to) return null;
        return (new Date(to) - new Date(from)) / 60000;
      }
      function average(values) {
        var v = values.filter(function (x) { return x !== null; });
        if (!v.length) return null;
        return v.reduce(function (sum, x) { return sum + x; }, 0) / v.length;
      }
      function fmtMinutes(m) { return m === null ? '—' : m < 1 ? '< 1 min' : Math.round(m) + ' min'; }
      function fmtClock(iso) { return iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '—'; }
      // Reports include services that have been turned off or deleted, so names come with the report; the
      // list of services that are on is the fallback.
      function serviceName(code) {
        if (report.names && report.names[code]) return report.names[code];
        var s = state.services.find(function (c) { return c.code === code; });
        return s ? s.name : code;
      }

      // A plain table from a header list and rows of cell values. Cells are set as text, never HTML.
      function reportTable(headers, rows, footer) {
        var table = document.createElement('table');
        var thead = document.createElement('thead');
        var headRow = document.createElement('tr');
        headers.forEach(function (h) { headRow.appendChild(el('th', h.num ? 'r' : null, h.label)); });
        thead.appendChild(headRow);
        table.appendChild(thead);
        var tbody = document.createElement('tbody');
        rows.forEach(function (row) {
          // A row is either a list of cells, or { cells, className } for a styled row.
          var cells = Array.isArray(row) ? row : row.cells;
          var tr = document.createElement('tr');
          if (!Array.isArray(row) && row.className) tr.className = row.className;
          cells.forEach(function (cell, i) {
            var td = document.createElement('td');
            if (headers[i].num) td.className = 'r';
            if (cell instanceof Node) td.appendChild(cell); else td.textContent = cell;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        if (footer) {
          var tfoot = document.createElement('tfoot');
          var fr = document.createElement('tr');
          footer.forEach(function (cell, i) {
            var td = document.createElement('td');
            if (headers[i].num) td.className = 'r';
            td.textContent = cell;
            fr.appendChild(td);
          });
          tfoot.appendChild(fr);
          table.appendChild(tfoot);
        }
        return table;
      }

      // The tickets Ticket history shows: all of them, or only those whose customer name contains the
      // search text (ignoring case). Export uses the same list, so the file matches the screen.
      function filteredHistory(tickets) {
        var q = report.search.trim().toLowerCase();
        return q ? tickets.filter(function (t) { return t.customerName.toLowerCase().indexOf(q) >= 0; }) : tickets;
      }

      // A range of a year can hold tens of thousands of tickets, more than a browser draws comfortably in a table. The
      // list shows the first part and says so; Export CSV always has every ticket in the range.
      var HISTORY_ROWS = 1500;

      function historyView(tickets) {
        var q = report.search.trim();
        var shown = filteredHistory(tickets);
        if (!shown.length) return el('p', 'empty', q ? 'No tickets match "' + q + '".' : 'No tickets in this range.');
        var limited = shown.length > HISTORY_ROWS;
        var rows = (limited ? shown.slice(0, HISTORY_ROWS) : shown).map(function (t) {
          return [
            t.ticketNumber,
            t.customerName,
            serviceName(t.serviceCode),
            fmtClock(t.createdAt),
            t.calledAt ? fmtClock(t.calledAt) : '—',
            t.completedAt && (t.status === 'served' || t.status === 'removed') ? fmtClock(t.completedAt) : '—',
            t.calledBy || '—',
            t.counter || '—',
            STATUS_LABEL[t.status] || t.status
          ];
        });
        var headers = [
          { label: 'Ticket' }, { label: 'Name' }, { label: 'Service' }, { label: 'Arrived' },
          { label: 'Called' }, { label: 'Completed' }, { label: 'Staff' }, { label: 'Counter' }, { label: 'Status' }
        ];
        var table = reportTable(headers, rows);
        if (!limited) return table;
        var box = el('div');
        box.appendChild(el('p', 'muted', 'Showing the first ' + HISTORY_ROWS.toLocaleString() + ' of ' + shown.length.toLocaleString() +
          ' tickets. Choose fewer days or search by name to see the rest. Export CSV has every ticket.'));
        box.appendChild(table);
        return box;
      }

      function serviceView(tickets) {
        var byCode = {};
        tickets.forEach(function (t) {
          var r = byCode[t.serviceCode] || (byCode[t.serviceCode] = { arrived: 0, served: 0, removed: 0, open: 0, waits: [], times: [] });
          r.arrived++;
          if (t.status === 'served') r.served++;
          else if (t.status === 'removed') r.removed++;
          else r.open++;
          // A ticket returned to the lobby keeps its old calledAt, so only count waits for tickets
          // that are actually out of the lobby.
          if (t.status !== 'waiting') r.waits.push(minutesBetween(t.createdAt, t.calledAt));
          if (t.status === 'served') r.times.push(minutesBetween(t.calledAt, t.completedAt));
        });
        var codes = Object.keys(byCode).sort(function (a, b) { return serviceName(a).localeCompare(serviceName(b)); });
        var total = { arrived: 0, served: 0, removed: 0, open: 0, waits: [], times: [] };
        var rows = codes.map(function (code) {
          var r = byCode[code];
          total.arrived += r.arrived; total.served += r.served; total.removed += r.removed; total.open += r.open;
          total.waits = total.waits.concat(r.waits); total.times = total.times.concat(r.times);
          return [serviceName(code), String(r.arrived), String(r.served), String(r.removed), String(r.open),
            fmtMinutes(average(r.waits)), fmtMinutes(average(r.times))];
        });
        var headers = [
          { label: 'Service' }, { label: 'Arrived', num: true }, { label: 'Served', num: true },
          { label: 'Removed', num: true }, { label: 'Still open', num: true },
          { label: 'Avg wait', num: true }, { label: 'Avg service time', num: true }
        ];
        var footer = ['Total', String(total.arrived), String(total.served), String(total.removed), String(total.open),
          fmtMinutes(average(total.waits)), fmtMinutes(average(total.times))];
        return reportTable(headers, rows, footer);
      }

      function staffView(tickets) {
        // Each person's totals across every service they called people for, with the per-service
        // breakdown listed under their name. The last row totals everyone.
        var people = {};
        var all = { called: 0, served: 0, times: [] };
        tickets.forEach(function (t) {
          if (!t.calledBy) return;
          var p = people[t.calledBy] || (people[t.calledBy] = { called: 0, served: 0, times: [], services: {} });
          var s = p.services[t.serviceCode] || (p.services[t.serviceCode] = { code: t.serviceCode, called: 0, served: 0, times: [] });
          [p, s, all].forEach(function (r) {
            r.called++;
            if (t.status === 'served') {
              r.served++;
              r.times.push(minutesBetween(t.calledAt, t.completedAt));
            }
          });
        });

        var rows = [];
        Object.keys(people).sort(function (a, b) { return a.localeCompare(b); }).forEach(function (name) {
          var p = people[name];
          rows.push({ cells: [name, String(p.called), String(p.served), fmtMinutes(average(p.times))], className: 'person-total' });
          Object.keys(p.services)
            .map(function (k) { return p.services[k]; })
            .sort(function (a, b) { return serviceName(a.code).localeCompare(serviceName(b.code)); })
            .forEach(function (s) {
              rows.push({ cells: [serviceName(s.code), String(s.called), String(s.served), fmtMinutes(average(s.times))], className: 'service-row' });
            });
        });
        var headers = [
          { label: 'Staff' }, { label: 'Called', num: true }, { label: 'Completed', num: true }, { label: 'Avg service time', num: true }
        ];
        var footer = ['All staff', String(all.called), String(all.served), fmtMinutes(average(all.times))];
        return reportTable(headers, rows, rows.length ? footer : null);
      }

      function hourlyView(tickets) {
        // Buckets are by the hour of arrival (waits and arrivals) and of completion (served).
        var buckets = {};
        function bucket(h) { return buckets[h] || (buckets[h] = { arrivals: 0, served: 0, waits: [] }); }
        tickets.forEach(function (t) {
          var arrivedHour = new Date(t.createdAt).getHours();
          bucket(arrivedHour).arrivals++;
          if (t.status !== 'waiting') bucket(arrivedHour).waits.push(minutesBetween(t.createdAt, t.calledAt));
          if (t.status === 'served') bucket(new Date(t.completedAt).getHours()).served++;
        });
        var hours = Object.keys(buckets).map(Number);
        if (!hours.length) return el('p', 'empty', 'No tickets on this day.');
        var first = Math.min.apply(null, hours), last = Math.max.apply(null, hours);
        var peak = 0;
        hours.forEach(function (h) { peak = Math.max(peak, buckets[h].arrivals, buckets[h].served); });

        var rows = [];
        for (var h = first; h <= last; h++) {
          var b = buckets[h] || { arrivals: 0, served: 0, waits: [] };
          var label = new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: 'numeric' });
          rows.push([label, barCell(b.arrivals, 'arrivals', peak), barCell(b.served, 'served', peak), fmtMinutes(average(b.waits))]);
        }
        var headers = [
          { label: 'Hour' }, { label: 'Arrivals' }, { label: 'Served' }, { label: 'Avg wait', num: true }
        ];
        return reportTable(headers, rows);
      }

      // CSV for the Ticket history list. Values that a spreadsheet would read as a formula get a
      // leading apostrophe so a name can't run as one. The byte-order mark makes Excel read UTF-8.
      function csvCell(value) {
        var s = value === null || value === undefined ? '' : String(value);
        if (/^[=+\-@]/.test(s)) s = "'" + s;
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }

      // A timestamp as two spreadsheet cells: the date as yyyy-mm-dd (sorts correctly) and the time
      // as 24-hour hh:mm. Empty when there's no time.
      function csvDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      }
      function csvTime(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
      }

      // Saves CSV lines as a file. The byte-order mark makes Excel read the file as UTF-8.
      function downloadCsv(lines, filename) {
        var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      }

      // Export on any report view: the history list (with its name search) or the table on screen.
      function exportCurrentView() {
        if (report.view === 'history') return exportHistoryCsv();
        var table = reportRoot.querySelector('.report-body table');
        if (!table) return;
        var lines = [];
        table.querySelectorAll('thead tr, tbody tr, tfoot tr').forEach(function (tr) {
          lines.push(Array.prototype.map.call(tr.children, function (cell) { return csvCell(cell.textContent.trim()); }).join(','));
        });
        downloadCsv(lines, 'report-' + report.view + '_' + report.from + '_to_' + report.to + '.csv');
      }

      function exportHistoryCsv() {
        var header = ['Ticket', 'Name', 'Service',
          'Arrived date', 'Arrived time', 'Called date', 'Called time', 'Completed date', 'Completed time',
          'Staff', 'Counter', 'Status'];
        var lines = [header.join(',')];
        filteredHistory(report.tickets).forEach(function (t) {
          var finished = t.status === 'served' || t.status === 'removed';
          lines.push([
            t.ticketNumber, t.customerName, serviceName(t.serviceCode),
            csvDate(t.createdAt), csvTime(t.createdAt),
            csvDate(t.calledAt), csvTime(t.calledAt),
            finished ? csvDate(t.completedAt) : '', finished ? csvTime(t.completedAt) : '',
            t.calledBy, t.counter, STATUS_LABEL[t.status] || t.status
          ].map(csvCell).join(','));
        });
        downloadCsv(lines, 'ticket-history_' + report.from + '_to_' + report.to + '.csv');
      }

      function barCell(count, kind, peak) {
        var wrap = el('div', 'bar-line');
        var track = el('div', 'bar-track');
        var fill = el('div', 'bar-fill ' + kind);
        fill.style.width = (peak ? (count / peak) * 100 : 0) + '%';
        track.appendChild(fill);
        wrap.appendChild(track);
        wrap.appendChild(el('span', 'bar-num', String(count)));
        return wrap;
      }

      function renderReportBody() {
        if (!reportRoot) return;
        var body = reportRoot.querySelector('.report-body');
        var meta = reportRoot.querySelector('.report-summary');
        body.textContent = '';
        reportRoot.querySelectorAll('.report-view').forEach(function (b) {
          b.classList.toggle('active', b.dataset.view === report.view);
        });
        // The name search only applies to Ticket history, so only that view shows the box.
        reportRoot.querySelector('.report-search').classList.toggle('hidden', report.view !== 'history');
        // Export and print work on every view. Export needs something to export.
        reportRoot.querySelector('.report-export').disabled = report.loading || !report.tickets.length;
        reportRoot.querySelector('.print-title').textContent = 'Lobby Check-In report: ' + report.from + ' to ' + report.to;
        if (report.loading) { meta.textContent = 'Loading…'; return; }
        if (report.error) { meta.textContent = report.error; return; }
        var n = report.tickets.length;
        var when = report.from === report.to ? 'on ' + report.from : 'from ' + report.from + ' to ' + report.to;
        meta.textContent = n + (n === 1 ? ' ticket' : ' tickets') + ' created ' + when;
        if (!n) { body.appendChild(el('p', 'empty', 'No tickets were created in this range.')); return; }
        var views = { history: historyView, services: serviceView, staff: staffView, hourly: hourlyView };
        body.appendChild(views[report.view](report.tickets));

      async function loadReportRange() {
        var seq = ++report.seq;
        report.loading = true;
        report.error = '';
        renderReportBody();
        try {
          var data = await api('/api/reports/range?from=' + encodeURIComponent(report.from) + '&to=' + encodeURIComponent(report.to));
          if (seq !== report.seq) return;
          report.tickets = data.tickets;
          report.names = {};
          (data.services || []).forEach(function (s) { report.names[s.code] = s.name; });
        } catch (err) {
          if (seq !== report.seq) return;
          report.tickets = [];
          report.error = err.message;
        }
        report.loading = false;
        renderReportBody();

      // A labelled date field for the From or To end of the range. Changing one keeps the range in

      function dateField(label, key) {

        wrap.appendChild(el('span', null, label));

        input.type = 'date';

        input.addEventListener('change', function () {

            if (key === 'from') report.to = report.from; else report.from = report.to;
            reportInputs.from.value = report.from;
            reportInputs.to.value = report.to;

      function loadSettingsTab(tab) {
        // Opening a tab shows what is saved, so a message about an earlier save would no longer be about what is on screen.

      // ---- The settings on the Settings tab and the Security tab ----
      // Each group belongs to one tab, and the tab's Save button saves every group on it. The server checks every value and
      // returns a plain message if one is wrong. The groups appear in this order. The old-record retention rule is the
      // last group on the Settings tab, and is built apart from these because it is saved through another route.
      var APP_GROUPS = [
        { tab: 'settings', title: 'Site branding', note: 'The organisation name appears above the page headings and in the page titles. The logo appears in the page headers. With no logo set, the headers show none.', keys: ['org_name'], logo: true },
        { tab: 'settings', title: 'Kiosk configuration', note: 'Kiosks pick up these changes within a minute, without a reload.', keys: ['kiosk_idle_seconds', 'kiosk_done_seconds', 'kiosk_theme', 'checkin_rate_per_minute'] },
        { tab: 'settings', title: 'Monitor configuration', note: 'Monitors pick up these changes within a minute, without a reload. Pick at least one department for each side.', keys: ['monitor_call_seconds', 'monitor_chime', 'monitor_scroll', 'monitor_theme', 'monitor_left', 'monitor_right'] },
        { tab: 'settings', title: 'End of day setting', note: 'At this time each day, every ticket still waiting, called or being served is closed as removed, and the screens update. It runs once a day, using the server\'s clock, and the audit log records how many were closed. Leave blank to turn it off.', keys: ['auto_close_time'] },
        { tab: 'security', title: 'Security and sessions', note: 'A new session length applies at each sign-in. The idle sign-out applies from each person\'s next request. Sign-in lockout counts failed attempts in the audit log.', keys: ['session_hours', 'session_idle_minutes', 'min_password_length', 'new_account_change_password', 'lockout_attempts', 'lockout_minutes'] },
        { tab: 'security', title: 'Kiosk and monitor access', note: '', keys: ['restrict_screens'], links: true },
        { tab: 'security', title: 'Audit log retention', note: 'Entries older than this are removed each day. Lockouts depend on recent failed sign-ins, so keep at least 30 days, or 0 to keep everything.', keys: ['audit_retention_days'] }
      ];

      // Draws the groups of one tab from the saved values. Opening a tab shows what is saved, so the other tab's unsaved
      // changes are left as they are.
      function loadAppSettings(tab) {
        var box = settingsUi.appContainer[tab];
        return api('/api/admin/app-settings').then(function (data) {
          settingsUi.appData = data;
          settingsUi.appInputs = settingsUi.appInputs || {};
          box.textContent = '';
          APP_GROUPS.filter(function (g) { return g.tab === tab; }).forEach(function (g) {
            box.appendChild(settingsGroup(g.title, [buildAppPanel(g, data)]));
          });
        }).catch(function (err) {
          box.textContent = err.message;
        });

      function buildAppPanel(g, data) {
        var panel = el('div', 'panel');
        if (g.note) panel.appendChild(el('p', 'muted', g.note));
        // No buttons here: the Save settings button at the foot of the tab saves every group.
        var form = el('form', 'inline');
        form.addEventListener('submit', function (e) { e.preventDefault(); });
        // Department lists share one full-width row, side by side. Other fields flow in the grid above it.
        var keyRow = el('div', 'key-row');
        g.keys.forEach(function (key) {
          var field = appField(key, data);
          if (data.definitions[key].type === 'keys') keyRow.appendChild(field); else form.appendChild(field);
        });
        if (keyRow.childNodes.length) form.appendChild(keyRow);
        panel.appendChild(form);
        if (g.logo) panel.appendChild(logoBlock(data));
        if (g.links) panel.appendChild(screenLinksBlock());
        return panel;
      }

      // One field, and a reader that returns its value in the form the server expects.
      function appField(key, data) {
        var def = data.definitions[key];
        var value = data.values[key];
        var input, row;
        if (def.type === 'bool') {
          input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = !!value;
          row = el('label', 'check-row');
          row.appendChild(input);
          row.appendChild(document.createTextNode(' ' + def.label));
          settingsUi.appInputs[key] = function () { return input.checked; };
          return row;
        }
        if (def.type === 'choice') {
          input = document.createElement('select');
          def.options.forEach(function (o) {
            var opt = el('option', null, o);
            opt.value = o;
            input.appendChild(opt);
          });
          input.value = value;
          settingsUi.appInputs[key] = function () { return input.value; };
          return labelled(def.label, input);
        }
        if (def.type === 'keys') {
          var options = data.departments.map(function (d) { return { value: d.id, label: d.label + ' (whole department)' }; })
            .concat(data.services.map(function (s) { return { value: s.code, label: s.name }; }));
          var picks = el('div', 'key-picks');
          var boxes = options.map(function (o) {
            var c = document.createElement('input');
            c.type = 'checkbox';
            c.value = o.value;
            c.checked = value.indexOf(o.value) >= 0;
            var l = el('label', 'check-row');
            l.appendChild(c);
            l.appendChild(document.createTextNode(' ' + o.label));
            picks.appendChild(l);
            return c;
          });
          settingsUi.appInputs[key] = function () {
            return boxes.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
          };
          var wrap = el('div', 'key-field');
          wrap.appendChild(el('span', 'field-label', def.label));
          wrap.appendChild(picks);
          return wrap;
        }
        if (def.type === 'clock') {
          input = document.createElement('input');
          input.type = 'time';
          input.value = value;
          settingsUi.appInputs[key] = function () { return input.value; };
          return labelled(def.label, input);
        }
        input = document.createElement('input');
        if (def.type === 'int') {
          input.type = 'number';
          input.min = def.min;
          input.max = def.max;
          input.step = '1';
          input.required = true;
          input.value = value;
          settingsUi.appInputs[key] = function () { return Number(input.value); };
        } else {
          input.type = 'text';
          input.maxLength = def.max;
          input.value = value;
          settingsUi.appInputs[key] = function () { return input.value; };
        }
        return labelled(def.label, input);
      }

      // Saves every setting on one tab in one go. The Settings tab saves its groups, then the old-record retention rule;
      // the Security tab saves its groups. A failure stops the save and shows the message beside the button.
      function saveSettings(tab) {
        if (!settingsUi.appInputs) return;
        var btn = settingsUi.save[tab].button;
        var msg = settingsUi.save[tab].message;
        var r = settingsUi.retention;
        var body = {};
        var loaded = true;
        APP_GROUPS.forEach(function (g) {
          if (g.tab !== tab) return;
          g.keys.forEach(function (key) {
            if (settingsUi.appInputs[key]) body[key] = settingsUi.appInputs[key](); else loaded = false;
          });
        });
        if (!loaded) { msg.className = 'msg'; msg.textContent = 'The settings have not loaded. Open this tab again and try once more.'; return; }
        // Turning the lock on shuts out every kiosk and monitor that has not been given a link, so say so first.
        if (body.restrict_screens === true && settingsUi.appData && !settingsUi.appData.values.restrict_screens) {
          var links = settingsUi.screenLinks;
          var active = links ? links.filter(function (l) { return !l.revokedAt; }).length : null;
          var detail = active === null ? '' : active
            ? ' You have ' + active + ' active access link' + (active === 1 ? '' : 's') + ': each screen has to be opened once with its link.'
            : ' You have not made any access links yet, so every kiosk and monitor will lock.';
          if (!confirm('Turning this on locks every kiosk and monitor until it is opened with an access link, or someone signs in on it.' + detail + ' Turn it on?')) return;
        }
        btn.disabled = true;
        msg.className = 'msg';
        msg.textContent = '';
        api('/api/admin/app-settings', { method: 'PUT', body: JSON.stringify(body) }).then(function () {
          if (tab !== 'settings') return;
          return api('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ retentionDays: Number(r.days.value), retentionAction: r.action.value }) });
        }).then(function () {
          msg.className = 'health-ok';
          msg.textContent = 'Settings saved.';
          if (settingsUi.appData && 'restrict_screens' in body) settingsUi.appData.values.restrict_screens = body.restrict_screens;
          if (tab === 'settings') loadRetention();
          loadAudit();
        }).catch(function (err) {
          msg.textContent = err.message;
        }).finally(function () { btn.disabled = false; });
      }

      // Logo: PNG, JPEG or WebP up to 300 KB. Stored in the database, so it follows the app to any host.
      // Only this block is drawn again after an upload or removal, so settings typed but not yet saved are kept.
      function logoBlock(data) {
        var wrap = el('div', 'key-field');
        function redraw() {
          return api('/api/admin/app-settings').then(function (fresh) {
            data.logoUrl = fresh.logoUrl;
            wrap.replaceWith(logoBlock(data));
          });
        }
        wrap.appendChild(el('span', 'field-label', 'Logo'));
        var row = el('div', 'logo-row');
        if (data.logoUrl) {
          var img = document.createElement('img');
          img.className = 'logo-preview';
          img.alt = 'Current logo';
          img.src = BASE + data.logoUrl;
          // A saved logo the browser can't draw: say so, and point to the way to fix it.
          img.addEventListener('error', function () {
            img.replaceWith(el('span', 'msg', 'The saved logo could not be displayed. Remove it, then upload it again.'));
          });
          row.appendChild(img);
        } else {
          row.appendChild(el('span', 'muted', 'No logo set. The headers show no logo.'));
        }
        var msg = el('p', 'msg');
        var file = document.createElement('input');
        file.type = 'file';
        file.accept = 'image/png,image/jpeg,image/webp';
        file.addEventListener('change', function () {
          var picked = file.files && file.files[0];
          if (!picked) return;
          if (picked.size > 300 * 1024) { msg.textContent = 'Choose an image under 300 KB.'; file.value = ''; return; }
          var reader = new FileReader();
          reader.onload = function () {
            api('/api/admin/logo', { method: 'PUT', body: JSON.stringify({ dataUrl: reader.result }) }).then(redraw)
              .catch(function (err) { msg.textContent = err.message; });
          };
          reader.readAsDataURL(picked);
        });
        var upload = el('div', 'logo-actions');
        upload.appendChild(file);
        if (data.logoUrl) {
          var remove = el('button', 'secondary', 'Remove logo');
          remove.type = 'button';
          remove.addEventListener('click', function () {
            api('/api/admin/logo', { method: 'DELETE' }).then(redraw).catch(function (err) { msg.textContent = err.message; });
          });
          upload.appendChild(remove);
        }
        // The logo and the buttons to change it share one line, and wrap under each other only when the window is narrow.
        var line = el('div', 'logo-line');
        line.appendChild(row);
        line.appendChild(upload);
        wrap.appendChild(line);
        wrap.appendChild(msg);
        return wrap;
      }

      // ---- Access links for the kiosk and monitor ----
      // With the switch above on, the kiosk and monitor open only for someone who is signed in, or for a browser that has
      // been opened with one of these links. A link's key is shown once, when the link is made or replaced, and can never
      // be shown again: the server keeps only a hash of it. Revoking a link locks the screens using it at once.
      function copyText(text, done) {
        function fallback() {
          var box = document.createElement('textarea');
          box.value = text;
          box.style.position = 'fixed';
          box.style.opacity = '0';
          document.body.appendChild(box);
          box.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          box.remove();
          done(ok);
        }
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
        else fallback();
      }

      var PANEL_CHOICES = [['full', 'Full (all departments)'], ['left', 'Left screen'], ['right', 'Right screen']];

      function monitorModeText(panel) {
        return panel === 'left' ? 'left screen' : panel === 'right' ? 'right screen' : 'full screen';
      }

      function screenLinksBlock() {
        var wrap = el('div', 'key-field links-block');
        wrap.appendChild(el('h4', 'links-title', 'Access links'));
        wrap.appendChild(el('p', 'links-intro', 'Generate a unique access link for each kiosk or monitor below. Each link contains a security code that can be revoked, immediately disabling access for any client that used that link.'));
        var formMsg = el('p', 'msg');
        var form = el('form', 'inline');
        var name = document.createElement('input');
        name.maxLength = 100;
        name.placeholder = 'e.g. Lobby kiosk';
        name.required = true;
        var scope = document.createElement('select');
        [['kiosk', 'Kiosk (customers check in)'], ['monitor', 'Monitor (lobby display)']].forEach(function (o) {
          var opt = el('option', null, o[1]);
          opt.value = o[0];
          scope.appendChild(opt);
        });
        // A monitor can show every department on one screen, or just the departments chosen for its left or right side
        // (Settings, Monitor configuration), for a lobby with two displays. The choice is part of the address the link opens.
        var panel = document.createElement('select');
        PANEL_CHOICES.forEach(function (o) {
          var opt = el('option', null, o[1]);
          opt.value = o[0];
          panel.appendChild(opt);
        });
        var panelField = labelled('Monitor mode', panel);
        panelField.classList.add('hidden');
        scope.addEventListener('change', function () { panelField.classList.toggle('hidden', scope.value !== 'monitor'); });
        var make = el('button', 'primary', 'Make a link');
        make.type = 'submit';
        form.appendChild(labelled('Name of the screen', name));
        form.appendChild(labelled('Kind of screen', scope));
        form.appendChild(panelField);
        form.appendChild(make);
        var result = el('div');
        var listBox = el('div');
        wrap.appendChild(form);
        wrap.appendChild(formMsg);
        wrap.appendChild(result);
        wrap.appendChild(listBox);

        // The address to open on the screen. A monitor link also says which departments to show: with none given the
        // monitor shows them all, and ?panel=left or ?panel=right shows the ones chosen for that side. The key goes after
        // a #, which a browser never sends to the web server, so it does not end up in the host's logs.
        function addressFor(link) {
          var page = link.scope === 'kiosk' ? 'kiosk.html' : 'monitor.html';
          var query = link.scope === 'monitor' && (link.panel === 'left' || link.panel === 'right') ? '?panel=' + link.panel : '';
          return location.origin + BASE + page + query + '#key=' + encodeURIComponent(link.key);
        }

        // A new link, shown once, with a way to copy it.
        function showResult(link, replaced) {
          result.textContent = '';
          var box = el('div', 'link-result');
          var heading = el('p');
          heading.appendChild(el('strong', null, (replaced ? 'New link for "' : 'Link for "') + link.name + '". '));
          heading.appendChild(document.createTextNode('Copy it now. For safety it cannot be shown again; if it is lost, make a new one for the same screen.' + (replaced ? ' The old link no longer works.' : '')));
          box.appendChild(heading);
          if (link.scope === 'monitor') box.appendChild(el('p', 'muted', 'Opens the monitor as: ' + monitorModeText(link.panel) + '.'));
          var code = el('code');
          box.appendChild(code);
          var actions = el('div', 'link-actions');
          code.textContent = addressFor(link);
          var copy = el('button', 'primary', 'Copy link');
          copy.type = 'button';
          var copied = el('span', 'muted');
          copy.addEventListener('click', function () {
            copyText(code.textContent, function (ok) {
              copied.textContent = ok ? 'Copied.' : 'Select the link above and copy it.';
              if (!ok) { var range = document.createRange(); range.selectNodeContents(code); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); }
            });
          });
          var test = el('button', 'secondary', 'Try it in a new tab');
          test.type = 'button';
          test.title = 'Opens the link in this browser, which then counts as that screen too.';
          test.addEventListener('click', function () { window.open(code.textContent, '_blank'); });
          var done = el('button', 'secondary', 'I have copied it');
          done.type = 'button';
          done.addEventListener('click', function () { result.textContent = ''; });
          actions.appendChild(copy);
          actions.appendChild(test);
          actions.appendChild(done);
          actions.appendChild(copied);
          box.appendChild(actions);
          result.appendChild(box);
          box.scrollIntoView({ block: 'nearest' });
        }

        function load() {
          return api('/api/admin/screen-links').then(render).catch(function (err) { listBox.textContent = err.message; });
        }

        function act(label, path, opts, confirmText) {
          var b = el('button', label === 'Revoke' ? 'danger' : 'secondary', label);
          b.type = 'button';
          b.addEventListener('click', function () {
            if (confirmText && !confirm(confirmText)) return;
            b.disabled = true;
            api(path, opts).then(function (data) {
              formMsg.textContent = '';
              if (data && data.key) showResult(data, true);
              return load();
            }).catch(function (err) { formMsg.textContent = err.message; b.disabled = false; });
          });
          return b;
        }

        function render(links) {
          settingsUi.screenLinks = links;
          listBox.textContent = '';
          if (!links.length) { listBox.appendChild(el('p', 'muted', 'No access links yet.')); return; }
          var table = document.createElement('table');
          table.className = 'links-table';
          var head = document.createElement('thead');
          head.innerHTML = '<tr><th>Name</th><th>Screen</th><th>Made</th><th>Last used</th><th>Status</th><th></th></tr>';
          table.appendChild(head);
          var body = document.createElement('tbody');
          links.forEach(function (l) {
            var tr = document.createElement('tr');
            if (l.revokedAt) tr.className = 'inactive';
            tr.appendChild(el('td', null, l.name));
            tr.appendChild(el('td', null, l.scope === 'kiosk' ? 'Kiosk' : 'Monitor: ' + monitorModeText(l.panel)));
            tr.appendChild(el('td', 'when', fmtStamp(l.createdAt) + ' by ' + l.createdBy));
            tr.appendChild(el('td', 'when', l.lastUsedAt ? fmtStamp(l.lastUsedAt) : 'Never'));
            var status = el('td');
            status.appendChild(el('span', 'status-pill ' + (l.revokedAt ? 'status-closed' : 'status-open'), l.revokedAt ? 'Revoked' : 'Active'));
            tr.appendChild(status);
            var cell = el('td');
            var actions = el('div', 'row-actions');
            var id = encodeURIComponent(l.id);
            if (!l.revokedAt) {
              actions.appendChild(act('Revoke', '/api/admin/screen-links/' + id + '/revoke', { method: 'POST' },
                'Revoke "' + l.name + '"? Any screen using this link locks straight away, and the link stops working.'));
            }
            actions.appendChild(act(l.revokedAt ? 'Make a new link' : 'New link', '/api/admin/screen-links/' + id + '/replace', { method: 'POST' },
              'Make a new link for "' + l.name + '"? The current link stops working, so that screen has to be opened with the new one.'));
            actions.appendChild(act('Remove', '/api/admin/screen-links/' + id, { method: 'DELETE' },
              'Remove "' + l.name + '" from the list? Any screen using it locks straight away.'));
            cell.appendChild(actions);
            tr.appendChild(cell);
            body.appendChild(tr);
          });
          table.appendChild(body);
          var scroller = el('div', 'table-scroll');
          scroller.appendChild(table);
          listBox.appendChild(scroller);
        }

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          formMsg.textContent = '';
          make.disabled = true;
          api('/api/admin/screen-links', { method: 'POST', body: JSON.stringify({ name: name.value.trim(), scope: scope.value, panel: scope.value === 'monitor' ? panel.value : 'full' }) }).then(function (link) {
            name.value = '';
            showResult(link, false);
            return load();
          }).catch(function (err) { formMsg.textContent = err.message; }).finally(function () { make.disabled = false; });
        });

        load();
        return wrap;
      }

      // Each check is shown with a plain result. Problems are listed first so they stand out.
      function runDatabaseCheck() {
        var out = settingsUi.dbOut;
        out.textContent = 'Checking the database…';
        api('/api/admin/database').then(function (result) {
          var problems = result.checks.filter(function (c) { return !c.ok; }).length;
          out.textContent = '';
          out.appendChild(el('p', problems ? 'msg' : 'health-ok',
            problems ? problems + ' check(s) need attention.' : 'The database is working as expected.'));
          var rows = result.checks
            .slice()
            .sort(function (a, b) { return a.ok - b.ok; })
            .map(function (c) { return [c.name, c.detail, c.ok ? 'OK' : 'Problem']; });
          out.appendChild(reportTable([{ label: 'Check' }, { label: 'Result' }, { label: 'Status' }], rows));
        }).catch(function (err) {
          out.textContent = err.message;
        });
      }

      function runHealthCheck() {
        var out = settingsUi.healthOut;
        out.textContent = 'Checking…';
        api('/api/admin/health').then(function (h) {
          var db = h.database;
          var clockOff = Math.abs(db.clockDifferenceSeconds) > 60;
          var slow = db.latencyMs > 1000;
          var rows = [
            ['App running for', fmtUptime(h.app.uptimeSeconds)],
            ['Node.js version', h.app.nodeVersion],
            ['Database response', db.latencyMs + ' ms' + (slow ? ' (slow)' : '')],
            ['Clocks agree', clockOff ? 'No: database and app differ by ' + db.clockDifferenceSeconds + ' seconds' : 'Yes'],
            ['Waiting today', String(db.waitingToday)],
            ['Being served today', String(db.servingToday)],
            ['Active admin accounts', String(db.activeAdmins) + (db.activeAdmins < 2 ? ' (consider a second admin)' : '')],
            ['Old-record cleanup', h.oldRecords.retentionDays ? 'After ' + h.oldRecords.retentionDays + ' days' : 'Off (keeping everything)']
          ];
          var healthy = !clockOff && !slow;
          out.textContent = '';
          out.appendChild(el('p', healthy ? 'health-ok' : 'msg', healthy ? 'Everything looks healthy.' : 'Something needs attention. See below.'));
          out.appendChild(reportTable([{ label: 'Check' }, { label: 'Result' }], rows));
        }).catch(function (err) {
          out.textContent = err.message;
        });
      }

      function runTests() {
        var btn = settingsUi.testsBtn;
        btn.disabled = true;
        settingsUi.testsSummary.textContent = 'Running the tests…';
        settingsUi.testsOut.classList.add('hidden');
        api('/api/admin/tests', { method: 'POST' }).then(function (result) {
          // The runner's summary lines are "ℹ pass N" or "# pass N", depending on its output format.
          var counts = /(?:ℹ|#) pass (\d+)[\s\S]*?(?:ℹ|#) fail (\d+)/.exec(result.output);
          var summary = result.passed ? 'All tests passed.' : 'Some tests failed. See the output below.';
          if (counts) summary += ' (' + counts[1] + ' passed, ' + counts[2] + ' failed)';
          settingsUi.testsSummary.textContent = summary;
          settingsUi.testsSummary.className = result.passed ? 'health-ok' : 'msg';
          settingsUi.testsOut.textContent = result.output || 'No output.';
          settingsUi.testsOut.classList.remove('hidden');
          loadAudit();
        }).catch(function (err) {
          settingsUi.testsSummary.textContent = err.message;
        }).finally(function () { btn.disabled = false; });
      }

      function loadRetention() {
        api('/api/admin/settings').then(function (s) {
          settingsUi.retention.days.value = s.retentionDays;
          settingsUi.retention.action.value = s.retentionAction;
          settingsUi.retention.saved = { days: Number(s.retentionDays), action: s.retentionAction };
          settingsUi.retentionInfo.textContent = 'Last cleanup: ' + fmtStamp(s.lastCleanupAt) + '.';
        }).catch(function (err) {
          settingsUi.retentionInfo.textContent = err.message;
        });
      }

      function runCleanupNow() {
        // The cleanup follows the rule that is saved, not what is typed in the boxes, so the two must agree first.
        var saved = settingsUi.retention.saved;
        var days = Number(settingsUi.retention.days.value);
        if (!saved) { alert('The saved rule has not loaded yet. Try again in a moment.'); return; }
        if (days !== saved.days || settingsUi.retention.action.value !== saved.action) {
          alert('The days or the action above have changed but are not saved. Press Save settings at the foot of the page first, then run the cleanup.');
          return;
        }
        if (!days) { alert('Set a number of days and press Save settings first. 0 means keep everything, so there is nothing to clean up.'); return; }
        var deleting = settingsUi.retention.action.value === 'delete';
        var message = deleting
          ? 'Delete every finished ticket older than ' + days + ' days? Reports will no longer include them. This cannot be undone.'
          : 'Blank out customer names on finished tickets older than ' + days + ' days?';
        if (!confirm(message)) return;
        api('/api/admin/cleanup', { method: 'POST' }).then(function (result) {
          alert(result.changed + ' ticket(s) changed.');
          loadRetention();
          loadAudit();
        }).catch(function (err) { alert(err.message); });
      }

      function loadAudit() {
        var out = settingsUi.auditOut;
        out.textContent = 'Loading…';
        var term = settingsUi.auditSearch.value.trim();
        api('/api/admin/audit?limit=200&q=' + encodeURIComponent(term)).then(function (rows) {
          out.textContent = '';
          if (!rows.length) {
            out.appendChild(el('p', 'empty', term ? 'Nothing in the log matches "' + term + '".' : 'Nothing logged yet.'));
            return;
          }
          out.appendChild(reportTable(
            [{ label: 'When' }, { label: 'Who' }, { label: 'Action' }, { label: 'Target' }, { label: 'Details' }],
            rows.map(function (r) {
              return [fmtStamp(r.createdAt), r.actorName, AUDIT_LABEL[r.action] || r.action, r.target || '—', r.detail || '—'];
            })
          ));
        }).catch(function (err) {
          out.textContent = err.message;
        });
      }

      // ================= Service Configuration tab (admins only) =================
      // It used to be a page of its own. Its markup is #catalog-template at the foot of this page, and its styles are
      // scoped to #panel-catalog. It keeps its own state (cfg), apart from Management's.
      var catalogTab = (function () {
        var SECTIONS = ['services', 'groups', 'languages', 'translations'];
        var currentSection = 'services';
        var loadingCatalog = false;
        var COLOR_RE = /^#[0-9a-fA-F]{6}$/;
        var MAX_TILES = 4; // tiles a kiosk row is planned for (ROW_TILES in catalog.js)
        var cfg = { catalog: null, translations: null, trLang: '', trToken: 0, stale: false, saved: '' };
        // Cards whose fields have been changed but not saved yet.
        var dirtyCards = new Set();

        // Management's cfgApi() signs in again when the session ended and stops on a forced password change. Anything that
        // changes data also marks the Operations list as out of date, so it is read again when that tab is opened.
        function cfgApi(path, opts) {
          return api(path, opts).then(function (data) {
            if (opts && opts.method && opts.method !== 'GET') state.servicesStale = true;
            return data;
          });
        }

        function setMsg(node, text, ok) {
          node.textContent = text;
          node.classList.toggle('ok', !!ok);
        }

        // ---- Small building blocks ----

        function textInput(value, max) {
          var i = el('input');
          i.type = 'text';
          if (max) i.maxLength = max;
          i.value = value || '';
          return i;
        }

        function numberInput(value) {
          var i = el('input');
          i.type = 'number';
          i.min = '0';
          i.max = '999';
          i.step = '1';
          i.value = value === undefined || value === null ? '' : String(value);
          return i;
        }

        function checkbox(checked) {
          var c = el('input');
          c.type = 'checkbox';
          c.checked = !!checked;
          return c;
        }

        // A label above a control. `cls` is the column width, such as "c4".
        function field(label, control, cls, hint) {
          var l = el('label', 'field ' + (cls || ''));
          l.appendChild(document.createTextNode(label));
          l.appendChild(control);
          if (hint) l.appendChild(el('span', 'hint', hint));
          return l;
        }

        function setIcon(node, name) {
          node.innerHTML = name && window.iconSvg ? window.iconSvg(name) : '';
        }

        function fillSelect(select, options, blank) {
          select.textContent = '';
          if (blank) select.appendChild(new Option(blank, ''));
          options.forEach(function (o) { select.appendChild(new Option(o.label, o.value)); });
        }

        function groupSelect(value) {
          var select = el('select');
          fillSelect(select, cfg.catalog.groups.map(function (g) { return { value: g.id, label: g.label }; }), 'No department group');
          select.value = value || '';
          return select;
        }

        // The icon to use for a service or group: a button that opens a grid of every icon.
        // Returns { node, value(), onChange(fn) }.
        var openPickers = [];
        function iconPicker(value, onChange) {
          var current = value || '';
          var listener = onChange || function () {};
          var wrap = el('div', 'picker');
          var btn = el('button', null);
          btn.type = 'button';
          btn.className = 'picker-btn';
          btn.setAttribute('aria-haspopup', 'true');
          var preview = el('span', 'icon-preview');
          var label = el('span');
          btn.appendChild(preview);
          btn.appendChild(label);
          btn.appendChild(el('span', 'caret', '▼'));
          var pop = el('div', 'icon-pop hidden');

          function show() {
            setIcon(preview, current);
            label.textContent = current || 'No icon';
            Array.prototype.forEach.call(pop.children, function (b) { b.classList.toggle('selected', b.getAttribute('data-icon') === current); });
          }
          function choose(name) {
            current = name;
            show();
            close();
            listener(name);
          }
          function close() { pop.classList.add('hidden'); }
          var none = el('button', 'none', 'None');
          none.type = 'button';
          none.setAttribute('data-icon', '');
          none.title = 'No icon';
          none.addEventListener('click', function () { choose(''); });
          pop.appendChild(none);
          (cfg.catalog.iconNames || []).forEach(function (name) {
            var b = el('button');
            b.type = 'button';
            b.setAttribute('data-icon', name);
            b.title = name;
            b.setAttribute('aria-label', name);
            setIcon(b, name);
            b.addEventListener('click', function () { choose(name); });
            pop.appendChild(b);
          });
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var opening = pop.classList.contains('hidden');
            openPickers.forEach(function (p) { p.close(); });
            if (!opening) return;
            pop.classList.remove('hidden');
            pop.classList.remove('align-right');
            if (pop.getBoundingClientRect().right > window.innerWidth - 8) pop.classList.add('align-right');
          });
          pop.addEventListener('click', function (e) { e.stopPropagation(); });
          wrap.appendChild(btn);
          wrap.appendChild(pop);
          show();
          openPickers.push({ close: close });
          return { node: wrap, value: function () { return current; }, onChange: function (fn) { listener = fn; } };
        }
        document.addEventListener('click', function () { openPickers.forEach(function (p) { p.close(); }); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') openPickers.forEach(function (p) { p.close(); }); });

        // A colour swatch to pick from, with its hex value beside it. Empty means no colour.
        function colorField(value, onChange) {
          var wrap = el('div', 'color-field');
          var picker = el('input');
          picker.type = 'color';
          picker.value = COLOR_RE.test(value || '') ? value : '#3b5bdb';
          picker.setAttribute('aria-label', 'Pick a colour');
          var text = textInput(value || '', 7);
          text.placeholder = 'None';
          text.setAttribute('aria-label', 'Colour as a hex value');
          function sync() { wrap.classList.toggle('is-empty', !text.value.trim()); }
          picker.addEventListener('input', function () { text.value = picker.value; sync(); if (onChange) onChange(); });
          text.addEventListener('input', function () {
            if (COLOR_RE.test(text.value.trim())) picker.value = text.value.trim();
            sync();
            if (onChange) onChange();
          });
          sync();
          wrap.appendChild(picker);
          wrap.appendChild(text);
          return { node: wrap, value: function () { return text.value.trim(); } };
        }

        // Keeps a card's Save button and "unsaved" edge in step with its fields.
        // `read()` returns the card's current values; Save sends only the ones that differ from `original`.
        function trackCard(card, read, save) {
          var original = read();
          function changes() {
            var now = read();
            var out = {};
            Object.keys(now).forEach(function (k) { if (now[k] !== original[k]) out[k] = now[k]; });
            return out;
          }
          function refresh() {
            var dirty = Object.keys(changes()).length > 0;
            save.disabled = !dirty;
            card.classList.toggle('is-dirty', dirty);
            if (dirty) dirtyCards.add(card); else dirtyCards.delete(card);
          }
          card.addEventListener('input', refresh);
          card.addEventListener('change', refresh);
          refresh();
          return {
            changes: changes,
            refresh: refresh,
            saved: function () { original = read(); refresh(); }
          };
        }

        // True when it is fine to redraw the lists: nothing is unsaved, or the person agrees to lose it.
        function confirmDiscard() {
          return !dirtyCards.size || confirm('Some changes on this page have not been saved. Continue and lose them?');
        }

        // Redraws the lists from the server. Cards with unsaved changes are never thrown away, so unless
        // `force` is set nothing is redrawn while one exists; the next tab change picks the new data up.
        function reload(force) {
          return cfgApi('api/admin/catalog').then(function (c) {
            cfg.catalog = c;
            if (dirtyCards.size && !force) { cfg.stale = true; return; }
            cfg.stale = false;
            renderAll();
            if (cfg.translations && !translationsDirty()) loadTranslations(true);
          });
        }

        function renderAll() {
          dirtyCards.clear();
          fillSelect($('svc-new-group'), cfg.catalog.groups.map(function (g) { return { value: g.id, label: g.label }; }), 'No department group');
          renderServices();
          renderGroups();
          renderLanguages();
          updateTranslationBadge();
          cfg.saved = '';
        }

        function langName(code) {
          var l = cfg.catalog.languages.filter(function (x) { return x.code === code; })[0];
          return l ? l.name : code;
        }

        // Shows on the Translations tab how many items the languages that are on still lack, so it is hard to miss.
        function updateTranslationBadge() {
          var total = 0;
          cfg.catalog.languages.forEach(function (l) { if (l.enabled && l.code !== 'en' && l.untranslated) total += l.untranslated; });
          var badge = $('tr-badge');
          badge.textContent = total ? String(total) : '';
          badge.title = total + (total === 1 ? ' item' : ' items') + ' still to translate';
          badge.classList.toggle('hidden', !total);
        }

        // Opens the Translations tab for one language, showing only what is still to translate, and scrolls to one item
        // when its key is given. The key is kept until the item is on screen, because the list may still be loading.
        function openTranslations(lang, focusKey) {
          if (lang && $('tr-lang').value !== lang && !translationsDirty()) {
            $('tr-lang').value = lang;
            cfg.trLang = lang;
            cfg.translations = null;
          }
          cfg.focusKey = focusKey || '';
          $('tr-todo').checked = true;
          showSection('translations');
          if (cfg.translations) { applyTodoFilter(); focusTranslation(); }
        }

        function translateService(code) {
          var svc = cfg.catalog.services.filter(function (s) { return s.code === code; })[0];
          var missing = svc && svc.untranslated ? svc.untranslated : [];
          openTranslations(missing[0], 'service.' + code + '.name');
        }

        function focusTranslation() {
          if (!cfg.focusKey) return;
          var input = $('tr-body').querySelector('[data-key="' + cfg.focusKey + '"]');
          if (!input) return;
          cfg.focusKey = '';
          input.scrollIntoView({ block: 'center' });
          input.focus();
        }

        // After a service is added: it is already in the Translations list with nothing translated, and the kiosk shows its
        // English text in the other languages until it is. Says so, and offers to go and translate it.
        function offerTranslation(msg, code) {
          var svc = cfg.catalog.services.filter(function (s) { return s.code === code; })[0];
          var missing = svc && svc.untranslated ? svc.untranslated : [];
          if (!missing.length) return;
          msg.appendChild(document.createTextNode(' It is not translated into ' + missing.map(langName).join(' or ') + ' yet, so the kiosk shows its English text there. '));
          var go = el('button', 'link-btn', 'Translate it now');
          go.type = 'button';
          go.addEventListener('click', function () { translateService(code); });
          msg.appendChild(go);
        }

        // After a save the lists are drawn again, so the "Saved." note is put back on the card that was saved.
        function flashSaved(id, msg) {
          if (cfg.saved === id) setMsg(msg, 'Saved.', true);
        }

        // ---- Services ----

        function serviceCard(s) {
          var card = el('article', 'item-card' + (s.active ? '' : ' is-off'));
          var preview = el('span', 'icon-preview');
          setIcon(preview, s.icon);
          var icon = iconPicker(s.icon, function (name) { setIcon(preview, name); card.dispatchEvent(new Event('change', { bubbles: true })); });
          var name = textInput(s.name, 100);
          var description = textInput(s.description, 255);
          var group = groupSelect(s.groupId);
          var color = colorField(s.color, function () { card.dispatchEvent(new Event('change', { bubbles: true })); });
          var active = checkbox(s.active);
          var asks = checkbox(s.asksAppointment);
          var pinned = checkbox(s.pinned);
          var save = el('button', 'primary', 'Save');
          save.type = 'button';
          var remove = el('button', 'danger', 'Delete');
          remove.type = 'button';
          var msg = el('p', 'row-msg');

          var head = el('div', 'item-head');
          head.appendChild(preview);
          head.appendChild(el('span', 'item-code', s.code));
          if (!s.active) head.appendChild(el('span', 'pill', 'Off'));
          if (s.asksAppointment) head.appendChild(el('span', 'pill', 'Appointments'));
          if (s.pinned) head.appendChild(el('span', 'pill', 'Pinned'));
          if (s.active && s.untranslated && s.untranslated.length) {
            var needs = el('button', 'pill warn', 'Needs translation');
            needs.type = 'button';
            needs.title = 'Not translated into ' + s.untranslated.map(langName).join(' or ') + ' yet, so the kiosk shows the English text there. Click to translate.';
            needs.addEventListener('click', function () { translateService(s.code); });
            head.appendChild(needs);
          }
          var notes = [];
          if (s.hasTickets) notes.push('Has customers on record');
          if (s.openCount) notes.push(s.openCount + ' waiting or being helped now');
          if (notes.length) head.appendChild(el('span', 'item-note', notes.join(' · ')));
          head.appendChild(el('span', 'spacer'));
          var sw = el('label', 'switch');
          sw.appendChild(active);
          sw.appendChild(document.createTextNode('Show on kiosk'));
          head.appendChild(sw);

          var fields = el('div', 'fields');
          fields.appendChild(field('Name', name, 'c5'));
          fields.appendChild(field('Description', description, 'c7'));
          fields.appendChild(field('Icon', icon.node, 'c4'));
          fields.appendChild(field('Department group', group, 'c4'));
          fields.appendChild(field('Monitor colour', color.node, 'c4', 'When not in a group'));
          var options = el('div', 'option-row');
          [[asks, 'Asks who they are seeing and the appointment time', 'The kiosk and the walk-in form ask the two questions.'],
            [pinned, 'Always in staff watched queues', 'Staff cannot unwatch it, and it sits first in their list.']].forEach(function (o) {
            var label = el('label', 'switch');
            label.appendChild(o[0]);
            var text = el('span', null, o[1]);
            text.appendChild(el('small', null, o[2]));
            label.appendChild(text);
            options.appendChild(label);
          });
          fields.appendChild(options);

          var foot = el('div', 'item-foot');
          foot.appendChild(msg);
          foot.appendChild(remove);
          foot.appendChild(save);
          card.appendChild(head);
          card.appendChild(fields);
          card.appendChild(foot);

          flashSaved('svc:' + s.code, msg);
          var track = trackCard(card, function () {
            return {
              name: name.value.trim(), description: description.value.trim(), icon: icon.value(),
              groupId: group.value, color: color.value(), active: active.checked, asksAppointment: asks.checked, pinned: pinned.checked
            };
          }, save);

          save.addEventListener('click', function () {
            var body = track.changes();
            if (body.active === false) {
              var warning = '';
              if (s.openCount) warning += s.openCount + ' customer(s) are waiting or being helped for ' + s.code + ' today. If you turn it off, they disappear from the queue screens. ';
              if (s.pinned) warning += s.code + ' is pinned in every staff member\'s watched queues, and that goes with it. ';
              if (s.asksAppointment) warning += 'Customers can no longer check in for appointments with it. ';
              if (warning && !confirm(warning + 'Turn it off anyway?')) return;
            }
            save.disabled = true;
            setMsg(msg, '');
            cfgApi('api/admin/services/' + encodeURIComponent(s.code), { method: 'PATCH', body: JSON.stringify(body) })
              .then(function () { track.saved(); setMsg(msg, 'Saved.', true); cfg.saved = 'svc:' + s.code; return reload(); })
              .catch(function (err) { setMsg(msg, err.message); track.refresh(); });
          });
          remove.addEventListener('click', function () {
            var extra = s.asksAppointment || s.pinned ? ' It is set up for appointments or pinned in staff queues, and that goes with it.' : '';
            if (!confirm('Delete ' + s.code + ' (' + s.name + ')? This cannot be undone.' + extra)) return;
            cfgApi('api/admin/services/' + encodeURIComponent(s.code), { method: 'DELETE' })
              .then(function () { dirtyCards.delete(card); card.remove(); return reload(); })
              .catch(function (err) { setMsg(msg, err.message); });
          });
          return card;
        }

        function renderList(list, items, build, emptyText) {
          list.textContent = '';
          if (!items.length) { list.appendChild(el('div', 'empty', emptyText)); return; }
          items.forEach(function (item) { list.appendChild(build(item)); });
        }

        function renderServices() {
          renderList($('svc-list'), cfg.catalog.services, serviceCard, 'No services yet. Add one above.');
          buildBoard();
        }

        // ---- Kiosk layout board ----
        // board.rows is the layout being worked on: a list of rows, each a list of service codes in order. It
        // starts as the saved layout. Moving a tile only changes board.rows; Save layout sends it to the server.
        var board = { rows: [], saved: '', services: {} };

        function boardSnapshot() { return JSON.stringify(board.rows.filter(function (r) { return r.length; })); }

        // Builds the board from the saved services: those turned on, grouped by their row, in the order the server
        // lists them. A service with no row yet goes on a last row of its own.
        function buildBoard() {
          board.services = {};
          var byRow = {};
          var loose = [];
          cfg.catalog.services.filter(function (s) { return s.active; }).forEach(function (s) {
            board.services[s.code] = s;
            if (s.row >= 1) (byRow[s.row] = byRow[s.row] || []).push(s.code); else loose.push(s.code);
          });
          board.rows = Object.keys(byRow).map(Number).sort(function (a, b) { return a - b; }).map(function (n) { return byRow[n]; });
          if (loose.length) board.rows.push(loose);
          board.saved = boardSnapshot();
          renderBoard();
          if (cfg.flashLayout) { setMsg($('layout-msg'), 'Layout saved. The kiosk has it now.', true); cfg.flashLayout = false; }
        }

        function boardChip(code) {
          var s = board.services[code];
          var chip = el('button', 'tile-chip');
          chip.type = 'button';
          chip.setAttribute('data-code', code);
          chip.title = s.name;
          chip.setAttribute('aria-label', code + ', ' + s.name + '. Use the arrow keys to move it.');
          if (s.icon) {
            var ic = el('span', 'icon-preview');
            setIcon(ic, s.icon);
            chip.appendChild(ic);
          }
          chip.appendChild(el('span', 'nm', s.name));
          chip.addEventListener('pointerdown', function (e) { startDrag(e, chip); });
          chip.addEventListener('keydown', function (e) { moveByKey(e, code); });
          return chip;
        }

        function renderBoard() {
          var host = $('svc-layout');
          host.textContent = '';
          board.rows.forEach(function (codes, r) {
            var line = el('div', 'board-row' + (codes.length > MAX_TILES ? ' is-long' : ''));
            line.appendChild(el('span', 'row-label', 'Row ' + (r + 1)));
            var zone = el('div', 'board-zone');
            zone.setAttribute('data-row', String(r));
            if (!codes.length) zone.appendChild(el('span', 'zone-empty', 'Empty. Drag a service here, or remove the row.'));
            codes.forEach(function (code) { zone.appendChild(boardChip(code)); });
            line.appendChild(zone);
            var tools = el('div', 'board-tools');
            var remove = el('button', null, 'Remove row');
            remove.type = 'button';
            remove.disabled = codes.length > 0;
            remove.title = codes.length ? 'Move its services to another row first' : 'Remove this empty row';
            remove.addEventListener('click', function () { board.rows.splice(r, 1); renderBoard(); });
            tools.appendChild(remove);
            line.appendChild(tools);
            host.appendChild(line);
          });
          if (!board.rows.length) host.appendChild(el('div', 'empty', 'There are no services on the kiosk.'));
          updateBoardState();
        }

        // The Save and Discard buttons, the warnings, and whether the page counts this panel as unsaved.
        function updateBoardState() {
          var box = $('svc-layout-box');
          var dirty = boardSnapshot() !== board.saved;
          $('layout-save').disabled = !dirty;
          $('layout-discard').disabled = !dirty;
          box.classList.toggle('is-dirty', dirty);
          if (dirty) dirtyCards.add(box); else dirtyCards.delete(box);
          var wide = [];
          board.rows.forEach(function (codes, r) { if (codes.length > MAX_TILES) wide.push(r + 1); });
          var text = '';
          if (wide.length) text = 'Row ' + wide.join(', ') + (wide.length === 1 ? ' has' : ' have') + ' more than ' + MAX_TILES + ' services. They may wrap onto a second line on a smaller kiosk screen. ';
          if (board.rows.some(function (r) { return !r.length; })) text += 'Empty rows are left out when you save. ';
          var off = cfg.catalog.services.filter(function (s) { return !s.active; }).map(function (s) { return s.code; });
          if (off.length) text += 'Turned off, so not shown: ' + off.join(', ') + '.';
          $('svc-layout-note').textContent = text.trim();
          $('svc-layout-note').classList.toggle('warn', wide.length > 0);
          if (dirty) setMsg($('layout-msg'), '');
        }

        // Takes a service out of wherever it is and puts it at `index` in row `toRow` (or on a new row last when
        // toRow is 'new'). `index` counts the row without the service in it.
        function moveTile(code, toRow, index) {
          board.rows.forEach(function (codes) {
            var at = codes.indexOf(code);
            if (at >= 0) codes.splice(at, 1);
          });
          if (toRow === 'new') board.rows.push([code]);
          else board.rows[toRow].splice(Math.max(0, Math.min(index, board.rows[toRow].length)), 0, code);
          renderBoard();
        }

        // Arrow keys: left and right along the row, up and down to the next row.
        function moveByKey(e, code) {
          var keys = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
          var step = keys[e.key];
          if (!step) return;
          var row = -1;
          var at = -1;
          board.rows.forEach(function (codes, r) { if (codes.indexOf(code) >= 0) { row = r; at = codes.indexOf(code); } });
          var toRow = row + step[0];
          if (row < 0 || toRow < 0 || toRow >= board.rows.length) { e.preventDefault(); return; }
          var length = board.rows[toRow].length - (toRow === row ? 1 : 0);
          var index = toRow === row ? at + step[1] : Math.min(at, length);
          if (index < 0 || index > length) { e.preventDefault(); return; }
          e.preventDefault();
          moveTile(code, toRow, index);
          var moved = $('svc-layout').querySelector('[data-code="' + code + '"]');
          if (moved) moved.focus();
        }

        // Where a dragged tile would land if let go at this point: a row and a place in it, or a new row.
        function dropTarget(x, y, code) {
          var under = document.elementFromPoint(x, y);
          if (!under) return null;
          if (under.closest('#layout-add-row')) return { row: 'new' };
          var zone = under.closest('.board-zone');
          if (!zone) {
            var line = under.closest('.board-row');
            zone = line && line.querySelector('.board-zone');
          }
          if (!zone) return null;
          var chips = Array.prototype.filter.call(zone.querySelectorAll('.tile-chip'), function (c) { return c.getAttribute('data-code') !== code; });
          var index = chips.length;
          for (var i = 0; i < chips.length; i++) {
            var b = chips[i].getBoundingClientRect();
            if (y < b.top || (y <= b.bottom && x < b.left + b.width / 2)) { index = i; break; }
          }
          return { row: Number(zone.getAttribute('data-row')), index: index, zone: zone, before: chips[index] || null };
        }

        // Dragging with the pointer, so a mouse, a pen and a finger all work. A tile follows the pointer once it has
        // moved a few pixels, and a bar shows where it would land.
        function startDrag(e, chip) {
          if (e.button !== undefined && e.button !== 0) return;
          var code = chip.getAttribute('data-code');
          var box = chip.getBoundingClientRect();
          var offsetX = e.clientX - box.left;
          var offsetY = e.clientY - box.top;
          var startX = e.clientX;
          var startY = e.clientY;
          var ghost = null;
          var marker = null;
          var lastZone = null;

          function clearHints() {
            if (marker) { marker.remove(); marker = null; }
            if (lastZone) { lastZone.classList.remove('is-over'); lastZone = null; }
            $('layout-add-row').classList.remove('is-over');
          }
          function move(ev) {
            if (!ghost) {
              if (Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) < 6) return;
              ghost = chip.cloneNode(true);
              ghost.classList.add('drag-ghost');
              ghost.style.width = box.width + 'px';
              $('panel-catalog').appendChild(ghost);
              chip.classList.add('is-dragging');
            }
            ev.preventDefault();
            ghost.style.left = (ev.clientX - offsetX) + 'px';
            ghost.style.top = (ev.clientY - offsetY) + 'px';
            // Near the top or bottom of the window, scroll so a far row can be reached.
            if (ev.clientY < 70) window.scrollBy(0, -14);
            else if (ev.clientY > window.innerHeight - 70) window.scrollBy(0, 14);
            clearHints();
            var target = dropTarget(ev.clientX, ev.clientY, code);
            if (!target) return;
