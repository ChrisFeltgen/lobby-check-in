<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Management · Lobby Check-In</title>
  <link rel="stylesheet" href="app.css">
  <script src="theme.js"></script>
  <style>
    body { font-size: 15px; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    button { font-size: 15px; min-height: 36px; padding: 6px 14px; border-radius: 8px; }
    button.primary { background: #1f6feb; color: #fff; border: 0; font-weight: 600; }
    button.ghost { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, 0.55); }
    button.secondary { font-weight: 500; }
    button.danger { background: var(--danger); color: #fff; border: 0; }
    .card, .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }

    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; background: linear-gradient(90deg, #0a4670 0%, #0b6a9c 100%); color: #fff; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo-wrap { background: #fff; border-radius: 8px; padding: 4px 8px; display: flex; }
    .logo { max-height: 40px; width: auto; display: block; }
    .top h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .top .sub { margin: 2px 0 0; font-size: 14px; opacity: 0.85; }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    /* Header links and buttons share one height and look: links are plain text with a highlight on hover. */
    .top-actions a { color: #fff; text-decoration: none; display: inline-flex; align-items: center; height: 38px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 15px; white-space: nowrap; transition: background-color 0.12s ease; }
    .top-actions a:hover { background: rgba(255, 255, 255, 0.14); }
    .top-actions a[aria-current="page"] { background: rgba(255, 255, 255, 0.2); }
    /* Narrow windows: the header wraps, and the links stay together below the title. */
    @media (max-width: 720px) {
      .top { flex-wrap: wrap; }
      .top-actions { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
    }
    .top-actions button.ghost { height: 38px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 15px; border: 1px solid rgba(255, 255, 255, 0.55); }
    .top-actions button.ghost:hover { background: rgba(255, 255, 255, 0.14); }
    .top-actions .divider { width: 1px; align-self: stretch; background: rgba(255, 255, 255, 0.3); margin: 0 2px; }

    /* Tabs: which ones exist is fixed, but which the signed-in account can actually use is
       permission-gated at start() the same way the page itself is — see showTab/start. */
    /* Main tabs: text tabs on a divider line, with an accent underline on the open one. */
    /* On a narrow screen the tabs scroll sideways instead of running off the page. */
    .tabs { display: flex; gap: 6px; max-width: 1000px; margin: 12px auto 0; padding: 0 20px; box-shadow: inset 0 -1px 0 var(--border); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { flex: none; white-space: nowrap; background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: var(--muted); padding: 10px 14px 10px; min-height: 0; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; transition: color 0.12s ease, border-color 0.12s ease; }
    .tab-btn:hover { color: var(--fg); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    main { max-width: 1000px; margin: 0 auto; padding: 20px; }
    .tab-panel { display: flex; flex-direction: column; gap: 16px; }
    .panel { padding: 16px 18px; }
    .panel h2 { margin: 0 0 12px; font-size: 16px; }
    .msg { min-height: 20px; margin: 0; color: var(--danger); font-size: 14px; }
    .notice { padding: 40px 20px; text-align: center; }
    .notice a { color: #1f6feb; }

    form.inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; align-items: end; }
    form.inline label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    /* Department lists span the whole row, with their choices in as many columns as fit. */
    .save-bar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; padding: 12px 0; background: var(--bg); border-top: 1px solid var(--border); }
    .save-bar .msg { margin: 0; }
    .settings-columns { display: flex; flex-direction: column; gap: 18px; }
    .settings-columns > .settings-group { min-width: 0; }
    .key-picks { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 4px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
    .key-picks .check-row { font-size: 14px; min-width: 0; line-height: 1.3; }
    .key-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 24px; }
    .key-row > .key-field { flex: 1 1 280px; min-width: 0; }
    .key-field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); min-width: 0; }
    .field-label { font-size: 14px; color: var(--muted); }
    .logo-line { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
    .logo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logo-preview { max-height: 48px; width: auto; background: #fff; border-radius: 6px; padding: 4px 8px; }
    .logo-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    /* Access links for the kiosk and monitor, on the Security tab. */
    /* The access links are their own block under the switch: a rule above, a heading, one line of explanation, the form,
       then the list. Empty message and result areas take no room until they have something to say. */
    .links-block { gap: 12px; margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--border); }
    .links-title { margin: 0; font-size: 15px; font-weight: 700; color: var(--fg); }
    .links-block > .msg:empty, .links-block > div:empty { display: none; }
    .links-block form.inline { margin: 0; }
    .links-block .links-table { margin: 0; }
    .links-intro { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
    .links-table td, .links-table th { vertical-align: middle; }
    .links-table td.when { white-space: nowrap; font-size: 13px; color: var(--muted); }
    .link-result { border: 2px solid #2e9e5b; border-radius: 10px; padding: 12px 14px; background: color-mix(in srgb, #2e9e5b 8%, var(--card)); display: flex; flex-direction: column; gap: 8px; }
    .link-result p { margin: 0; font-size: 14px; color: var(--fg); }
    .link-result code { display: block; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); font-size: 13px; word-break: break-all; user-select: all; color: var(--fg); }
    .link-result .link-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .link-result .link-actions label { display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .audit-search { width: 100%; max-width: 360px; min-height: 38px; margin: 0 0 12px; padding: 6px 10px; font-size: 15px; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    form.inline input, form.inline select { min-height: 38px; padding: 6px 10px; font-size: 15px; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    /* A checkbox with its label beside it, not the full-size text-field style above. */
    form.inline label.check-row { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); }
    form.inline label.check-row input[type="checkbox"] { width: 16px; height: 16px; min-height: 0; padding: 0; margin: 0; flex: none; }

    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .role-pill { font-size: 12px; font-weight: 700; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
    .role-staff { background: #e7f0ff; color: #0a3d8f; }
    .role-manager { background: #fdf0d5; color: #9a5b00; }
    .role-admin { background: #f4d9e4; color: #8a1550; }
    .inactive { opacity: 0.55; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .row-actions select { min-height: 32px; font-size: 13px; }
    .row-actions button { min-height: 32px; padding: 4px 10px; font-size: 13px; }

    .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .panel-head h2 { margin: 0; font-size: 18px; }
    .panel-head .route { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 8px; }
    .status-pill { font-size: 12px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    .status-open { background: #dcf3e3; color: #166a37; }
    .status-closed { background: #fdf0d5; color: #9a5b00; }
    .svc-card.is-closed .status-closed { background: color-mix(in srgb, var(--danger) 16%, var(--card)); color: var(--danger); }
    .svc-lead { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .closed-icon { flex: none; width: 44px; height: 44px; border-radius: 12px; background: color-mix(in srgb, var(--danger) 14%, var(--card)); color: var(--danger); display: flex; align-items: center; justify-content: center; }
    .closed-icon svg { width: 28px; height: 28px; }
    .closed-sub { font-size: 14px; color: var(--danger); margin-top: 2px; }
    .closure-reason { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .cr-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
    .cr-text { font-size: 16px; margin-top: 2px; }
    .reopen-row { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
    .reopen-row strong { display: block; font-size: 15px; }
    .reopen-icon { flex: none; color: var(--muted); display: flex; }
    .reopen-icon svg { width: 30px; height: 30px; }
    .reopen-until { font-size: 14px; color: var(--muted); }
    .svc-actions button svg { width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; }
    .current-reason { margin: 8px 0 0; font-size: 14px; color: #9a5b00; }

    .override-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    .inline-form { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; }
    .inline-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    .inline-form input, .inline-form select { min-height: 38px; padding: 6px 10px; font-size: 15px; color: var(--fg); }
    .inline-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .inline-form .checks { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; }
    .inline-form .checks label { flex-direction: row; align-items: center; gap: 6px; font-size: 14px; color: var(--fg); }
    .inline-form .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .inline-form .err { margin: 0; min-height: 18px; font-size: 14px; color: var(--danger); }

    .schedules-head { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
    .schedule-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .schedule-when { font-size: 14px; font-weight: 600; }
    .schedule-message { font-size: 13px; color: var(--muted); }
    .schedule-actions { display: flex; gap: 6px; }
    .schedule-actions button { min-height: 30px; padding: 3px 10px; font-size: 13px; }
    /* Delete here is destructive, but a light tint keeps it from dominating the card. */
    .schedule-actions button.danger, .row-actions button.danger { background: color-mix(in srgb, var(--danger) 12%, var(--card)); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--card)); }
    .schedule-actions button.danger:hover, .row-actions button.danger:hover { background: color-mix(in srgb, var(--danger) 20%, var(--card)); }
    .schedule-row.paused { opacity: 0.5; }
    .schedule-row.last-row { border-bottom: 0; }
    .empty { font-size: 14px; color: var(--muted); padding: 4px 0; }

    /* Services tab: one card per service, in a grid so the list needs less scrolling. */
    #panel-services { display: flex; flex-direction: column; gap: 14px; }
    .open-screens { display: flex; flex-direction: column; gap: 10px; }
    .open-screens h2 { margin: 0; }
    .open-screens-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .open-screen-btn { display: inline-flex; align-items: center; min-height: 38px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-weight: 600; text-decoration: none; }
    .open-screen-btn:hover { background: var(--bg); }
    .svc-toolbar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
    .svc-search { flex: 1 1 220px; max-width: 340px; min-height: 38px; padding: 6px 10px; font-size: 15px; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    .svc-filters { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .svc-filter { background: var(--card); color: var(--fg); border: 0; border-right: 1px solid var(--border); border-radius: 0; padding: 6px 14px; min-height: 36px; font-size: 14px; font-weight: 600; }
    .svc-filter:last-child { border-right: 0; }
    .svc-filter.active { background: var(--accent); color: #fff; }
    .svc-summary { margin-left: auto; font-size: 14px; color: var(--muted); }
    .svc-section h3 { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
    .svc-section h3 .count { font-weight: 400; }
    .svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; align-items: start; }
    .svc-card { padding: 12px 14px; border-left: 4px solid var(--muted); display: flex; flex-direction: column; gap: 10px; }
    .svc-card > div:empty { display: none; }
    .svc-card.is-open { border-left-color: #2e9e5b; }
    .svc-card.is-closed { border-left-color: var(--danger); }
    .svc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .svc-title h2 { margin: 0; font-size: 16px; line-height: 1.25; }
    .svc-code { margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .svc-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .svc-actions .spacer { flex: 1; }
    .svc-actions button { min-height: 34px; padding: 4px 12px; font-size: 14px; }
    .svc-actions button.sched-toggle { font-weight: 500; color: var(--muted); }
    .svc-actions button.sched-toggle.has-schedules { color: var(--fg); }
    .svc-caption { margin: 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
    .svc-sched { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
    .svc-sched.hidden { display: none; }
    .closed-banner { font-size: 14px; line-height: 1.4; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--danger) 12%, var(--card)); color: var(--danger); }
    .closed-reopen { font-size: 13px; color: var(--muted); padding: 0 4px; }
    .override-row { margin-top: 0; }
    .health-ok { font-weight: 600; color: #2e9e5b; margin: 0 0 8px; }
    .settings-group { display: flex; flex-direction: column; gap: 10px; }
    .settings-group-title { margin: 6px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
    .settings-grid > .panel { margin: 0; }
    .test-output { margin: 12px 0 0; padding: 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.4; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    /* Inline name and User ID editing inside an accounts row: compact fields that fit the table. */
    tr.editing td { vertical-align: middle; }
    tr.editing input { width: 100%; min-width: 140px; min-height: 34px; padding: 4px 8px; font-size: 14px; box-sizing: border-box; border-radius: 6px; }
    tr.editing .row-actions { white-space: nowrap; }
    .edit-hint { font-size: 13px; color: var(--muted); }
    /* Edit account window */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
    .modal { width: min(460px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
    .modal h3 { margin: 0; font-size: 18px; }
    .modal h4 { margin: 10px 0 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; }
    .modal label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    .modal input, .modal select { min-height: 38px; padding: 6px 10px; font-size: 15px; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    .modal label.check-row { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); }
    .modal label.check-row input[type="checkbox"] { width: 16px; height: 16px; min-height: 0; padding: 0; margin: 0; }
    .modal .err { margin: 0; min-height: 18px; font-size: 14px; color: var(--danger); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .modal .reset-row { display: flex; gap: 8px; align-items: center; }
    .modal .reset-row input { flex: 1; min-width: 0; }
    .modal .reset-row button { flex: none; min-height: 38px; }
    .modal label.check-row { font-size: 13px; }
    /* Fixed column widths: editing a row must not re-flow the other rows. */
    .staff-table { table-layout: fixed; }
    .staff-table th:nth-child(1) { width: 20%; }
    .staff-table th:nth-child(2) { width: 14%; }
    .staff-table th:nth-child(3) { width: 11%; }
    .staff-table th:nth-child(4) { width: 9%; }
    .staff-table th:nth-child(5) { width: 19%; }
    .staff-table th:nth-child(6) { width: 27%; }
    .staff-table td { overflow-wrap: anywhere; }
    .staff-table td:nth-child(5) { white-space: nowrap; }
    /* Narrow screens: the accounts table scrolls sideways instead of squeezing its buttons. */
    .table-scroll { overflow-x: auto; }
    .table-scroll .staff-table { min-width: 720px; }
    /* The add-account form: the fields in a row, then the tick box and the button together beneath them. */
    .form-actions { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
    .form-actions label.check-row { flex: 1 1 280px; }
    .form-actions button { flex: none; }
    .schedules-head { margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
    .add-schedule { width: 100%; border-style: dashed; }

    /* Reports dialog: opened from the header, one day at a time */
    .report-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .report-filters, .report-actions { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    .report-actions button { min-height: 38px; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; }
    .report-field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    .report-head input { min-height: 36px; padding: 4px 8px; font-size: 15px; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    .report-search { min-width: 200px; }
    .report-body tr.person-total td { font-weight: 700; }
    .report-body tr.service-row td { color: var(--muted); }
    .report-body tr.service-row td:first-child { padding-left: 28px; }
    .print-title { display: none; }
    /* Printing: just the report, in black on white, without the controls. */
    @media print {
      body * { visibility: hidden; }
      #panel-reports, #panel-reports * { visibility: visible; }
      #panel-reports { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
      .report-head, .report-views, .report-export, .report-print, .report-search { display: none !important; }
      .print-title { display: block !important; margin: 0 0 8px; font-size: 18pt; color: #000; }
      .report-body, .panel { overflow: visible !important; background: #fff !important; color: #000 !important; border: 0 !important; box-shadow: none !important; padding: 0 !important; }
      .report-body table, .report-body th, .report-body td, .report-summary { color: #000 !important; }
      .report-body tr { page-break-inside: avoid; }
    }
    /* View switcher: one connected control, so the views read as a set of alternatives. */
    .report-views { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; align-self: flex-start; }
    .report-view { background: var(--card); border: 0; border-right: 1px solid var(--border); border-radius: 0; color: var(--fg); padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 38px; }
    .report-view:last-child { border-right: 0; }
    .report-view.active { background: var(--accent); color: #fff; }
    .report-summary { font-size: 14px; color: var(--muted); margin: 0; }
    .report-body { overflow-x: auto; }
    .report-body table { font-size: 14px; }
    .report-body td.r, .report-body th.r { text-align: right; font-variant-numeric: tabular-nums; }
    .report-body tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--border); }
    .bar-cell { min-width: 180px; }
    .bar-line { display: flex; align-items: center; gap: 8px; }
    .bar-track { flex: 1; height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; }
    .bar-fill.arrivals { background: var(--accent); }
    .bar-fill.served { background: #166a37; }
    .bar-num { min-width: 28px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ---- Service Configuration tab (it was its own page). Every rule is scoped to the tab. ---- */
    /* Sections inside this page: connected switcher, like the report views on Management. */
    #panel-catalog .subtabs { display: inline-flex; max-width: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; border: 1px solid var(--border); border-radius: 8px; margin: 0 0 16px; background: var(--card); }
    #panel-catalog .subtab-btn { flex: none; background: var(--card); color: var(--fg); border: 0; border-right: 1px solid var(--border); border-radius: 0; min-height: 38px; padding: 8px 16px; font-weight: 600; font-size: 14px; white-space: nowrap; }
    #panel-catalog .subtab-btn:last-child { border-right: 0; }
    #panel-catalog .subtab-btn:hover { background: var(--bg); }
    #panel-catalog .subtab-btn.active { background: var(--accent); color: var(--accent-fg); }

    #panel-catalog h2 { margin: 0 0 4px; font-size: 18px; }
    #panel-catalog .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
    #panel-catalog .intro { margin: 0 0 14px; font-size: 14px; line-height: 1.45; color: var(--muted); }
    #panel-catalog .msg { min-height: 20px; margin: 0; font-size: 14px; color: var(--danger); }
    #panel-catalog .msg.ok { color: #2e9e5b; }

    #panel-catalog input, #panel-catalog select, #panel-catalog textarea, #panel-catalog button { font-family: inherit; }
    #panel-catalog input[type="text"], #panel-catalog input[type="number"], #panel-catalog select, #panel-catalog textarea { width: 100%; min-height: 38px; padding: 6px 10px; font-size: 15px; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    #panel-catalog textarea { resize: vertical; line-height: 1.35; }
    #panel-catalog input[type="checkbox"] { width: 16px; height: 16px; min-height: 0; padding: 0; margin: 0; flex: none; }
    #panel-catalog input:focus-visible, #panel-catalog select:focus-visible, #panel-catalog textarea:focus-visible, #panel-catalog button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    #panel-catalog button { min-height: 38px; padding: 6px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--fg); }
    #panel-catalog button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    #panel-catalog button.danger { background: color-mix(in srgb, var(--danger) 10%, var(--card)); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--card)); }
    #panel-catalog button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 18%, var(--card)); }
    #panel-catalog button:disabled { opacity: 0.45; cursor: default; }

    /* Labelled fields in a 12-column grid. Each field says how many columns it takes. */
    #panel-catalog .fields { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
    #panel-catalog .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; grid-column: span 12; }
    #panel-catalog .field .hint { font-size: 12px; font-weight: 400; }
    @media (min-width: 720px) {

      #panel-catalog .c3 { grid-column: span 3; } #panel-catalog .c2 { grid-column: span 2; } #panel-catalog .c4 { grid-column: span 4; } #panel-catalog .c5 { grid-column: span 5; } #panel-catalog .c6 { grid-column: span 6; } #panel-catalog .c7 { grid-column: span 7; }
    }
    @media (min-width: 480px) and (max-width: 719px) {
 #panel-catalog .c2, #panel-catalog .c3, #panel-catalog .c4 { grid-column: span 6; } }

    /* Adding: a closed section until it is needed, so the list stays in front. */
    #panel-catalog details.add { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
    #panel-catalog details.add > summary { cursor: pointer; padding: 12px 18px; font-weight: 700; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 8px; border-radius: 10px; }
    #panel-catalog details.add > summary::-webkit-details-marker { display: none; }
    /* The plus and minus are drawn with gradients, not text, so they sit exactly in the middle of the circle. */
    #panel-catalog details.add > summary::before { content: ""; display: inline-block; flex: none; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(var(--accent-fg), var(--accent-fg)) center / 10px 2px no-repeat, linear-gradient(var(--accent-fg), var(--accent-fg)) center / 2px 10px no-repeat, var(--accent); }
    #panel-catalog details.add[open] > summary::before { background: linear-gradient(var(--accent-fg), var(--accent-fg)) center / 10px 2px no-repeat, var(--accent); }
    #panel-catalog details.add > summary:hover { background: var(--bg); }
    #panel-catalog details.add .add-body { padding: 4px 18px 16px; border-top: 1px solid var(--border); padding-top: 14px; }
    #panel-catalog .form-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    #panel-catalog .form-foot .msg { flex: 1; min-width: 160px; }

    /* One card per service or group: its header, its fields, and its own Save. */
    #panel-catalog .list { display: flex; flex-direction: column; gap: 12px; }
    #panel-catalog .item-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
    #panel-catalog .item-card.is-off { border-left-color: var(--muted); }
    #panel-catalog .item-card.is-off .item-code, #panel-catalog .item-card.is-off .icon-preview { opacity: 0.6; }
    #panel-catalog .item-card.is-dirty { border-color: var(--accent); }
    #panel-catalog .item-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 30px; }
    #panel-catalog .item-code { font-size: 16px; font-weight: 700; }
    #panel-catalog .item-note { font-size: 13px; color: var(--muted); }
    #panel-catalog .item-head .spacer { flex: 1; }
    #panel-catalog .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); cursor: pointer; }
    #panel-catalog .pill { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
    /* A service or language that still needs translating: a button, so one click goes to the items. */
    #panel-catalog .pill.warn { background: color-mix(in srgb, #e0a100 18%, var(--card)); border-color: color-mix(in srgb, #e0a100 55%, var(--card)); color: var(--fg); }
    #panel-catalog button.pill { min-height: 0; cursor: pointer; font-family: inherit; }
    #panel-catalog button.pill:hover { background: color-mix(in srgb, #e0a100 30%, var(--card)); }
    #panel-catalog .link-btn { background: none; border: 0; min-height: 0; padding: 0; color: var(--accent); text-decoration: underline; font: inherit; font-weight: 600; cursor: pointer; }
    /* The number of items still to translate, on the Translations tab. */
    #panel-catalog .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: #e0a100; color: #1d1600; font-size: 12px; font-weight: 800; line-height: 20px; text-align: center; vertical-align: 1px; }
    #panel-catalog .option-row { grid-column: span 12; display: flex; flex-wrap: wrap; gap: 8px 28px; padding-top: 2px; }
    #panel-catalog .option-row .switch { align-items: flex-start; font-size: 14px; }
    #panel-catalog .option-row .switch input { margin-top: 2px; }
    #panel-catalog .option-row .switch small { display: block; color: var(--muted); font-size: 12px; }
    #panel-catalog .item-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    #panel-catalog .item-foot .row-msg { flex: 1; min-width: 120px; margin: 0; font-size: 13px; color: var(--danger); }
    #panel-catalog .item-foot .row-msg.ok { color: #2e9e5b; }
    #panel-catalog .empty { padding: 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; }

    /* Kiosk layout: the rows as the kiosk draws them, with tiles to drag between them. */
    #panel-catalog .board-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 20px; flex-wrap: wrap; }
    #panel-catalog .board-head > div:first-child { flex: 1 1 420px; }
    #panel-catalog .board-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #panel-catalog .panel.is-dirty { border-color: var(--accent); }
    #panel-catalog .board { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    #panel-catalog .board-row { display: flex; align-items: stretch; gap: 10px; }
    #panel-catalog .board-row .row-label { flex: none; width: 58px; padding-top: 16px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); }
    #panel-catalog .board-row.is-long .row-label { color: var(--danger); }
    /* A row stays on one line here; if its services are too wide to fit, the row scrolls sideways. */
    #panel-catalog .board-zone { flex: 1; min-width: 0; min-height: 60px; display: flex; flex-wrap: nowrap; overflow-x: auto; align-items: center; justify-content: safe center; gap: 8px; padding: 8px;border: 1px dashed var(--border); border-radius: 10px; background: var(--bg); }
    #panel-catalog .board-zone.is-over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }
    #panel-catalog .board-zone .zone-empty { font-size: 13px; color: var(--muted); padding: 0 6px; }
    #panel-catalog .board-tools { flex: none; display: flex; align-items: center; }
    #panel-catalog .board-tools button { min-height: 32px; padding: 4px 10px; font-size: 13px; }
    #panel-catalog .tile-chip { display: inline-flex; flex: none; align-items: center; gap: 8px; max-width: 250px;min-height: 0; padding: 7px 12px 7px 8px; border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 14px; font-weight: 600; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    #panel-catalog .tile-chip:hover { border-color: var(--accent); }
    #panel-catalog .tile-chip .icon-preview { width: 20px; height: 20px; }
    #panel-catalog .tile-chip .icon-preview svg { width: 18px; height: 18px; }
    #panel-catalog .tile-chip .nm { font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    #panel-catalog .tile-chip.is-dragging { opacity: 0.3; }
    #panel-catalog .drag-ghost { position: fixed; z-index: 200; margin: 0; pointer-events: none; opacity: 0.95; cursor: grabbing; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35); }
    #panel-catalog .drop-marker { flex: none; width: 4px; align-self: stretch; min-height: 34px; border-radius: 2px; background: var(--accent); }
    #panel-catalog #layout-add-row { margin-top: 10px; border-style: dashed; width: 100%; }
    #panel-catalog #layout-add-row.is-over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
    #panel-catalog .field-note { margin: 0; font-size: 13px; color: var(--muted); }
    #panel-catalog .layout-note { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
    #panel-catalog .layout-note:empty { display: none; }
    #panel-catalog .layout-note.warn { color: var(--danger); }

    /* Icon picker: a button showing the chosen icon, and a grid to choose from. */
    #panel-catalog .icon-preview { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; color: var(--accent); flex: none; }
    #panel-catalog .icon-preview svg { width: 22px; height: 22px; }
    #panel-catalog .picker { position: relative; }
    #panel-catalog .picker-btn { width: 100%; justify-content: flex-start; display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; text-align: left; }
    #panel-catalog .picker-btn .icon-preview { width: 22px; height: 22px; }
    #panel-catalog .picker-btn .icon-preview svg { width: 18px; height: 18px; }
    #panel-catalog .picker-btn .caret { margin-left: auto; opacity: 0.6; font-size: 11px; }
    #panel-catalog .icon-pop { position: absolute; z-index: 30; top: 100%; left: 0; margin-top: 4px; padding: 8px; display: grid; grid-template-columns: repeat(6, 40px); gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3); }
    #panel-catalog .icon-pop.align-right { left: auto; right: 0; }
    #panel-catalog .icon-pop button { width: 40px; height: 40px; min-height: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--accent); }
    #panel-catalog .icon-pop button.none { color: var(--muted); font-size: 12px; font-weight: 600; }
    #panel-catalog .icon-pop button.selected { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    #panel-catalog .icon-pop svg { width: 22px; height: 22px; }

    /* Colour: a swatch to pick from, and the hex value beside it. */
    #panel-catalog .color-field { display: flex; gap: 6px; align-items: center; }
    #panel-catalog .color-field input[type="color"] { flex: none; width: 42px; height: 38px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; }
    #panel-catalog .color-field input[type="text"] { min-width: 0; }
    #panel-catalog .color-field.is-empty input[type="color"] { opacity: 0.35; }

    /* Translations */
    #panel-catalog .tr-bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
    #panel-catalog .tr-bar .field { grid-column: auto; min-width: 220px; }
    #panel-catalog .tr-bar .switch { min-height: 38px; }
    #panel-catalog .tr-progress { margin-left: auto; font-size: 14px; color: var(--muted); min-height: 38px; display: flex; align-items: center; }
    #panel-catalog .section-title { margin: 22px 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--border); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
    #panel-catalog .translate-item { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--border); }
    #panel-catalog .translate-item .t-label { font-size: 13px; font-weight: 600; padding-top: 8px; overflow-wrap: anywhere; }
    #panel-catalog .translate-item .english { color: var(--muted); font-size: 14px; line-height: 1.35; padding-top: 8px; overflow-wrap: anywhere; }
    #panel-catalog .translate-item .english:empty::before { content: "(empty)"; opacity: 0.6; }
    #panel-catalog .translate-item.is-changed input, #panel-catalog .translate-item.is-changed textarea { border-color: var(--accent); }
    #panel-catalog .only-todo .translate-item.is-done, #panel-catalog .only-todo .section-title.is-done { display: none; }
    #panel-catalog .tr-head { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px; padding: 14px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); font-weight: 600; }
    @media (max-width: 719px) {

      #panel-catalog .translate-item { grid-template-columns: minmax(0, 1fr); gap: 4px; }
      #panel-catalog .translate-item .t-label, #panel-catalog .translate-item .english { padding-top: 0; }
      #panel-catalog .tr-head { display: none; }
      #panel-catalog .tr-progress { margin-left: 0; }
    }
    #panel-catalog .save-bar { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 16px -18px -16px; padding: 12px 18px; background: var(--card); border-top: 1px solid var(--border); border-radius: 0 0 10px 10px; }
    #panel-catalog .save-bar .msg { flex: 1; min-width: 160px; }

    #panel-catalog .subtabs::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo-wrap"><img class="logo" alt="" style="visibility:hidden" onerror="this.parentNode.style.display='none'"></span>
      <div>
        <p class="org-label" data-org-name hidden></p>
        <h1>Management</h1>
        <p class="sub" id="signed-in"></p>
      </div>
    </div>
    <div class="top-actions">
      <a href="queue.html">Queue Portal</a>
      <a id="manage-link" href="manage.html" aria-current="page">Management</a>
      <a href="account.html">My account</a>
      <button id="signout" class="ghost" type="button">Sign out</button>
      <span class="divider"></span>
      <button id="theme-toggle" class="ghost" type="button"><span class="theme-icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span><span class="theme-icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/><circle cx="12" cy="12" r="5"/></svg></span></button>
    </div>
  </header>

  <nav class="tabs hidden" id="tabs">
    <button class="tab-btn" data-tab="services" type="button">Operations</button>
    <button class="tab-btn" data-tab="staff" type="button">Staff</button>
    <button class="tab-btn" data-tab="reports" type="button">Reports</button>
    <button class="tab-btn" data-tab="catalog" type="button">Service Configuration</button>
    <button class="tab-btn" data-tab="settings" type="button">Settings</button>
    <button class="tab-btn" data-tab="security" type="button">Security</button>
    <button class="tab-btn" data-tab="health" type="button">Health and Audit</button>
  </nav>

  <main id="app">
    <p class="muted" style="padding:20px">Loading…</p>
  </main>

  <!-- The Service Configuration tab. catalogTab.init() draws it into #panel-catalog, for admins only. -->
  <template id="catalog-template">
    <p class="msg hidden" id="cfg-load-msg" role="status"></p>
    <nav class="subtabs hidden" aria-label="Service configuration sections">
      <button class="subtab-btn" data-tab="services" type="button">Services</button>
      <button class="subtab-btn" data-tab="groups" type="button">Department groups</button>
      <button class="subtab-btn" data-tab="languages" type="button">Languages</button>
      <button class="subtab-btn" data-tab="translations" type="button">Translations<span class="badge hidden" id="tr-badge"></span></button>
    </nav>

  <div class="cfg-body hidden" id="cfg-body">
    <!-- Services -->
    <section id="cfg-panel-services">
      <details class="add" id="svc-add-box">
        <summary>Add a service</summary>
        <div class="add-body">
          <p class="intro">A service needs a code (2 to 10 letters or numbers) and a name. A description and an icon help customers choose. The service shows on the kiosk as soon as it is added.</p>
          <div class="fields">
            <label class="field c3">Code<input type="text" id="svc-new-code" maxlength="10" placeholder="e.g. TAX" autocomplete="off"></label>
            <label class="field c5">Name<input type="text" id="svc-new-name" maxlength="100"></label>
            <label class="field c4">Department group<select id="svc-new-group"></select></label>
            <label class="field c12" style="grid-column: span 12">Description<input type="text" id="svc-new-description" maxlength="255" placeholder="One short line shown under the name on the kiosk"></label>
            <div class="field c4">Icon<div id="svc-new-icon-slot"></div></div>
            <div class="field c4">Colour on the monitor<div id="svc-new-color-slot"></div><span class="hint">Used when the service is not in a group.</span></div>
            <div class="option-row">
              <label class="switch"><input type="checkbox" id="svc-new-appt"><span>Asks who they are seeing and the appointment time<small>For appointment check-in. The kiosk and the walk-in form ask the two questions.</small></span></label>
              <label class="switch"><input type="checkbox" id="svc-new-pinned"><span>Always in staff watched queues<small>Staff cannot unwatch it, and it sits first in their list.</small></span></label>
            </div>
            <p class="field-note" style="grid-column: span 12">A new service goes at the end of the last kiosk row, or on a new row when that one is full. Move it in the Kiosk layout above.</p>
          </div>
          <div class="form-foot">
            <button class="primary" id="svc-add" type="button">Add service</button>
            <p class="msg" id="svc-add-msg" role="status"></p>
          </div>
        </div>
      </details>
      <div class="panel" id="svc-layout-box">
        <div class="board-head">
          <div>
            <h2>Kiosk layout</h2>
            <p class="intro" style="margin:0">Drag a service to move it: along its row, to another row, or onto <strong>Add a row</strong> to start a new one. With a service selected, the arrow keys move it too. Nothing changes on the kiosk until you press <strong>Save layout</strong>.</p>
          </div>
          <div class="board-actions">
            <button type="button" id="layout-discard" disabled>Discard changes</button>
            <button type="button" class="primary" id="layout-save" disabled>Save layout</button>
          </div>
        </div>
        <div class="board" id="svc-layout" aria-label="Kiosk rows"></div>
        <button type="button" id="layout-add-row">+ Add a row</button>
        <p class="layout-note" id="svc-layout-note"></p>
        <p class="msg" id="layout-msg" role="status" style="margin-top:8px"></p>
      </div>
      <p class="intro">Change a service and press Save on its card. A service with customers on record cannot be deleted; turn it off instead, so its history stays in the reports. Services are listed in the order they appear on the kiosk.</p>
      <div class="list" id="svc-list"></div>
    </section>

    <!-- Department groups -->
    <section id="cfg-panel-groups" class="hidden">
      <details class="add" id="grp-add-box">
        <summary>Add a department group</summary>
        <div class="add-body">
          <p class="intro">Services in the same group share one card on the lobby monitor, for example Building Dept. A group needs a short id, such as "permits". The id cannot be changed later.</p>
          <div class="fields">
            <label class="field c3">Id<input type="text" id="grp-new-id" maxlength="40" placeholder="e.g. permits" autocomplete="off"></label>
            <label class="field c5">Name<input type="text" id="grp-new-label" maxlength="100"></label>
            <div class="field c4">Icon<div id="grp-new-icon-slot"></div></div>
            <div class="field c4">Colour<div id="grp-new-color-slot"></div></div>
          </div>
          <div class="form-foot">
            <button class="primary" id="grp-add" type="button">Add group</button>
            <p class="msg" id="grp-add-msg" role="status"></p>
          </div>
        </div>
      </details>
      <p class="intro">A group that still has services cannot be deleted. Move those services to another group first. To show a new group on a monitor, choose it in Settings, under Monitor configuration.</p>
      <div class="list" id="grp-list"></div>
    </section>

    <!-- Languages -->
    <section id="cfg-panel-languages" class="hidden">
      <details class="add" id="lang-add-box">
        <summary>Add a language</summary>
        <div class="add-body">
          <p class="intro">Add a language, then translate the services, groups and kiosk wording for it on the Translations tab. The kiosk offers a language as soon as it is on. Use the language's own name, such as Español.</p>
          <div class="fields">
            <label class="field c3">Code<input type="text" id="lang-new-code" maxlength="10" placeholder="e.g. pt-br" autocomplete="off"></label>
            <label class="field c5">Name<input type="text" id="lang-new-name" maxlength="50"></label>
          </div>
          <div class="form-foot">
            <button class="primary" id="lang-add" type="button">Add language</button>
            <p class="msg" id="lang-add-msg" role="status"></p>
          </div>
        </div>
      </details>
      <p class="intro">English is always available. Turn a language off to hide it from the kiosk without losing its translations.</p>
      <div class="list" id="lang-list"></div>
    </section>

    <!-- Translations -->
    <section id="cfg-panel-translations" class="hidden">
      <div class="panel">
        <div class="tr-bar">
          <label class="field">Language to translate<select id="tr-lang"></select></label>
          <label class="switch"><input type="checkbox" id="tr-todo"> Show only items still to translate</label>
          <span class="tr-progress" id="tr-count"></span>
        </div>
        <p class="intro" style="margin:12px 0 0">The English is shown beside each item. Leave a box empty to use the English on the kiosk.</p>
        <div class="tr-head" id="tr-head"><span>Item</span><span>English</span><span>Translation</span></div>
        <div id="tr-body"></div>
        <div class="save-bar">
          <button class="primary" id="tr-save" type="button">Save translations</button>
          <span class="msg" id="tr-msg" role="status"></span>
        </div>
      </div>
    </section>
  </div>
  </template>

  <script src="app-settings.js"></script>
  <script src="icons.js"></script>
  <script>
    (function () {
      var BASE = location.pathname.replace(/[^/]*$/, '');
      var state = { user: null, servicesStale: false, services: [], users: [], editing: null, svcUi: { search: '', filter: 'all', open: {} } };
      var ROLE_LABEL = { staff: 'Staff', manager: 'Manager', admin: 'Admin' };
      var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      var NTH_LABELS = { '1': '1st', '2': '2nd', '3': '3rd', '4': '4th', 'last': 'last' };
      // Which tabs exist, and which role may see each one. Every role gated into the page at
      // all (manager/admin) can see every tab today, but a tab could be narrowed to ['admin']
      // here without touching anything else — layout.(showTab) hides a tab button that the
      // signed-in role isn't in this list for.
      var TAB_ACCESS = { services: ['manager', 'admin'], staff: ['manager', 'admin'], reports: ['manager', 'admin'], catalog: ['admin'], settings: ['admin'], security: ['admin'], health: ['admin'] };

      function $(id) { return document.getElementById(id); }
      // Whether the "require a password change" box starts ticked, as set in Settings.
      function defaultMustChange() {
        return !!window.appSettings.new_account_change_password;
      }

      // The minimum password length set in Settings (8 until the settings have loaded).
      function minPassword() {
        return window.appSettings.min_password_length;
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }

      async function api(path, opts) {
        opts = opts || {};
        var res = await fetch(BASE + path.replace(/^\//, ''), {
          method: opts.method || 'GET',
          headers: { 'Content-Type': 'application/json' },
          body: opts.body,
          credentials: 'same-origin'
        });
        // Session ended (or never started): sign in again, then come back here.
        if (res.status === 401) { window.location.href = BASE + 'index.html?next=manage.html'; throw new Error('Sign in required'); }
        var data = await res.json().catch(function () { return {}; });
        // A forced password change stops every action until it's done.
        if (data.code === 'PASSWORD_CHANGE_REQUIRED') { window.location.href = BASE + 'account.html'; throw new Error(data.error); }
        if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
        return data;
      }

      function renderDenied(message) {
        $('tabs').classList.add('hidden');
        var app = $('app');
        app.textContent = '';
        var panel = el('div', 'panel notice');
        panel.appendChild(el('h2', null, message));
        var p = el('p', 'muted');
        var link = el('a', null, 'Go to sign in');
        link.href = 'index.html?next=manage.html';
        p.appendChild(link);
        panel.appendChild(p);
        app.appendChild(panel);
      }

      // ================= Services tab =================

      // "HH:MM:SS" -> "12:00 PM"
      function formatTime(t) {
        var parts = String(t).split(':').map(Number);
        var h = parts[0], m = parts[1];
        var period = h < 12 ? 'AM' : 'PM';
        var h12 = (h % 12) || 12;
        return h12 + ':' + (m < 10 ? '0' : '') + m + ' ' + period;
      }

      function formatNthWeeks(nthWeeks) {
        var weeks = String(nthWeeks || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        if (!weeks.length) return '';
        return weeks.map(function (w) { return NTH_LABELS[w] || w; }).join(' and ');
      }

      function scheduleWhen(s) {
        var day = WEEKDAYS[s.weekday] || '?';
        var when = s.recurrence === 'monthly_nth'
          ? 'The ' + formatNthWeeks(s.nthWeeks) + ' ' + day + ' of every month'
          : 'Every ' + day;
        return when + ', ' + formatTime(s.startTime) + '–' + formatTime(s.endTime);
      }

      function labelled(text, control) {
        var l = el('label');
        l.appendChild(el('span', null, text));
        l.appendChild(control);
        return l;
      }

      // ---- Manual override: close / reopen / clear ----
      function doOverride(code, override, message, expiresAt) {
        var body = { override: override };
        if (message !== undefined) body.message = message;
        if (expiresAt) body.expiresAt = expiresAt;
        return api('/api/services/' + code + '/override', { method: 'PATCH', body: JSON.stringify(body) });
      }

      // A reopen time as the text a manager reads, such as "Mon, Oct 19, 7:00 AM".
      function formatReopen(iso) {
        var when = new Date(iso);
        return when.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }) + ' at ' +
          when.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      }

      // How far away a reopen time is, such as "in 6 days" or "in 3 hours".
      function untilText(iso) {
        var mins = Math.round((new Date(iso) - Date.now()) / 60000);
        if (mins <= 0) return 'now';
        if (mins < 60) return 'in ' + mins + (mins === 1 ? ' minute' : ' minutes');
        var hours = Math.round(mins / 60);
        if (hours < 24) return 'in ' + hours + (hours === 1 ? ' hour' : ' hours');
        var days = Math.round(hours / 24);
        return 'in ' + days + (days === 1 ? ' day' : ' days');
      }

      // The reopen time of a manual closure: a calendar icon, the date and time, and how long until then.
      function reopenRow(iso) {
        var row = el('div', 'reopen-row');
        var icon = el('span', 'reopen-icon');
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5"/><path d="M16 2v4M8 2v4M3 10h18"/><circle cx="17" cy="17" r="5"/><path d="M17 15v2l1.5 1"/></svg>';
        var text = el('div');
        text.appendChild(el('strong', null, 'Reopens ' + formatReopen(iso)));
        text.appendChild(el('span', 'reopen-until', '(' + untilText(iso) + ')'));
        row.appendChild(icon);
        row.appendChild(text);
        return row;
      }

      // A date as the value a datetime-local input takes, in this computer's time.
      function toDatetimeLocal(d) {
        function two(n) { return String(n).padStart(2, '0'); }
        return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()) + 'T' + two(d.getHours()) + ':' + two(d.getMinutes());
      }

      function openCloseForm(container, svc) {
        container.textContent = '';
        var form = el('form', 'inline-form');
        var message = document.createElement('input');
        message.type = 'text';
        message.maxLength = 200;
        message.required = true;
        message.value = svc.manualMessage || svc.currentMessage || '';
        message.placeholder = 'e.g. Closed for a Special Magistrate Hearing';
        form.appendChild(labelled('Reason customers will see (shown as typed, in every language)', message));

        var until = document.createElement('input');
        until.type = 'datetime-local';
        if (svc.manualOverride === 'closed' && svc.manualOverrideExpiresAt) until.value = toDatetimeLocal(new Date(svc.manualOverrideExpiresAt));
        form.appendChild(labelled('Reopens automatically at (optional)', until));

        var err = el('p', 'err');
        var actions = el('div', 'actions');
        var cancel = el('button', 'secondary', 'Cancel');
        cancel.type = 'button';
        cancel.addEventListener('click', function () { container.textContent = ''; });
        var confirmBtn = el('button', 'primary', svc.manualOverride === 'closed' ? 'Save closure' : 'Close this service');
        confirmBtn.type = 'submit';
        actions.appendChild(cancel);
        actions.appendChild(confirmBtn);
        form.appendChild(err);
        form.appendChild(actions);

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          err.textContent = '';
          if (!message.value.trim()) { err.textContent = 'Enter a reason.'; return; }
          confirmBtn.disabled = true;
          doOverride(svc.code, 'closed', message.value.trim(), until.value ? new Date(until.value).toISOString() : null)
            .then(loadServices)
            .catch(function (error) { err.textContent = error.message; confirmBtn.disabled = false; });
        });

        container.appendChild(form);
      }

      // ---- Recurring closures ----
      // A dropdown in 15-minute steps instead of the native time input, which is fiddly to use
      // with a mouse or touch (small spinner targets, inconsistent across browsers).
      // Lobby hours only: 7:00 AM to 6:00 PM. A saved closure outside that range still gets its own
      // option, so it can be edited without its time silently changing.
      function buildTimeSelect(initial) {
        var sel = document.createElement('select');
        var value = initial ? String(initial).slice(0, 5) : '12:00';
        var times = [];
        for (var mins = 7 * 60; mins <= 18 * 60; mins += 15) times.push(mins);
        function addOption(mins) {
          var h = Math.floor(mins / 60), m = mins % 60;
          var h12 = (h % 12) || 12;
          var o = el('option', null, h12 + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' AM' : ' PM'));
          o.value = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
          sel.appendChild(o);
        }
        var initialMins = Number(value.slice(0, 2)) * 60 + Number(value.slice(3, 5));
        if (times.indexOf(initialMins) < 0) times.push(initialMins);
        times.sort(function (a, b) { return a - b; }).forEach(addOption);
        sel.value = value;
        return sel;
      }

      // Shared by "+ Add recurring closure" and "Edit": pass an existing schedule to prefill
      // the form and save with PATCH instead of POST.
      function openScheduleForm(container, svc, existing) {
        container.textContent = '';
        var form = el('form', 'inline-form');

        var message = document.createElement('input');
        message.type = 'text';
        message.maxLength = 200;
        message.required = true;
        message.placeholder = 'e.g. Closed for a Special Magistrate Hearing';
        if (existing) message.value = existing.message;
        form.appendChild(labelled('Reason customers will see (shown as typed, in every language)', message));

        var recurrence = document.createElement('select');
        ['weekly', 'monthly_nth'].forEach(function (v) {
          var o = el('option', null, v === 'weekly' ? 'Every week' : 'Specific week(s) of the month');
          o.value = v;
          recurrence.appendChild(o);
        });
        recurrence.value = existing ? existing.recurrence : 'weekly';
        form.appendChild(labelled('Repeats', recurrence));

        var weekday = document.createElement('select');
        WEEKDAYS.forEach(function (name, i) {
          var o = el('option', null, name);
          o.value = String(i);
          weekday.appendChild(o);
        });
        weekday.value = existing ? String(existing.weekday) : '3'; // Wednesday, a reasonable default
        form.appendChild(labelled('Day of the week', weekday));

        var checksWrap = el('div');
        var checksLabel = el('div', null, 'Which week(s) of the month');
        checksLabel.style.fontSize = '13px';
        checksLabel.style.color = 'var(--muted)';
        var checks = el('div', 'checks');
        var checkboxes = {};
        var existingWeeks = existing ? String(existing.nthWeeks || '').split(',').map(function (s) { return s.trim(); }) : [];
        ['1', '2', '3', '4', 'last'].forEach(function (v) {
          var lbl = document.createElement('label');
          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.value = v;
          cb.checked = existingWeeks.indexOf(v) >= 0;
          checkboxes[v] = cb;
          lbl.appendChild(cb);
          lbl.appendChild(document.createTextNode(NTH_LABELS[v]));
          checks.appendChild(lbl);
        });
        checksWrap.appendChild(checksLabel);
        checksWrap.appendChild(checks);
        form.appendChild(checksWrap);

        function syncMonthly() { checksWrap.classList.toggle('hidden', recurrence.value !== 'monthly_nth'); }
        recurrence.addEventListener('change', syncMonthly);
        syncMonthly();

        var row2 = el('div', 'row2');
        var startTime = buildTimeSelect(existing ? existing.startTime : '12:00:00');
        var endTime = buildTimeSelect(existing ? existing.endTime : '16:00:00');
        row2.appendChild(labelled('Start time', startTime));
        row2.appendChild(labelled('End time', endTime));
        form.appendChild(row2);

        var err = el('p', 'err');
        var actions = el('div', 'actions');
        var cancel = el('button', 'secondary', 'Cancel');
        cancel.type = 'button';
        cancel.addEventListener('click', function () { container.textContent = ''; });
        var save = el('button', 'primary', existing ? 'Save changes' : 'Add closure');
        save.type = 'submit';
        actions.appendChild(cancel);
        actions.appendChild(save);
        form.appendChild(err);
        form.appendChild(actions);

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          err.textContent = '';
          var nthWeeks = Object.keys(checkboxes).filter(function (v) { return checkboxes[v].checked; }).join(',');
          if (!message.value.trim()) { err.textContent = 'Enter a reason.'; return; }
          if (recurrence.value === 'monthly_nth' && !nthWeeks) { err.textContent = 'Choose at least one week of the month.'; return; }
          if (startTime.value >= endTime.value) { err.textContent = 'End time must be after start time.'; return; }
          save.disabled = true;
          var body = JSON.stringify({
            message: message.value.trim(),
            recurrence: recurrence.value,
            weekday: Number(weekday.value),
            nthWeeks: nthWeeks,
            startTime: startTime.value,
            endTime: endTime.value
          });
          var request = existing
            ? api('/api/services/schedules/' + existing.id, { method: 'PATCH', body: body })
            : api('/api/services/' + svc.code + '/schedules', { method: 'POST', body: body });
          request.then(loadServices).catch(function (error) { err.textContent = error.message; save.disabled = false; });
        });

        container.appendChild(form);
      }

      function toggleSchedule(id, active) {
        api('/api/services/schedules/' + id, { method: 'PATCH', body: JSON.stringify({ active: active }) })
          .then(loadServices).catch(function (err) { alert(err.message); });
      }

      function deleteScheduleRow(id) {
        if (!confirm('Delete this recurring closure?')) return;
        api('/api/services/schedules/' + id, { method: 'DELETE' })
          .then(loadServices).catch(function (err) { alert(err.message); });
      }

      function renderServicePanel(svc) {
        var panel = el('div', 'panel svc-card ' + (svc.available ? 'is-open' : 'is-closed'));

        // Name on the left, the open or closed badge on the right. The department is the heading of its section.
        var head = el('div', 'svc-head');
        var titles = el('div', 'svc-title');
        var title = el('h2', null, svc.name);
        title.appendChild(el('span', 'svc-code', svc.code));
        titles.appendChild(title);
        head.appendChild(titles);
        head.appendChild(el('span', 'status-pill ' + (svc.available ? 'status-open' : 'status-closed'), svc.available ? 'Open' : 'Closed'));
        panel.appendChild(head);

        if (!svc.available && svc.source === 'manual') {
          // Closed by hand: a red icon and "Manually closed" beside the name, then the reason and the reopen time.
          var lead = el('div', 'svc-lead');
          var closedIcon = el('span', 'closed-icon');
          closedIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M8 12h8" stroke="#fff"/></svg>';
          head.insertBefore(lead, titles);
          lead.appendChild(closedIcon);
          lead.appendChild(titles);
          titles.appendChild(el('div', 'closed-sub', 'Manually closed'));
          var reason = el('div', 'closure-reason');
          reason.appendChild(el('div', 'cr-label', 'Closure reason'));
          reason.appendChild(el('div', 'cr-text', svc.currentMessage));
          panel.appendChild(reason);
          if (svc.reopensAt) panel.appendChild(reopenRow(svc.reopensAt));
        } else if (!svc.available) {
          var sourceLabel = svc.source === 'schedule' ? ' (recurring closure)' : '';
          panel.appendChild(el('div', 'closed-banner', svc.currentMessage + sourceLabel));
          if (svc.reopensAt) panel.appendChild(el('div', 'closed-reopen', 'Scheduled to reopen ' + formatReopen(svc.reopensAt)));
        }

        var formContainer = el('div');

        // One row of buttons. What each does is in its tooltip; the states that need explaining get a line below.
        var actions = el('div', 'svc-actions');
        function actionButton(label, variant, tip, onClick) {
          var b = el('button', variant, label);
          b.type = 'button';
          b.title = tip;
          b.addEventListener('click', onClick);
          actions.appendChild(b);
        }
        function runOverride(override) {
          return function () { doOverride(svc.code, override).then(loadServices).catch(function (err) { alert(err.message); }); };
        }

        var closedBySchedule = !svc.available && svc.source === 'schedule';
        var closedManually = !svc.available && svc.source === 'manual';
        var caption = '';

        if (svc.available) {
          actionButton('Close now…', 'secondary', 'Keeps it closed until you reopen it. You can set a time for it to reopen automatically.',
            function () { openCloseForm(formContainer, svc); });
        } else if (closedBySchedule) {
          actionButton('Open now', 'primary', 'Opens it now, but only until the scheduled closure ends. Then it closes as scheduled.', runOverride('open'));
          actionButton('Keep closed…', 'secondary', 'Stays closed after the scheduled closure ends, until you reopen it.',
            function () { openCloseForm(formContainer, svc); });
          caption = 'Open now opens it only until the scheduled closure ends. Keep closed holds it shut until you reopen it.';
        } else {
          actionButton('Reopen now', 'primary', 'Lifts the manual closure. Recurring closures apply again.', runOverride('open'));
          actionButton('Edit closure', 'secondary', 'Change the reason customers see, or when it reopens.',
            function () { openCloseForm(formContainer, svc); });
          actions.children[0].insertAdjacentHTML('afterbegin', '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>');
          actions.children[1].insertAdjacentHTML('afterbegin', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>');
        }
        // Only worth offering when an override is in place and isn't already the manual closure above.
        if (svc.manualOverride !== 'none' && !closedManually) {
          actionButton('Return to schedule', 'secondary', 'Drops any manual open or close, so recurring closures apply again.', runOverride('none'));
        }

        // The recurring closures stay folded away until asked for, so the page is a list of services, not a wall of forms.
        var sched = el('div', 'svc-sched' + (state.svcUi.open[svc.code] ? '' : ' hidden'));
        var toggle = el('button', 'secondary sched-toggle' + (svc.schedules.length ? ' has-schedules' : ''));
        toggle.type = 'button';
        function toggleLabel() {
          var n = svc.schedules.length;
          var name = closedManually && n ? n + (n === 1 ? ' recurring schedule' : ' recurring schedules') : 'Recurring closures' + (n ? ' (' + n + ')' : '');
          toggle.textContent = name + (sched.classList.contains('hidden') ? ' ▾' : ' ▴');
          toggle.setAttribute('aria-expanded', sched.classList.contains('hidden') ? 'false' : 'true');
        }
        toggle.addEventListener('click', function () {
          sched.classList.toggle('hidden');
          state.svcUi.open[svc.code] = !sched.classList.contains('hidden');
          toggleLabel();
        });
        actions.appendChild(el('span', 'spacer'));
        actions.appendChild(toggle);
        panel.appendChild(actions);
        if (caption) panel.appendChild(el('p', 'svc-caption', caption));
        panel.appendChild(formContainer);

        if (!svc.schedules.length) {
          sched.appendChild(el('div', 'empty', 'No recurring closures.'));
        } else {
          svc.schedules.forEach(function (s, idx) {
            var isLast = idx === svc.schedules.length - 1;
            var row = el('div', 'schedule-row' + (s.active ? '' : ' paused') + (isLast ? ' last-row' : ''));
            var left = el('div');
            left.appendChild(el('div', 'schedule-when', scheduleWhen(s)));
            left.appendChild(el('div', 'schedule-message', s.message + (s.active ? '' : ' — paused')));
            row.appendChild(left);

            var editContainer = el('div');

            var rowActions = el('div', 'schedule-actions');
            var edit = el('button', 'secondary', 'Edit');
            edit.type = 'button';
            edit.addEventListener('click', function () { openScheduleForm(editContainer, svc, s); });
            var pause = el('button', 'secondary', s.active ? 'Pause' : 'Resume');
            pause.type = 'button';
            pause.addEventListener('click', function () { toggleSchedule(s.id, !s.active); });
            var del = el('button', 'danger', 'Delete');
            del.type = 'button';
            del.addEventListener('click', function () { deleteScheduleRow(s.id); });
            rowActions.appendChild(edit);
            rowActions.appendChild(pause);
            rowActions.appendChild(del);
            row.appendChild(rowActions);

            sched.appendChild(row);
            sched.appendChild(editContainer);
          });
        }

        var addScheduleContainer = el('div');
        var addBtn = el('button', 'secondary add-schedule', '+ Add recurring closure');
        addBtn.type = 'button';
        addBtn.addEventListener('click', function () { openScheduleForm(addScheduleContainer, svc, null); });
        sched.appendChild(addBtn);
        sched.appendChild(addScheduleContainer);
        panel.appendChild(sched);
        toggleLabel();

        return panel;
      }

      // The toolbar is built once, so typing in the search box is not interrupted when the list below is drawn again.
      function buildServicesToolbar(panel) {
        var bar = el('div', 'svc-toolbar');
        var search = document.createElement('input');
        search.type = 'search';
        search.className = 'svc-search';
        search.placeholder = 'Search services';
        search.setAttribute('aria-label', 'Search services');
        search.value = state.svcUi.search;
        search.addEventListener('input', function () { state.svcUi.search = search.value; renderServiceList(); });
        bar.appendChild(search);

      // The list: services in the order the kiosk shows them, under the department group they belong to.
      function renderServiceList() {
        var all = state.services;
        var closedCount = all.filter(function (v) { return !v.available; }).length;
        if (state.svcUi.filter === 'closed' && !closedCount) state.svcUi.filter = 'all';
        var ui = state.svcUi;

        var panel = $('panel-services');
        panel.querySelector('.svc-summary').textContent = all.length + (all.length === 1 ? ' service' : ' services') + ' · ' +
          (all.length - closedCount) + ' open · ' + closedCount + ' closed';
        Array.prototype.forEach.call(panel.querySelectorAll('.svc-filter'), function (b) {
          b.classList.toggle('active', b.getAttribute('data-filter') === ui.filter);
        });

        var needle = ui.search.trim().toLowerCase();
        var shown = all.filter(function (v) {
          if (ui.filter === 'closed' && v.available) return false;
          if (ui.filter === 'scheduled' && !v.schedules.length) return false;
          return !needle || v.name.toLowerCase().indexOf(needle) >= 0 || v.code.toLowerCase().indexOf(needle) >= 0;
        });

        // Sections in the order their first service appears; services with no group go last.
        var sections = [];
        var byLabel = {};
        shown.forEach(function (v) {
          var label = v.groupLabel || null;
          var key = label === null ? '\u0000other' : label;
          if (!byLabel[key]) { byLabel[key] = { label: label, items: [] }; sections.push(byLabel[key]); }
          byLabel[key].items.push(v);
        });
        sections.sort(function (a, b) { return (a.label === null) - (b.label === null); });

        var list = $('svc-sections');
        list.textContent = '';
        if (!shown.length) {
          list.appendChild(el('div', 'empty', all.length ? 'No services match.' : 'No services yet.'));
          return;
        }
        var headed = sections.length > 1 || sections[0].label !== null;
        sections.forEach(function (section) {
          var box = el('section', 'svc-section');
          if (headed) {
            var h = el('h3', null, section.label || 'Other services');
            h.appendChild(el('span', 'count', String(section.items.length)));
            box.appendChild(h);
          }
          var grid = el('div', 'svc-grid');
          section.items.forEach(function (v) { grid.appendChild(renderServicePanel(v)); });
          box.appendChild(grid);
          list.appendChild(box);
        });
      }
