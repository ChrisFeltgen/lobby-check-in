<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue Portal · Lobby Check-In</title>
  <link rel="stylesheet" href="app.css">
  <script src="theme.js"></script>
  <style>
    /* Operations console: compact, restrained, and built around the lobby list. */
    body { font-size: 15px; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    button { font-size: 15px; min-height: 36px; padding: 6px 14px; border-radius: 8px; }
    button.primary { background: #1f6feb; color: #fff; border: 0; font-weight: 600; }
    button.ghost { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, 0.55); }
    button.secondary { font-weight: 500; }
    button.danger { background: var(--danger); color: #fff; border: 0; }
    .card, .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }

    /* Header */
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; background: linear-gradient(90deg, #0a4670 0%, #0b6a9c 100%); color: #fff; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo-wrap { background: #fff; border-radius: 8px; padding: 4px 8px; display: flex; }
    .logo { max-height: 40px; width: auto; display: block; }
    .top h1 { margin: 0; font-size: 22px; font-weight: 700; white-space: nowrap; }
    .brand > div { min-width: 0; }
    .top .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top button, .top-actions a { white-space: nowrap; }
    /* Narrow header: the brand takes the first row and the controls drop to a full-width second
       row, so the title never gets squeezed into a column of wrapped words. */
    @media (max-width: 720px) {
      .top { flex-wrap: wrap; padding: 10px 16px; }
      .top h1 { font-size: 19px; }
      .top .logo { max-height: 32px; }
      .top-actions { width: 100%; justify-content: flex-end; }
    }
    .top .sub { margin: 2px 0 0; font-size: 14px; opacity: 0.85; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    /* Header links and buttons share one height and look: links are plain text with a highlight on hover. */
    .top-actions a { color: #fff; text-decoration: none; display: inline-flex; align-items: center; height: 38px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 15px; white-space: nowrap; transition: background-color 0.12s ease; }
    .top-actions a:hover { background: rgba(255, 255, 255, 0.14); }
    .top-actions a[aria-current="page"] { background: rgba(255, 255, 255, 0.2); }
    .top-actions button.ghost { height: 38px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 15px; border: 1px solid rgba(255, 255, 255, 0.55); }
    .top-actions button.ghost:hover { background: rgba(255, 255, 255, 0.14); }
    .top-actions .divider { width: 1px; align-self: stretch; background: rgba(255, 255, 255, 0.3); margin: 0 2px; }
    .counter-btn { background: transparent; border: 0; min-height: 0; padding: 0; margin-left: 2px; color: inherit; font: inherit; font-size: 14px; opacity: 0.85; text-decoration: underline dotted; text-underline-offset: 2px; cursor: pointer; }
    .counter-btn:hover { opacity: 1; }
    .counter-edit { font: inherit; font-size: 14px; margin-left: 2px; padding: 1px 6px; width: 120px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.6); background: rgba(255, 255, 255, 0.12); color: #fff; min-height: 0; }
    .counter-edit::placeholder { color: rgba(255, 255, 255, 0.6); }

    /* Sign in */
    .login { max-width: 380px; margin: 60px auto; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
    .login label { font-size: 13px; color: var(--muted); }
    .login input { width: 100%; }
    .msg { min-height: 20px; margin: 0; color: var(--danger); font-size: 14px; }

    /* Layout: a narrow sidebar for Service Queues, everything else in the main column beside
       it — queues a staff member is tracking stay visible no matter how far they scroll. */
    main { max-width: 1500px; margin: 0 auto; padding: 14px 20px 24px; }
    .layout { display: flex; align-items: flex-start; gap: 16px; }
    .sidebar { flex: 0 0 320px; position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto; }
    /* Restores the account's default watch list. Shown only when the list has been changed. */
    .restore-btn { width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
    .restore-btn svg { width: 16px; height: 16px; }
    .restore-btn:hover { color: var(--accent); border-color: var(--accent); }
    /* Saving the watched queues as the account's default, at the foot of the sidebar. */
    .default-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .default-box p { margin: 0; font-size: 13px; color: var(--muted); }
    .default-box .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .panel { padding: 12px 14px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; text-transform: none; }
    .panel-head h2 .count { font-weight: 500; color: var(--muted); }

    /* Service Queues: a vertical list rather than a grid, so it reads top-to-bottom alongside
       the main column instead of competing with it for width. Watched queues get a dot on their
       icon and a chevron; everything else stays neutral. */
    .qgroup-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin: 16px 0 8px; }
    .qgroup-label:first-of-type { margin-top: 2px; }
    .qgroup-sub { display: block; font-weight: 500; text-transform: none; letter-spacing: 0; margin-top: 2px; }

    .queue-list { display: flex; flex-direction: column; gap: 8px; }

    .qrow { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; user-select: none; background: var(--card); transition: border-color 0.12s ease, background-color 0.12s ease; }
    /* A watched queue is not clickable as a whole: stopping to watch it is its own button, away from Call next. */
    .qrow:not(.watched) { cursor: pointer; }
    .qrow:not(.watched):hover { border-color: var(--accent); }
    .qrow.closed { background: color-mix(in srgb, var(--danger) 8%, var(--card)); border-color: var(--danger); }
    .qrow.has-waiting:not(.watched) { border-left: 3px solid var(--accent); }
    .qrow.has-waiting.closed { border-left-color: var(--danger); }

    .qicon { flex: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--muted) 16%, var(--card)); color: var(--muted); position: relative; }
    .qicon svg { width: 58%; height: 58%; }
    .qrow.watched .qicon { background: color-mix(in srgb, var(--accent) 16%, var(--card)); color: var(--accent); }
    /* The one indicator that a queue is watched: a small dot on its icon, instead of a tinted
       card — easy to spot without the whole row competing for attention. */
    .qrow.watched .qicon::after { content: ''; position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--card); }

    .qrow-body { flex: 1; min-width: 0; }
    /* Full name, wrapped rather than cut off to a few letters — clamped to two lines as a
       backstop for the rare name that's still too long even wrapped. */
    .qname { font-size: 14px; line-height: 1.25; font-weight: 600; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .qrow-meta { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
    .qcount { font-size: 15px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .qcount-label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .qwait { font-size: 12px; color: var(--muted); font-weight: 600; }
    .qstatus { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--danger); font-weight: 600; margin-top: 2px; }
    .qdot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); flex: none; }

    /* The count and the buttons share the second line, so the queue's name keeps the whole width of the row. */
    .qrow-meta-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
    .qrow-meta-line .qrow-meta { flex: 1 1 auto; min-width: 0; margin-top: 0; }
    .qrow.watched .qrow-meta-line { min-height: 28px; }
    .qrow-actions { flex: none; display: flex; align-items: center; gap: 6px; }
    .qcall { min-height: 28px; min-width: 32px; padding: 0; border-radius: 7px; background: var(--accent); color: #fff; border: 0; font-size: 13px; line-height: 1; }
    .qcall:hover { filter: brightness(0.9); }
    .qwatch { flex: none; min-height: 22px; min-width: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: transparent; color: var(--muted); border: 0; font-size: 12px; line-height: 1; opacity: 0.55; }
    .qwatch:hover, .qwatch:focus-visible { opacity: 1; color: var(--danger); }
    /* Shown across the top of the page while the list may be out of date. */
    .conn-banner { position: sticky; top: 0; z-index: 80; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 10px 20px; background: color-mix(in srgb, var(--danger) 16%, var(--card)); border-bottom: 2px solid var(--danger); color: var(--fg); font-size: 15px; line-height: 1.4; }
    .conn-banner strong { color: var(--danger); }
    .conn-banner.back { background: color-mix(in srgb, #2e9e5b 16%, var(--card)); border-bottom-color: #2e9e5b; }
    .conn-banner.back strong { color: #2e9e5b; }
    .conn-banner button { margin-left: auto; min-height: 32px; padding: 4px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-weight: 600; }
    #updated.stale { color: var(--danger); font-weight: 600; }
    /* While the list may be out of date its buttons look off, and pressing one says why nothing was sent. */
    .is-offline #call-next, .is-offline #add-customer, .is-offline #lobby-body button, .is-offline #serving-grid button, .is-offline .qcall, .is-offline #menu button { opacity: 0.4; cursor: not-allowed; }
    .toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 95; max-width: calc(100vw - 32px); padding: 10px 18px; background: var(--fg); color: var(--bg); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); font-size: 15px; line-height: 1.4; }
    .undo-bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 18px; max-width: calc(100vw - 32px); background: var(--fg); color: var(--bg); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); font-size: 15px; }
    .undo-bar button { min-height: 32px; padding: 4px 12px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 700; }
    .qmenu-btn { min-height: 24px; width: 26px; padding: 0; font-size: 14px; border-radius: 6px; }

    .qshow-all { width: 100%; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }

    /* Desktop-notification toggle: same icon regardless of state, a tinted background is the
       only thing that changes when it's on. */
    #notify-toggle { flex: none; width: 36px; height: 36px; min-height: 0; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
    #notify-toggle svg { width: 18px; height: 18px; }
    #notify-toggle.active { background: color-mix(in srgb, var(--accent) 16%, var(--card)); border-color: var(--accent); color: var(--accent); }

    /* Collapsible Service Queues: the header toggles the list. Only narrow screens collapse it;
       on wide screens the toggle is inert and the list always shows. */
    .sidebar-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; min-height: 0; color: var(--fg); font: inherit; text-align: left; cursor: default; }
    .sidebar-title { font-size: 15px; font-weight: 700; }
    .sidebar-chevron { display: none; flex: none; width: 18px; height: 18px; color: var(--muted); transition: transform 0.15s ease; }
    /* Stacking breakpoint: below this the queue list sits above the main column and collapses.
       Above it, the side-by-side columns are wide enough for the lobby controls to stay on a row. */
    @media (min-width: 1101px) { .sidebar-toggle { pointer-events: none; } }
    @media (max-width: 1100px) {
      .layout { flex-direction: column; align-items: stretch; }
      .sidebar { flex: 1 1 auto; width: 100%; position: static; max-height: none; }
      .sidebar-toggle { cursor: pointer; }
      .sidebar-chevron { display: block; }
      .sidebar.collapsed .sidebar-body { display: none; }
      .sidebar.collapsed .sidebar-chevron { transform: rotate(-90deg); }
    }

    /* Currently being helped: every card keeps the same fixed width and wraps onto new rows as
       the window narrows. A fill-the-column grid would resize the cards each time the number of
       columns changed, so the cards stay one size instead. */
    .serving-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .serving-grid > .acard { flex: 0 0 280px; }
    /* The empty message takes the full row, so it never wraps inside a narrow box. */
    .serving-grid .empty { flex: 1 0 100%; }
    /* The left accent already sets this card apart, so the outer border is faint — just enough
       to frame the card without competing with the guest's name. */
    .acard { border: 1px solid color-mix(in srgb, var(--border) 35%, transparent); border-left: 4px solid color-mix(in srgb, var(--muted) 45%, transparent); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    /* Someone I am helping: the blue edge, a faint blue wash and my name in blue. A customer another person is helping keeps
       the plain grey card, with that person's name, so the two cannot be mistaken for each other. */
    .acard.mine { border-left-color: #1f6feb; border-color: color-mix(in srgb, #1f6feb 40%, transparent); background: color-mix(in srgb, #1f6feb 7%, var(--card)); }
    .acard.mine .acard-who { color: #1f6feb; font-weight: 700; }
    .aname-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .serving-summary { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 8px; }
    /* Name leads, top-left; elapsed time sits in a quiet pill opposite it. */
    .acard-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .aname { font-size: 18px; line-height: 1.25; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .elapsed { display: inline-flex; align-items: center; gap: 4px; flex: none; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 2px 9px 2px 7px; white-space: nowrap; }
    .elapsed svg { width: 12px; height: 12px; }
    /* Service and staff sit under the name as smaller, muted lines — one fact per line. */
    /* Long service names wrap rather than truncate — the full name matters more than a tidy line. */
    .acard-line { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.35; color: var(--muted); min-width: 0; }
    .acard-line svg { width: 13px; height: 13px; flex: none; margin-top: 1px; }
    .acard-line span { min-width: 0; overflow-wrap: anywhere; }
    /* Actions sit below a faint divider. Every button is neutral; only the glyph carries its
       meaning, so none of them pull focus from the guest. */
    .acard-actions-row { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
    .icon-btn { min-height: 34px; width: 38px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted); transition: background-color 0.1s ease; }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover { background: var(--bg); }
    /* Complete stays labeled — it's the action most tickets end with — but it's text, not a fill. */
    .icon-btn.complete { flex: 1; width: auto; font-size: 13px; font-weight: 600; color: var(--fg); }
    .icon-btn.complete svg { color: #166a37; }
    .icon-btn.transfer svg { color: var(--accent); }
    /* Neutral — undoes the call rather than destroying anything, so it stays muted. */
    .icon-btn.requeue svg { color: var(--muted); }
    .icon-btn.remove svg { color: var(--danger); }
    .icon-btn:disabled, td.actions button.call:disabled { opacity: 0.4; cursor: not-allowed; }
    .icon-btn:disabled:hover { background: var(--card); }
    .empty { font-size: 14px; color: var(--muted); padding: 6px 0; }

    /* Lobby */
    .lobby-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .lobby-title h2 { margin: 0; font-size: 20px; font-weight: 700; }
    .lobby-title h2 .count { font-weight: 500; color: var(--muted); }
    .oldest { font-size: 15px; color: var(--muted); }
    .oldest strong { color: var(--fg); font-weight: 700; }
    .lobby-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .lobby-tools button { white-space: nowrap; }
    /* Lobby header adapts to the panel's own width, not the window's. Wide: one row, title left
       and controls right. Narrow: title on top, then a tidy grid — the segmented control full
       width, Add customer and Call next sharing the row beneath it. */
    .lobby-panel { container: lobby / inline-size; }
    @container lobby (max-width: 879px) {
      .lobby-head { flex-direction: column; align-items: stretch; }
      /* Segmented control takes the full width; the two actions keep their natural size, with
         Add customer on the left and Call next pushed to the right. */
      .lobby-tools { display: flex; flex-wrap: wrap; gap: 8px; }
      .lobby-tools .segmented { flex: 1 1 100%; display: flex; }
      .lobby-tools .segmented button { flex: 1; min-width: 0; padding: 6px 8px; white-space: normal; line-height: 1.2; }
      .lobby-tools #call-next { margin-left: auto; }
    }
    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .segmented button { border: 0; border-radius: 0; background: var(--card); color: var(--fg); font-weight: 500; min-height: 36px; }
    .segmented button.active { background: #0a4670; color: #fff; font-weight: 600; }
    .lobby-tools select { min-height: 36px; padding: 4px 8px; border-radius: 8px; }
    .table-wrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--bg); }
    td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    td.num { color: var(--muted); width: 40px; }
    td.tno-cell { font-weight: 700; white-space: nowrap; }
    td.actions { white-space: nowrap; text-align: right; }
    td.actions button.call { min-width: 92px; background: #1f6feb; color: #fff; border: 0; font-weight: 600; }
    .wait-mid { color: #d97706; font-weight: 700; }
    .wait-long { color: #c62828; font-weight: 700; }

    /* Overflow menus */
    .menu-btn { min-height: 32px; width: 36px; padding: 0; font-size: 18px; line-height: 1; background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; }
    .menu { position: absolute; z-index: 20; min-width: 200px; max-width: 280px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
    .menu-info { margin: 6px 8px; font-size: 14px; line-height: 1.4; white-space: normal; }
    .menu button.menu-item { display: block; width: 100%; text-align: left; background: transparent; color: var(--fg); border: 0; border-radius: 6px; padding: 10px 12px; min-height: 40px; font-size: 15px; font-weight: 500; }
    .menu button.menu-item:hover { background: var(--bg); }
    .menu button.menu-item.is-danger { color: var(--danger); font-weight: 600; margin-top: 4px; border-top: 1px solid var(--border); border-radius: 0 0 6px 6px; }

    /* Transfer dialog */
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .dialog { padding: 18px; width: min(480px, 92vw); display: flex; flex-direction: column; gap: 12px; }
    .dialog h3 { margin: 0; font-size: 18px; }
    .transfer-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .transfer-btn { min-height: 48px; text-align: left; }

    .dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    .dialog input, .dialog select { min-height: 38px; padding: 6px 10px; font-size: 15px; color: var(--fg); }
    .dialog .appt-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dialog .err { margin: 0; min-height: 18px; font-size: 14px; color: var(--danger); }
    .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* Responsive — the queue rows reflow on their own via auto-fill; only the serving grid
       needs explicit breakpoints. */
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo-wrap"><img class="logo" alt="" style="visibility:hidden" onerror="this.parentNode.style.display='none'"></span>
      <div>
        <p class="org-label" data-org-name hidden></p>
        <h1>Lobby Check-In</h1>
        <p class="sub">
          <span id="signed-in"></span>
          <button id="counter-display" class="counter-btn hidden" type="button"></button>
          <input id="counter-edit" class="counter-edit hidden" maxlength="20" autocomplete="off">
        </p>
      </div>
    </div>
    <div class="top-actions">
      <a href="queue.html" aria-current="page">Queue Portal</a>
      <a id="manage-link" class="hidden" href="manage.html">Management</a>
      <a href="account.html">My account</a>
      <button id="signout" class="ghost hidden" type="button">Sign out</button>
      <span class="divider"></span>
      <button id="theme-toggle" class="ghost" type="button"><span class="theme-icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span><span class="theme-icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/><circle cx="12" cy="12" r="5"/></svg></span></button>
    </div>
  </header>

  <div id="conn-banner" class="conn-banner hidden">
    <span><strong id="conn-title" role="alert"></strong><span id="conn-detail"></span></span>
    <button id="conn-retry" type="button">Retry now</button>
  </div>

  <main id="dashboard" class="hidden">
    <div class="layout">
      <!-- Starts collapsed: on narrow screens the queue list is folded away so the lobby sits right
           below. On wide screens the collapse rules don't apply and the list is always shown. -->
      <aside class="sidebar panel collapsed" id="sidebar">
        <div class="panel-head">
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-expanded="false" aria-controls="sidebar-body">

            <svg class="sidebar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <button id="restore-default" class="restore-btn hidden" type="button" title="Restore my default queues" aria-label="Restore my default queues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button id="notify-toggle" class="hidden" type="button"></button>

          <div class="qgroup-label hidden" id="watched-label">Your Watched Queues</div>
          <div class="queue-list" id="watched-row"></div>
          <div class="qgroup-label hidden" id="other-label">Other Services</div>
          <div class="queue-list" id="other-row"></div>

              <button class="secondary" id="save-default" type="button">Save as my default</button>
            </div>

      <div class="main-col">

            <span class="muted" style="font-size:13px" id="updated"></span>

        <section class="panel lobby-panel">
          <div class="panel-head lobby-head">

                <button type="button" class="active" data-scope="watched">My Watched Queues</button>
                <button type="button" data-scope="all">All Lobby Customers</button>

                <tr><th>#</th><th>Name</th><th>Service</th><th>Wait Time</th><th>Appointment</th><th></th></tr>

          <div class="panel-head">
            <h2>Completed Today <span class="count" id="history-count"></span></h2>
            <button class="secondary" id="history-toggle" type="button">Show</button>
          </div>
          <div class="table-wrap hidden" id="history-wrap">
            <table>
              <thead><tr><th>Name</th><th>Service</th><th>Assisted by</th><th>Called</th><th>Completed</th><th>Appointment</th></tr></thead>
              <tbody id="history-body"></tbody>
