            if (target.row === 'new') { $('layout-add-row').classList.add('is-over'); return; }
            lastZone = target.zone;
            lastZone.classList.add('is-over');
            marker = el('span', 'drop-marker');
            var empty = lastZone.querySelector('.zone-empty');
            if (empty) empty.remove();
            lastZone.insertBefore(marker, target.before);
          }
          function finish(ev, drop) {
            document.removeEventListener('pointermove', move);
            document.removeEventListener('pointerup', up);
            document.removeEventListener('pointercancel', cancel);
            var target = ghost && drop ? dropTarget(ev.clientX, ev.clientY, code) : null;
            clearHints();
            if (ghost) { ghost.remove(); chip.classList.remove('is-dragging'); }
            if (target) moveTile(code, target.row, target.index);
            else if (ghost) renderBoard();
          }
          function up(ev) { finish(ev, true); }
          function cancel(ev) { finish(ev, false); }
          document.addEventListener('pointermove', move);
          document.addEventListener('pointerup', up);
          document.addEventListener('pointercancel', cancel);
        }

        function saveBoard() {
          var rows = board.rows.filter(function (r) { return r.length; });
          $('layout-save').disabled = true;
          setMsg($('layout-msg'), '');
          cfgApi('api/admin/layout', { method: 'PUT', body: JSON.stringify({ rows: rows }) })
            .then(function () {
              board.rows = rows;
              board.saved = boardSnapshot();
              cfg.flashLayout = true;
              updateBoardState();
              return reload();
            })
            .then(function () { if (cfg.flashLayout) { renderBoard(); setMsg($('layout-msg'), 'Layout saved. The kiosk has it now.', true); cfg.flashLayout = false; } })
            .catch(function (err) { setMsg($('layout-msg'), err.message); updateBoardState(); });
        }

        // ---- Department groups ----

        function groupCard(g) {
          var card = el('article', 'item-card');
          var preview = el('span', 'icon-preview');
          setIcon(preview, g.icon);
          var label = textInput(g.label, 100);
          var icon = iconPicker(g.icon, function (name) { setIcon(preview, name); card.dispatchEvent(new Event('change', { bubbles: true })); });
          var color = colorField(g.color, function () { card.dispatchEvent(new Event('change', { bubbles: true })); });
          var order = numberInput(g.sortOrder);
          var save = el('button', 'primary', 'Save');
          save.type = 'button';
          var remove = el('button', 'danger', 'Delete');
          remove.type = 'button';
          var msg = el('p', 'row-msg');
          var count = g.codes.length;

          var head = el('div', 'item-head');
          head.appendChild(preview);
          head.appendChild(el('span', 'item-code', g.id));
          head.appendChild(el('span', 'item-note', count + (count === 1 ? ' service' : ' services') + (count ? ': ' + g.codes.join(', ') : '')));

          var fields = el('div', 'fields');
          fields.appendChild(field('Name', label, 'c5'));
          fields.appendChild(field('Icon', icon.node, 'c3'));
          fields.appendChild(field('Colour', color.node, 'c3'));
          fields.appendChild(field('List order', order, 'c2', 'In Settings'));

          var foot = el('div', 'item-foot');
          foot.appendChild(msg);
          foot.appendChild(remove);
          foot.appendChild(save);
          card.appendChild(head);
          card.appendChild(fields);
          card.appendChild(foot);

          flashSaved('grp:' + g.id, msg);
          var track = trackCard(card, function () {
            return { label: label.value.trim(), icon: icon.value(), color: color.value(), sortOrder: order.value.trim() };
          }, save);

          save.addEventListener('click', function () {
            save.disabled = true;
            setMsg(msg, '');
            cfgApi('api/admin/groups/' + encodeURIComponent(g.id), { method: 'PATCH', body: JSON.stringify(track.changes()) })
              .then(function () { track.saved(); setMsg(msg, 'Saved.', true); cfg.saved = 'grp:' + g.id; return reload(); })
              .catch(function (err) { setMsg(msg, err.message); track.refresh(); });
          });
          remove.addEventListener('click', function () {
            if (!confirm('Delete the department group "' + g.label + '"?')) return;
            cfgApi('api/admin/groups/' + encodeURIComponent(g.id), { method: 'DELETE' })
              .then(function () { dirtyCards.delete(card); card.remove(); return reload(); })
              .catch(function (err) { setMsg(msg, err.message); });
          });
          return card;
        }

        function renderGroups() {
          renderList($('grp-list'), cfg.catalog.groups, groupCard, 'No department groups yet. Add one above.');
        }

        // ---- Languages ----

        function languageCard(l) {
          var card = el('article', 'item-card' + (l.enabled ? '' : ' is-off'));
          var name = textInput(l.name, 50);
          var enabled = checkbox(l.enabled);
          var isEnglish = l.code === 'en';
          if (isEnglish) enabled.disabled = true;
          var save = el('button', 'primary', 'Save');
          save.type = 'button';
          var msg = el('p', 'row-msg');

          var head = el('div', 'item-head');
          head.appendChild(el('span', 'item-code', l.code));
          if (isEnglish) head.appendChild(el('span', 'item-note', 'Always on'));
          if (!isEnglish) {
            var todo = l.untranslated || 0;
            if (todo) {
              var more = el('button', 'link-btn', todo + (todo === 1 ? ' item' : ' items') + ' still to translate');
              more.type = 'button';
              more.addEventListener('click', function () { openTranslations(l.code, ''); });
              head.appendChild(more);
            } else {
              head.appendChild(el('span', 'item-note', 'Fully translated'));
            }
          }
          head.appendChild(el('span', 'spacer'));
          var sw = el('label', 'switch');
          sw.appendChild(enabled);
          sw.appendChild(document.createTextNode('Show on kiosk'));
          head.appendChild(sw);

          var fields = el('div', 'fields');
          fields.appendChild(field('Name, as people in that language write it', name, 'c6'));
          var foot = el('div', 'item-foot');
          foot.appendChild(msg);
          if (!isEnglish) {
            var remove = el('button', 'danger', 'Delete');
            remove.type = 'button';
            remove.title = 'Delete this language and its translations. To keep them, turn it off instead.';
            remove.addEventListener('click', function () {
              if (!confirm('Delete ' + l.name + ' and every translation in it? This cannot be undone. To keep the translations, turn the language off instead.')) return;
              cfgApi('api/admin/languages/' + encodeURIComponent(l.code), { method: 'DELETE' })
                .then(function () { dirtyCards.delete(card); if (cfg.trLang === l.code) { cfg.trLang = ''; cfg.translations = null; } card.remove(); return reload(); })
                .catch(function (err) { setMsg(msg, err.message); });
            });
            foot.appendChild(remove);
          }
          foot.appendChild(save);
          card.appendChild(head);
          card.appendChild(fields);
          card.appendChild(foot);

          flashSaved('lang:' + l.code, msg);
          var track = trackCard(card, function () { return { name: name.value.trim(), enabled: enabled.checked }; }, save);
          save.addEventListener('click', function () {
            save.disabled = true;
            setMsg(msg, '');
            cfgApi('api/admin/languages/' + encodeURIComponent(l.code), { method: 'PATCH', body: JSON.stringify(track.changes()) })
              .then(function () { track.saved(); setMsg(msg, 'Saved.', true); cfg.saved = 'lang:' + l.code; return reload(); })
              .catch(function (err) { setMsg(msg, err.message); track.refresh(); });
          });
          return card;
        }

        function renderLanguages() {
          renderList($('lang-list'), cfg.catalog.languages, languageCard, 'No languages.');
          var select = $('tr-lang');
          var others = cfg.catalog.languages.filter(function (l) { return l.code !== 'en'; });
          var keep = cfg.trLang;
          fillSelect(select, others.map(function (l) { return { value: l.code, label: l.name + ' (' + l.code + ')' }; }));
          if (keep && others.some(function (l) { return l.code === keep; })) select.value = keep;
          cfg.trLang = select.value;
          $('tr-save').disabled = !select.value;
        }

        // ---- Translations ----

        function trInputs() { return $('tr-body').querySelectorAll('[data-key]'); }

        function translationsDirty() {
          if (!cfg.translations) return false;
          return Array.prototype.some.call(trInputs(), function (i) {
            return i.value.trim() !== (cfg.translations.original[i.getAttribute('data-key')] || '').trim();
          });
        }

        // `quiet` redraws without the "Loading" flash, for a reload after saving.
        function loadTranslations(quiet) {
          var lang = $('tr-lang').value;
          cfg.trLang = lang;
          var body = $('tr-body');
          $('tr-head').classList.toggle('hidden', !lang);
          if (!lang) { cfg.translations = null; body.textContent = 'Add a language first.'; $('tr-count').textContent = ''; return; }
          if (!quiet) body.textContent = 'Loading…';
          var token = ++cfg.trToken;
          cfgApi('api/admin/translations?lang=' + encodeURIComponent(lang))
            .then(function (data) {
              if (token !== cfg.trToken) return; // a newer request has replaced this one
              cfg.translations = { lang: data.lang, items: data.items, original: {} };
              renderTranslations();
            })
            .catch(function (err) { if (token === cfg.trToken) body.textContent = err.message; });
        }

        function renderTranslations() {
          var t = cfg.translations;
          var body = $('tr-body');
          body.textContent = '';
          var section = null;
          t.items.forEach(function (item) {
            if (item.section !== section) {
              section = item.section;
              body.appendChild(el('div', 'section-title', section));
            }
            t.original[item.key] = item.value;
            var row = el('div', 'translate-item');
            row.setAttribute('data-section', item.section);
            row.appendChild(el('span', 't-label', item.label));
            row.appendChild(el('span', 'english', item.english || ''));
            // A translation is often longer than the English, so a long one gets room to wrap.
            var long = Math.max((item.english || '').length, item.value.length) > 50;
            var input = long ? el('textarea') : el('input');
            if (long) input.rows = 2; else input.type = 'text';
            input.value = item.value;
            input.placeholder = item.english || '';
            input.maxLength = 500;
            input.setAttribute('data-key', item.key);
            input.setAttribute('aria-label', 'Translation of ' + item.label);
            row.appendChild(input);
            body.appendChild(row);
          });
          applyTodoFilter();
          updateTranslationCount();
          focusTranslation();
        }

        // Reads the catalogue again for its translation counts only, so the pills, notes and the badge follow what was just
        // saved. The lists are drawn again only when nothing on a card is unsaved, so nothing typed there is thrown away,
        // and the Translations list itself is left alone, so nothing being typed in it is either.
        function refreshTranslationCounts() {
          return cfgApi('api/admin/catalog').then(function (c) {
            cfg.catalog.languages.forEach(function (l) {
              var fresh = c.languages.filter(function (x) { return x.code === l.code; })[0];
              l.untranslated = fresh ? fresh.untranslated : undefined;
            });
            cfg.catalog.services.forEach(function (s) {
              var fresh = c.services.filter(function (x) { return x.code === s.code; })[0];
              s.untranslated = fresh ? fresh.untranslated : [];
            });
            updateTranslationBadge();
            if (!dirtyCards.size) { renderServices(); renderLanguages(); }
          });
        }

        // Marks which rows are already translated, so "only items still to translate" can hide them. The marks are
        // taken when the filter is switched on or the list is drawn, not while typing, so a row does not vanish under the cursor.
        function applyTodoFilter() {
          var body = $('tr-body');
          var rows = body.querySelectorAll('.translate-item');
          var sections = {};
          Array.prototype.forEach.call(rows, function (row) {
            var input = row.querySelector('[data-key]');
            var done = input.value.trim() !== '';
            row.classList.toggle('is-done', done);
            var s = row.getAttribute('data-section');
            if (!done) sections[s] = true;
          });
          Array.prototype.forEach.call(body.querySelectorAll('.section-title'), function (title) {
            title.classList.toggle('is-done', !sections[title.textContent]);
          });
          body.classList.toggle('only-todo', $('tr-todo').checked);
        }

        function updateTranslationCount() {
          if (!cfg.translations) return;
          var inputs = trInputs();
          var done = Array.prototype.filter.call(inputs, function (i) { return i.value.trim() !== ''; }).length;
          $('tr-count').textContent = done + ' of ' + inputs.length + ' translated';
          Array.prototype.forEach.call(inputs, function (i) {
            var changed = i.value.trim() !== (cfg.translations.original[i.getAttribute('data-key')] || '').trim();
            i.closest('.translate-item').classList.toggle('is-changed', changed);
          });
        }

        function saveTranslations() {
          if (!cfg.translations) return;
          var values = {};
          Array.prototype.forEach.call(trInputs(), function (i) {
            var key = i.getAttribute('data-key');
            var now = i.value.trim();
            if (now !== (cfg.translations.original[key] || '').trim()) values[key] = now;
          });
          var count = Object.keys(values).length;
          if (!count) { setMsg($('tr-msg'), 'Nothing to save.', true); return; }
          $('tr-save').disabled = true;
          setMsg($('tr-msg'), '');
          cfgApi('api/admin/translations', { method: 'PUT', body: JSON.stringify({ lang: cfg.translations.lang, values: values }) })
            .then(function () {
              setMsg($('tr-msg'), 'Saved ' + count + ' change' + (count === 1 ? '' : 's') + '.', true);
              loadTranslations(true);
              refreshTranslationCounts().catch(function () { /* the counts catch up the next time the page is opened */ });
            })
            .catch(function (err) { setMsg($('tr-msg'), err.message); })
            .then(function () { $('tr-save').disabled = !$('tr-lang').value; });
        }

        // ---- Adding ----

        var newSvcIcon, newSvcColor, newGrpIcon, newGrpColor;

        function buildAddFields() {
          newSvcIcon = iconPicker('');
          newSvcColor = colorField('');
          newGrpIcon = iconPicker('');
          newGrpColor = colorField('');
          $('svc-new-icon-slot').textContent = '';
          $('svc-new-color-slot').textContent = '';
          $('grp-new-icon-slot').textContent = '';
          $('grp-new-color-slot').textContent = '';
          $('svc-new-icon-slot').appendChild(newSvcIcon.node);
          $('svc-new-color-slot').appendChild(newSvcColor.node);
          $('grp-new-icon-slot').appendChild(newGrpIcon.node);
          $('grp-new-color-slot').appendChild(newGrpColor.node);
        }

        function addService() {
          if (!confirmDiscard()) return;
          var body = {
            code: $('svc-new-code').value.trim(),
            name: $('svc-new-name').value.trim(),
            description: $('svc-new-description').value.trim(),
            icon: newSvcIcon.value(),
            groupId: $('svc-new-group').value,
            color: newSvcColor.value(),
            asksAppointment: $('svc-new-appt').checked,
            pinned: $('svc-new-pinned').checked
          };
          var msg = $('svc-add-msg');
          setMsg(msg, '');
          cfgApi('api/admin/services', { method: 'POST', body: JSON.stringify(body) })
            .then(function () {
              setMsg(msg, 'Added ' + body.code.toUpperCase() + '. It shows on the kiosk now.', true);
              ['svc-new-code', 'svc-new-name', 'svc-new-description'].forEach(function (id) { $(id).value = ''; });
              $('svc-new-appt').checked = false;
              $('svc-new-pinned').checked = false;
              return reload(true).then(buildAddFields).then(function () { offerTranslation(msg, body.code.toUpperCase()); });
            })
            .catch(function (err) { setMsg(msg, err.message); });
        }

        function addGroup() {
          if (!confirmDiscard()) return;
          var body = {
            id: $('grp-new-id').value.trim().toLowerCase(),
            label: $('grp-new-label').value.trim(),
            icon: newGrpIcon.value(),
            color: newGrpColor.value()
          };
          var msg = $('grp-add-msg');
          setMsg(msg, '');
          cfgApi('api/admin/groups', { method: 'POST', body: JSON.stringify(body) })
            .then(function () {
              setMsg(msg, 'Added ' + body.label + '.', true);
              ['grp-new-id', 'grp-new-label'].forEach(function (id) { $(id).value = ''; });
              return reload(true).then(buildAddFields);
            })
            .catch(function (err) { setMsg(msg, err.message); });
        }

        function addLanguage() {
          if (!confirmDiscard()) return;
          var body = { code: $('lang-new-code').value.trim().toLowerCase(), name: $('lang-new-name').value.trim() };
          var msg = $('lang-add-msg');
          setMsg(msg, '');
          cfgApi('api/admin/languages', { method: 'POST', body: JSON.stringify(body) })
            .then(function () {
              setMsg(msg, 'Added ' + body.name + '. Now translate it on the Translations tab.', true);
              $('lang-new-code').value = '';
              $('lang-new-name').value = '';
              cfg.trLang = body.code;
              return reload(true);
            })
            .catch(function (err) { setMsg(msg, err.message); });
        }

        // ---- Loading and tabs ----

        function showSection(tab) {
          currentSection = tab;
          SECTIONS.forEach(function (t) { $('cfg-panel-' + t).classList.toggle('hidden', t !== tab); });
          document.querySelectorAll('.subtab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
          if (tab !== 'translations') cfg.focusKey = '';
          // A redraw held back by unsaved changes happens once they are saved or lost.
          if (cfg.stale && !dirtyCards.size) reload().catch(function () {});
          if (tab === 'translations' && !cfg.translations) loadTranslations();
        }

        function wire() {
          Array.prototype.forEach.call(document.querySelectorAll('#panel-catalog .subtab-btn'), function (b) {
            b.addEventListener('click', function () { showSection(b.dataset.tab); });
          });
        $('svc-add').addEventListener('click', addService);
        $('layout-save').addEventListener('click', saveBoard);
        $('layout-discard').addEventListener('click', function () { setMsg($('layout-msg'), ''); buildBoard(); });
        $('layout-add-row').addEventListener('click', function () { board.rows.push([]); renderBoard(); });
        $('grp-add').addEventListener('click', addGroup);
        $('lang-add').addEventListener('click', addLanguage);
        $('tr-lang').addEventListener('change', function () {
          if (translationsDirty() && !confirm('Some translations have not been saved. Switch language and lose them?')) {
            $('tr-lang').value = cfg.trLang;
            return;
          }
          cfg.translations = null;
          loadTranslations();
        });
        $('tr-todo').addEventListener('change', applyTodoFilter);
        $('tr-body').addEventListener('input', updateTranslationCount);
        $('tr-save').addEventListener('click', saveTranslations);
        window.addEventListener('beforeunload', function (e) {
          if (dirtyCards.size || translationsDirty()) { e.preventDefault(); e.returnValue = ''; }
        });
        }

        // Draws the tab into its panel. Called once, for an admin. The lists load when the tab is first opened.
        function init(panel) {
          panel.appendChild(document.getElementById('catalog-template').content.cloneNode(true));
          wire();
        }

        // Called each time the tab is opened. The first time loads the lists; after that they are read again, and
        // anything with unsaved changes is left as it is.
        function show() {
          if (cfg.catalog) { reload().catch(function () {}); return; }
          if (loadingCatalog) return;
          loadingCatalog = true;
          cfgApi('api/admin/catalog').then(function (c) {
            cfg.catalog = c;
            $('cfg-load-msg').classList.add('hidden');
            buildAddFields();
            renderAll();
            document.querySelector('#panel-catalog .subtabs').classList.remove('hidden');
            $('cfg-body').classList.remove('hidden');
            showSection(currentSection);
          }).catch(function (err) {
            var m = $('cfg-load-msg');
            m.textContent = err.message;
            m.classList.remove('hidden');
          }).then(function () { loadingCatalog = false; });
        }

        return { init: init, show: show };
      })();

      // ================= Tabs & boot =================

      function showTab(tab) {
        Object.keys(TAB_ACCESS).forEach(function (t) {
          $('panel-' + t).classList.toggle('hidden', t !== tab);
        });
        document.querySelectorAll('.tab-btn').forEach(function (b) {
          b.classList.toggle('active', b.dataset.tab === tab);
        });
        var params = new URLSearchParams(location.search);
        params.set('tab', tab);
        history.replaceState(null, '', location.pathname + '?' + params.toString());
        // The report reloads each time its tab is opened, so it always shows current data.
        if (tab === 'reports') loadReportRange();
        if (tab === 'catalog') catalogTab.show();
        // The Service Configuration tab may have changed services since the list was read.
        if (tab === 'services' && state.servicesStale) { state.servicesStale = false; loadServices().catch(function (err) { alert(err.message); }); }
        if (tab === 'settings' || tab === 'security') loadSettingsTab(tab);
        if (tab === 'health') loadAudit();
      }

      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { showTab(btn.dataset.tab); });
      });

      (async function start() {
        // The password rules and other settings are read from the server before the page is drawn.
        await window.appSettingsReady;
        try {
          state.user = await api('/api/auth/me');
        } catch (err) {
          renderDenied('Sign in to access management.');
          return;
        }
        if (state.user.mustChangePassword) { window.location.href = BASE + 'account.html'; return; }
        if (state.user.role === 'staff') {
          renderDenied('Your account does not have access to this page.');
          return;
        }
        $('signed-in').textContent = state.user.displayName + ' · ' + ROLE_LABEL[state.user.role];

        // Only show tabs this role is actually allowed into — see TAB_ACCESS above.
        var availableTabs = Object.keys(TAB_ACCESS).filter(function (t) {
          return TAB_ACCESS[t].indexOf(state.user.role) >= 0;
        });
        if (!availableTabs.length) {
          renderDenied('Your account does not have access to this page.');
          return;
        }
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
          btn.classList.toggle('hidden', availableTabs.indexOf(btn.dataset.tab) < 0);
        });

        var app = $('app');
        app.textContent = '';
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-services';
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-staff';
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-reports';
        buildReports(app.lastChild);
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-health';
        var healthTab = app.lastChild;
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-settings';
        var settingsTab = app.lastChild;
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-security';
        buildSettings(settingsTab, healthTab, app.lastChild);
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-catalog';
        if (availableTabs.indexOf('catalog') >= 0) catalogTab.init(app.lastChild);

        try {
          var toLoad = [];
          if (availableTabs.indexOf('services') >= 0) toLoad.push(loadServices());
          if (availableTabs.indexOf('staff') >= 0) toLoad.push(loadUsers());
          await Promise.all(toLoad);
        } catch (err) {
          renderDenied(err.message || 'Could not load management data.');
          return;
        }

        $('tabs').classList.remove('hidden');
        var requested = new URLSearchParams(location.search).get('tab');
        showTab(availableTabs.indexOf(requested) >= 0 ? requested : availableTabs[0]);
      })();
    })();
  </script>
</body>
</html>
