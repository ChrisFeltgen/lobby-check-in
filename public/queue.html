  <div id="menu" class="menu hidden"></div>

  <script src="socket.io/socket.io.js"></script>
  <script src="icons.js"></script>
  <script>
    (function () {
      var BASE = location.pathname.replace(/[^/]*$/, '');
      // A service marked "pinned" in Service Configuration (Appointment Check-In, by default) always has someone
      // due any minute, so it stays in Your Watched Queues and can't be unwatched.
      function isPinned(code) {
        var svc = state.queue.find(function (s) { return s.code === code; });
        return !!(svc && svc.pinned);
      }
      function pinnedCodes() {
        return state.queue.filter(function (s) { return s.pinned; }).map(function (s) { return s.code; });
      }
      function addPinned(codes) {
        pinnedCodes().forEach(function (c) { if (codes.indexOf(c) < 0) codes.push(c); });
        return codes;
      }
      var state = {
        user: null,          // { id, username, displayName, role } once signed in
        counter: localStorage.getItem('staffCounter') || '',
        queue: [],
        watched: null,      // null means every queue is watched until the staff member edits the list
        hideOther: false,   // collapses the Other Services section out of the way entirely
        scope: 'watched',
        notifyEnabled: false, // desktop notification when someone joins a watched queue
      };

      function $(id) { return document.getElementById(id); }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }

      // The session lives in an HttpOnly cookie, sent automatically with same-origin requests.
      // ---- Connection to the server ----
      // The portal keeps a list on screen that goes stale if the server cannot be reached. It says so across the
      // top of the page, pauses the buttons that change things, and carries on by itself once the server answers.
      var REQUEST_MS = 10000;   // a request that has not been answered by now has failed
      var STALE_MS = 25000;     // no good update for this long and the list is called out of date
      var conn = { lastOk: Date.now(), failures: 0, stale: false, suspendUntil: 0, backTimer: null, waiting: false };

      function networkError(message) {
        var e = new Error(message);
        e.network = true;
        return e;
      }

      async function api(path, opts) {
        opts = opts || {};
        var method = opts.method || 'GET';
        // While the list is out of date, nothing that changes the queue is sent: it could land on a customer who has moved on.
        if (method !== 'GET' && conn.stale && path.indexOf('/api/auth/logout') < 0) {
          throw networkError('Not sent: the connection to the server is down. Try again when it is back.');
        }
        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timer = controller ? setTimeout(function () { controller.abort(); }, REQUEST_MS) : null;
        var res;
        var data;
        var parsed = true;
        try {
          res = await fetch(BASE + path.replace(/^\//, ''), {
            method: method, headers: { 'Content-Type': 'application/json' }, body: opts.body, credentials: 'same-origin',
            signal: controller ? controller.signal : undefined
          });
          data = await res.json().catch(function () { parsed = false; return {}; });
          if (controller && controller.signal.aborted) throw new Error('timed out');
        } catch (err) {
          throw networkError(method === 'GET' ? 'Could not reach the server.' : 'Could not reach the server. Check the queue to see whether that went through.');
        } finally {
          clearTimeout(timer);
        }
        // The web server answering instead of the app (its own 404 or error page, which is not JSON) means the app is not running.
        if (!parsed && (res.status === 404 || res.status >= 500)) throw networkError('The server is not responding.');
        if (res.status === 401 && state.user) { state.user = null; showLogin(); }
        // A forced password change stops every action until it's done.
        if (data.code === 'PASSWORD_CHANGE_REQUIRED') { window.location.href = BASE + 'account.html'; throw new Error(data.error); }
        if (res.status === 502 || res.status === 503 || res.status === 504) throw networkError('The server is not responding.');
        if (!res.ok) {
          var failure = new Error(res.status >= 500 ? 'The server had a problem. Try again in a moment.' : (data.error || 'Request failed (' + res.status + ')'));
          failure.auth = res.status === 401;
          throw failure;
        }
        return data;
      }

      // A message for the person using the portal. It stays on the line at the foot of the page and also pops up
      // for a few seconds, because that line is out of sight on a busy screen.
      var toastTimer = null;
      function showMsg(text) {
        $('msg').textContent = text || '';
        var old = document.getElementById('toast');
        if (old) old.remove();
        clearTimeout(toastTimer);
        if (!text) return;
        var box = el('div', 'toast', text);
        box.id = 'toast';
        box.setAttribute('role', 'status');
        document.body.appendChild(box);
        toastTimer = setTimeout(function () { box.remove(); }, 6000);
      }

      function connClock(ms) {
        return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
      }

      // The list is out of date when two checks in a row fail, when the browser says there is no network, or when
      // it has been too long since the last good one (a connection that hangs fails no check at all).
      function connIsStale() {
        if (conn.failures >= 2 || navigator.onLine === false) return true;
        return Date.now() > conn.suspendUntil && Date.now() - conn.lastOk > STALE_MS;
      }

      // Draws the warning across the top, or the short "back online" note when the list catches up. Runs every second.
      function renderConnection() {
        var stale = !!state.user && connIsStale();
        var was = conn.stale;
        conn.stale = stale;
        var banner = $('conn-banner');
        document.body.classList.toggle('is-offline', stale);
        $('updated').classList.toggle('stale', stale);
        if (stale) {
          clearTimeout(conn.backTimer);
          if (banner.className !== 'conn-banner') banner.className = 'conn-banner';
          // Only touched when it changes: the heading is an alert, and rewriting it every second could be read out again.
          var title = navigator.onLine === false ? 'This computer is offline.' : 'Connection lost.';
          if ($('conn-title').textContent !== title) $('conn-title').textContent = title;
          $('conn-detail').textContent = ' Last updated ' + connClock(conn.lastOk) + '. Actions are paused.';
        } else if (was) {
          banner.className = 'conn-banner back';
          $('conn-title').textContent = 'Back online.';
          $('conn-detail').textContent = '';
          clearTimeout(conn.backTimer);
          conn.backTimer = setTimeout(function () { if (!conn.stale) banner.className = 'conn-banner hidden'; }, 4000);
        }
      }

      function noteRefresh(ok) {
        if (ok) {
          conn.lastOk = Date.now();
          conn.failures = 0;
        } else {
          conn.failures += 1;
          pollSoon();
        }
        renderConnection();
      }

      function nameOf(code) {
        var s = state.queue.find(function (q) { return q.code === code; });
        return s ? s.name : code;
      }

      function minutesSince(iso) {
        return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
      }

      function waitText(m) { return m < 1 ? '< 1 min' : m + ' min'; }

      // Wait colour is used sparingly: orange for moderate waits, red only for long ones.
      function waitClass(m) { return m >= 12 ? 'wait-long' : m >= 6 ? 'wait-mid' : ''; }

      // How long the longest-waiting person in this one queue has been waiting — null if
      // nobody is.
      function longestWaitMinutes(svc) {
        if (!svc.waiting.length) return null;
        return Math.max.apply(null, svc.waiting.map(function (t) { return minutesSince(t.createdAt); }));
      }

      function watchedCodes() {
        var all = state.queue.map(function (s) { return s.code; });
        if (!state.watched) return all;
        var codes = all.filter(function (c) { return state.watched.indexOf(c) >= 0; });
        // Pinned regardless of what's saved — covers old saved lists from before this existed.
        return addPinned(codes);
      }

      function loadWatched() {
        try {
          var v = JSON.parse(localStorage.getItem('staffWatched'));
          state.watched = Array.isArray(v) ? v : null;
        } catch (e) { state.watched = null; }
      }

      function setWatched(list) {
        state.watched = list;
        try { localStorage.setItem('staffWatched', JSON.stringify(list)); } catch (e) { /* storage unavailable: applies for this session */ }
        render();
      }

      // The saved default is applied at sign-in, so the watch list follows the account to any computer.
      // Changes made during a session stay on this computer until the next sign-in.
      function applyDefaultQueues() {
        var saved = state.user && state.user.defaultQueues;
        if (!Array.isArray(saved)) return;
        state.watched = saved.slice();
        try { localStorage.setItem('staffWatched', JSON.stringify(saved)); } catch (e) { /* storage unavailable: applies for this session */ }
      }

      // The restore icon shows only when the watch list differs from the saved default (or from watching
      // every queue, when no default is saved). Clicking it puts the default back for this session.
      function renderRestoreButton() {
        var all = state.queue.map(function (q) { return q.code; });
        function normalize(list) {
          var codes = list ? list.filter(function (c) { return all.indexOf(c) >= 0; }) : all.slice();
          addPinned(codes);
          return codes.sort().join(',');
        }
        var saved = state.user && Array.isArray(state.user.defaultQueues) ? state.user.defaultQueues : null;
        var differs = normalize(state.watched) !== normalize(saved);
        $('restore-default').classList.toggle('hidden', !state.user || !differs);
      }

      function restoreDefaults() {
        var saved = state.user && Array.isArray(state.user.defaultQueues) ? state.user.defaultQueues : null;
        setWatched(saved ? saved.slice() : null);
      }

      // Shown only until a default is saved. Once there is one, it's managed on My account, so this
      // box goes away. An error from saving is the one time it stays visible after a default exists.
      function renderDefaultBox(error) {
        var saved = state.user && Array.isArray(state.user.defaultQueues);
        $('default-box').classList.toggle('hidden', !!saved && !error);
        $('default-status').textContent = error || 'No default saved. Save the queues you watch to use them on any computer.';
      }

      async function saveDefault() {
        $('save-default').disabled = true;
        try {
          var result = await api('/api/account/default-queues', { method: 'PUT', body: JSON.stringify({ codes: watchedCodes() }) });
          state.user.defaultQueues = result.defaultQueues;
          renderDefaultBox();
        } catch (err) {
          renderDefaultBox(err.message);
        } finally {
          $('save-default').disabled = false;
        }
      }

      function toggleWatch(code) {
        if (isPinned(code)) return;
        var w = watchedCodes().slice();
        var i = w.indexOf(code);
        if (i >= 0) w.splice(i, 1); else w.push(code);
        setWatched(w);
        if (i >= 0) showUndo(code);
      }

      // After a queue is taken out of the watched list, says so for a few seconds with a way to put it back.
      var undoTimer = null;
      function showUndo(code) {
        var old = document.getElementById('undo-bar');
        if (old) old.remove();
        clearTimeout(undoTimer);
        var svc = state.queue.find(function (s) { return s.code === code; });
        var bar = el('div', 'undo-bar');
        bar.id = 'undo-bar';
        bar.setAttribute('role', 'status');
        bar.appendChild(el('span', null, 'Stopped watching ' + (svc ? svc.name : code) + '.'));
        var undo = el('button', null, 'Undo');
        undo.type = 'button';
        undo.addEventListener('click', function () { bar.remove(); clearTimeout(undoTimer); toggleWatch(code); });
        bar.appendChild(undo);
        document.body.appendChild(bar);
        undoTimer = setTimeout(function () { bar.remove(); }, 7000);
      }

      // Other Services can be collapsed out of the way entirely, for a staff member who only
      // ever cares about their own watched queues — remembered per device, like the watch list.
      function loadHideOther() {
        state.hideOther = localStorage.getItem('staffHideOther') === '1';
      }

      function setHideOther(hide) {
        state.hideOther = hide;
        try { localStorage.setItem('staffHideOther', hide ? '1' : '0'); } catch (e) { /* storage unavailable: applies for this session */ }
        render();
      }

      // ---- Overflow menus ----
      function closeMenu() { $('menu').classList.add('hidden'); $('menu').textContent = ''; }

      // A small popover showing one piece of text — used for the closure reason, so a long
      // message doesn't stretch the queue tile's fixed-height grid layout.
      function openInfo(anchor, text) {
        var menu = $('menu');
        menu.textContent = '';
        menu.appendChild(el('p', 'menu-info', text));
        var r = anchor.getBoundingClientRect();
        menu.style.top = (r.bottom + window.scrollY + 4) + 'px';
        menu.classList.remove('hidden');
        menu.style.left = (r.right + window.scrollX - menu.offsetWidth) + 'px';
      }

      function openMenu(anchor, items) {
        var menu = $('menu');
        menu.textContent = '';
        items.forEach(function (item) {
          var b = el('button', 'menu-item' + (item.danger ? ' is-danger' : ''), item.label);
          b.type = 'button';
          // Stop this click from reaching the document-level "click outside closes the menu"
          // listener below — otherwise an item whose run() reopens the same #menu element (the
          // closed-queue menu's "Why closed?" does, via openInfo) gets closed again immediately,
          // racing against its own freshly-rendered content.
          b.addEventListener('click', function (e) { e.stopPropagation(); closeMenu(); item.run(); });
          menu.appendChild(b);
        });
        var r = anchor.getBoundingClientRect();
        menu.style.top = (r.bottom + window.scrollY + 4) + 'px';
        menu.classList.remove('hidden');
        menu.style.left = (r.right + window.scrollX - menu.offsetWidth) + 'px';
      }

      document.addEventListener('click', function (e) {
        if (!$('menu').contains(e.target) && !(e.target.classList && e.target.classList.contains('menu-btn'))) closeMenu();
      });

      // ---- Actions ----
      // A customer another person is helping is theirs to complete, reassign, return or remove. Doing it anyway is
      // allowed, but asked about first. A customer still waiting belongs to no one.
      function confirmOthersTicket(t) {
        if (t.status === 'waiting' || !t.calledBy || isMine(t)) return true;
        return confirm("You are about to change someone else's ticket. Proceed?");
      }

      function ticketAction(t, action) {
        if (action === 'complete' && !isWatched(t.serviceCode)) { showMsg(watchFirst(t.serviceCode, 'complete')); return; }
        if (!confirmOthersTicket(t)) return;
        if (action === 'remove' && !confirm('Remove ' + t.customerName + ' from the queue?')) return;
        showMsg('');
        api('/api/staff/tickets/' + t.id + '/' + action, { method: 'POST' })
          .then(refresh)
          .catch(function (err) { showMsg(err.message); });
      }

      function callTicket(t) {
        if (!isWatched(t.serviceCode)) { showMsg(watchFirst(t.serviceCode, 'call')); return; }
        showMsg('');
        api('/api/staff/tickets/' + t.id + '/call', { method: 'POST', body: JSON.stringify({ counter: state.counter }) })
          .then(refresh)
          .catch(function (err) { showMsg(err.message); refresh(); });
      }

      // Icons for the always-visible Complete / Transfer / Remove buttons on each helped card.
      var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      // A left-right swap, not a circular arrow — Return to queue already owns the "circular
      // undo" shape below, and the two looked too similar to tell apart at a glance.
      var ICON_TRANSFER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h13"/><path d="M17 20l4-4-4-4"/><path d="M21 16H8"/></svg>';
      var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
      // A proper undo arrow: one continuous curve into a clear chevron tip, not two paths that
      // only approximately line up.
      var ICON_RETURN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
      var ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
      var ICON_PERSON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

      // Icons come from the service list (see icons.js), so a service shows the same icon everywhere.
      function svgIcon(inner) {
        var wrap = document.createElement('span');
        wrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
        return wrap.firstChild;
      }
      function iconFor(code) {
        var svc = state.queue.find(function (x) { return x.code === code; });
        var paths = window.ICON_PATHS || {};
        return svgIcon(paths[svc && svc.icon] || paths.calendar || '');
      }

      // Calls the first (longest-waiting) customer in one queue, regardless of watch state.
      function quickCallNext(svc) {
        var first = svc.waiting[0];
        if (!first) return;
        callTicket(first);
      }

      // ---- Desktop notifications: someone joined a watched queue ----
      var NOTIFY_KEY = 'staffNotify';
      var NOTIFY_MS = 6000; // how long an arrival alert stays up before closing itself
      var ICON_BELL = '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>';

      function loadNotifyPref() {
        state.notifyEnabled = localStorage.getItem(NOTIFY_KEY) === '1' &&
          typeof Notification !== 'undefined' && Notification.permission === 'granted';
      }

      function renderNotifyToggle() {
        var btn = $('notify-toggle');
        if (typeof Notification === 'undefined') { btn.classList.add('hidden'); return; }
        btn.classList.remove('hidden');
        btn.classList.toggle('active', state.notifyEnabled);
        btn.setAttribute('aria-pressed', String(state.notifyEnabled));
        btn.title = state.notifyEnabled
          ? 'Desktop notifications on for watched queues — click to turn off'
          : 'Turn on desktop notifications when someone joins a watched queue';
      }

      // Diffs each refresh's waiting lists against the previous one and notifies for any new
      // arrival in a watched queue. The very first call just establishes the baseline — nobody
      // wants a flood of notifications for people already waiting when the page loads.
      var knownWaitingIds = null;
      function checkNewArrivals(services) {
        var watched = watchedCodes();
        var watchedSet = {};
        watched.forEach(function (c) { watchedSet[c] = true; });

        var currentIds = {};
        services.forEach(function (svc) {
          svc.waiting.forEach(function (t) { currentIds[t.id] = { svc: svc, t: t }; });
        });

        var canNotify = state.notifyEnabled && typeof Notification !== 'undefined' && Notification.permission === 'granted';
        if (knownWaitingIds !== null && canNotify) {
          Object.keys(currentIds).forEach(function (id) {
            if (knownWaitingIds[id]) return;
            var entry = currentIds[id];
            if (watchedSet[entry.svc.code]) notifyNewArrival(entry.svc, entry.t);
          });
        }
        knownWaitingIds = currentIds;
      }

      function notifyNewArrival(svc, t) {
        try {
          // Position in line is the customer's place among those still waiting for this service.
          var position = svc.waiting.findIndex(function (w) { return w.id === t.id; }) + 1;
          var n = new Notification('New check-in: ' + t.customerName, {
            body: svc.name + (position ? '\nPosition ' + position + ' in line' : ''),
            tag: 'queue-arrival-' + t.id,
            icon: BASE + 'images/notification-icon.png',
            silent: false
          });
          // Temporary: closes on its own after a few seconds, so it never waits to be dismissed.
          var closeTimer = setTimeout(function () { n.close(); }, NOTIFY_MS);
          n.onclick = function () { clearTimeout(closeTimer); window.focus(); n.close(); };
        } catch (e) { /* notifications unavailable in this browser: fail silently */ }
      }

      $('notify-toggle').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON_BELL + '</svg>';
      // Narrow screens only: folds the queue list away or back out. Harmless on wide screens,
      // where the toggle ignores clicks and the list is always visible.
      $('sidebar-toggle').addEventListener('click', function () {
        var collapsed = $('sidebar').classList.toggle('collapsed');
        this.setAttribute('aria-expanded', String(!collapsed));
      });

      $('notify-toggle').addEventListener('click', function () {
        if (state.notifyEnabled) {
          state.notifyEnabled = false;
          localStorage.setItem(NOTIFY_KEY, '0');
          renderNotifyToggle();
          return;
        }
        if (typeof Notification === 'undefined') return;
        if (Notification.permission === 'denied') {
          alert('Desktop notifications are blocked for this site. Allow them from your browser\'s site settings, then try again.');
          return;
        }
        if (Notification.permission === 'granted') {
          state.notifyEnabled = true;
          localStorage.setItem(NOTIFY_KEY, '1');
          renderNotifyToggle();
          return;
        }
        Notification.requestPermission().then(function (perm) {
          if (perm === 'granted') {
            state.notifyEnabled = true;
            localStorage.setItem(NOTIFY_KEY, '1');
          }
          renderNotifyToggle();
        });
      });

      // Forces a closed queue back open, overriding whatever is closing it right now (manual or
      // scheduled). This only clears the current closure — the server caps it at the end of
      // today's scheduled window, if any, so the queue still auto-closes next time its schedule
      // triggers rather than staying force-open indefinitely.
      function reopenService(code, name) {
        if (!confirm('Reopen ' + name + '? This clears the current closure only — it will close again automatically the next time a scheduled closure starts.')) return;
        showMsg('');
        api('/api/services/' + code + '/override', { method: 'PATCH', body: JSON.stringify({ override: 'open' }) })
          .then(refresh)
          .catch(function (err) { showMsg(err.message); });
      }

      // Adds a customer from this station. Uses the same check-in as the kiosk.
      // Whether a service asks who the customer is seeing and the appointment time (set in Service Configuration).
      function asksAppointment(code) {
        var svc = state.queue.find(function (s) { return s.code === code; });
        return !!(svc && svc.asksAppointment);
      }

      function appointmentTimes() {
        var out = [];
        for (var mins = 7 * 60; mins <= 17 * 60 + 30; mins += 30) {
          var h = Math.floor(mins / 60), m = mins % 60;
          out.push(((h + 11) % 12 + 1) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' AM' : ' PM'));
        }
        return out;
      }

      function labelled(text, control) {
        var l = el('label');
        l.appendChild(el('span', null, text));
        l.appendChild(control);
        return l;
      }

      function openAddCustomer() {
        closeMenu();
        var overlay = el('div', 'overlay');
        var form = el('form', 'dialog card');
        form.appendChild(el('h3', null, 'Add customer to a queue'));

        var serviceSel = document.createElement('select');
        // Alphabetical by name, sorted on a copy so state.queue keeps the server's order.
        state.queue.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (s) {
          var o = el('option', null, s.name);
          o.value = s.code;
          serviceSel.appendChild(o);
        });
        form.appendChild(labelled('Queue', serviceSel));

        var nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.maxLength = 60;
        nameInput.required = true;
        nameInput.autocomplete = 'off';
        form.appendChild(labelled('Customer name', nameInput));

        var withInput = document.createElement('input');
        withInput.type = 'text';
        withInput.maxLength = 100;
        withInput.autocomplete = 'off';
        var timeSel = document.createElement('select');
        var placeholder = el('option', null, 'Choose a time');
        placeholder.value = '';
        timeSel.appendChild(placeholder);
        appointmentTimes().forEach(function (t) {
          var o = el('option', null, t);
          o.value = t;
          timeSel.appendChild(o);
        });
        var apptFields = el('div', 'appt-fields');
        apptFields.appendChild(labelled('Appointment with', withInput));
        apptFields.appendChild(labelled('Appointment time', timeSel));
        form.appendChild(apptFields);

        function syncAppt() { apptFields.classList.toggle('hidden', !asksAppointment(serviceSel.value)); }
        serviceSel.addEventListener('change', syncAppt);
        syncAppt();

        var err = el('p', 'err');
        form.appendChild(err);

        var actions = el('div', 'actions');
        var cancel = el('button', 'secondary', 'Cancel');
        cancel.type = 'button';
        cancel.addEventListener('click', function () { overlay.remove(); });
        var add = el('button', 'primary', 'Add to queue');
        add.type = 'submit';
        actions.appendChild(cancel);
        actions.appendChild(add);
        form.appendChild(actions);

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          err.textContent = '';
          var body = { serviceId: serviceSel.value, name: nameInput.value.trim() };
          if (!body.name) { err.textContent = 'Enter the customer name.'; return; }
          if (asksAppointment(serviceSel.value)) {
            body.appointment = { with: withInput.value.trim(), time: timeSel.value };
            if (!body.appointment.with) { err.textContent = 'Enter who the customer is seeing.'; return; }
            if (!body.appointment.time) { err.textContent = 'Choose the appointment time.'; return; }
          }
          add.disabled = true;
          api('/api/tickets', { method: 'POST', body: JSON.stringify(body) })
            .then(function () { overlay.remove(); refresh(); })
            .catch(function (error) { err.textContent = error.message; add.disabled = false; });
        });

        overlay.appendChild(form);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
        document.body.appendChild(overlay);
        nameInput.focus();
      }

      // Picks another queue for the customer. The list leaves out the queue they are already in.
      function openTransfer(t) {
        closeMenu();
        if (!confirmOthersTicket(t)) return;
        var overlay = el('div', 'overlay');
        var dialog = el('div', 'dialog card');
        dialog.appendChild(el('h3', null, 'Transfer ' + t.customerName + ' to:'));
        var list = el('div', 'transfer-list');
        state.queue.filter(function (s) { return s.code !== t.serviceCode; }).forEach(function (s) {
          var b = el('button', 'secondary transfer-btn', s.name);
          b.type = 'button';
          b.addEventListener('click', function () { overlay.remove(); doTransfer(t, s.code); });
          list.appendChild(b);
        });
        dialog.appendChild(list);
        var cancel = el('button', 'secondary', 'Cancel');
        cancel.type = 'button';
        cancel.addEventListener('click', function () { overlay.remove(); });
        dialog.appendChild(cancel);
        overlay.appendChild(dialog);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
        document.body.appendChild(overlay);
      }

      function doTransfer(t, serviceCode) {
        showMsg('');
        api('/api/staff/tickets/' + t.id + '/transfer', { method: 'POST', body: JSON.stringify({ serviceId: serviceCode }) })
          .then(refresh)
          .catch(function (err) { showMsg(err.message); });
      }

      // ---- Rendering ----

      // Closed-queue reason/reopen actions, tucked behind a small menu button instead of sitting
      // inline — keeps the row compact regardless of how long the reason text is. Open is the
      // implied default, so this only renders anything when a queue is actually closed.
      function queueStatusRow(svc) {
        if (svc.available) return null;
        var row = el('div', 'qstatus');
        row.appendChild(el('span', 'qdot'));
        row.appendChild(document.createTextNode('Closed'));
        var menuBtn = el('button', 'menu-btn qmenu-btn', '⋯');
        menuBtn.type = 'button';
        menuBtn.title = 'Closed options';
        menuBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var items = [{ label: 'Why closed?', run: function () { openInfo(menuBtn, svc.unavailableMessage); } }];
          // The fast path: Managers and Admins can force a queue back open right from here.
          // Full control (setting the message, or recurring schedules) lives on Management.
          if (state.user && state.user.role !== 'staff') {
            items.push({ label: 'Reopen', run: function () { reopenService(svc.code, svc.name); } });
          }
          openMenu(menuBtn, items);
        });
        row.appendChild(menuBtn);
        return row;
      }

      // One row in the sidebar list, shared by both watched and unwatched services — only the
      // class names, the chevron, and the click behavior differ between them.
      function queueRow(svc, opts) {
        var pinned = opts.watched && !!svc.pinned;
        var hasWaiting = svc.waiting.length > 0;
        var cls = 'qrow' + (opts.watched ? ' watched' : '') + (!svc.available ? ' closed' : '') + (hasWaiting ? ' has-waiting' : '') + (pinned ? ' pinned' : '');
        var row = el('div', cls);
        // A queue that is not watched can be watched by clicking anywhere on it, which does no harm. A watched one
        // is stopped only with its own button, so a click aimed at Call next cannot hide it.
        if (pinned) row.title = 'Always watched';
        else if (!opts.watched) row.title = 'Click to watch this queue';

        var iconWrap = el('span', 'qicon');
        iconWrap.appendChild(iconFor(svc.code));
        row.appendChild(iconWrap);

        var body = el('div', 'qrow-body');
        body.appendChild(el('div', 'qname', svc.name));
        var meta = el('div', 'qrow-meta');
        meta.appendChild(el('span', 'qcount', String(svc.waiting.length)));
        meta.appendChild(el('span', 'qcount-label', 'waiting'));
        var longestWait = longestWaitMinutes(svc);
        if (longestWait !== null) {
          meta.appendChild(el('span', 'qwait ' + waitClass(longestWait), '· Longest ' + waitText(longestWait)));
        }
        // The count, Call next and the cross share this second line; the name above has the full width of the row.
        var line = el('div', 'qrow-meta-line');
        line.appendChild(meta);
        body.appendChild(line);
        var status = queueStatusRow(svc);
        if (status) body.appendChild(status);
        row.appendChild(body);

        var actions = el('div', 'qrow-actions');
        var callable = hasWaiting && svc.available && opts.watched;
        if (callable) {
          var mini = el('button', 'qcall', '▶');
          mini.type = 'button';
          mini.title = 'Call next in ' + svc.name;
          mini.setAttribute('aria-label', 'Call next in ' + svc.name);
          mini.addEventListener('click', function (e) { e.stopPropagation(); quickCallNext(svc); });
          actions.appendChild(mini);
        }
        // Only a watched queue has a button, and it is a plain cross, always last: the row of one that is not watched
        // is clicked to watch it.
        if (opts.watched && !pinned) {
          var stop = el('button', 'qwatch', '✕');
          stop.type = 'button';
          stop.title = 'Stop watching ' + svc.name;
          stop.setAttribute('aria-label', stop.title);
          stop.addEventListener('click', function (e) { e.stopPropagation(); toggleWatch(svc.code); });
          actions.appendChild(stop);
        }
        if (actions.childNodes.length) line.appendChild(actions);

        if (!pinned && !opts.watched) row.addEventListener('click', function () { toggleWatch(svc.code); });
        return row;
      }

      // Watched queues lead, in their own section; everything else follows, with unwatched
      // queues that actually have people waiting pulled to the front — those need attention
      // soonest, even though nobody's watching them yet.
      function renderQueueRow() {
        var watched = watchedCodes();
        var watchedSet = {};
        watched.forEach(function (c) { watchedSet[c] = true; });

        var watchedSvcs = state.queue.filter(function (s) { return watchedSet[s.code]; });
        var otherSvcs = state.queue.filter(function (s) { return !watchedSet[s.code]; });
        otherSvcs.sort(function (a, b) { return (b.waiting.length > 0) - (a.waiting.length > 0); });

        // Appointments is always watched, but it's a card worth taking up space for only once
        // someone's actually in it — an empty one just sits there otherwise.
        var watchedDisplay = watchedSvcs.filter(function (s) {
          return !s.pinned || s.waiting.length > 0 || !s.available;
        });
        // Appointments leads the list — it's always watched, and someone's due any minute.
        // Everything else is alphabetical, so the list stays predictable as queues move in and
        // out of it.
        watchedDisplay.sort(function (a, b) {
          var pinnedDiff = (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
          return pinnedDiff || a.name.localeCompare(b.name);
        });

        var watchedBox = $('watched-row');
        watchedBox.textContent = '';
        watchedDisplay.forEach(function (svc) { watchedBox.appendChild(queueRow(svc, { watched: true })); });
        $('watched-label').classList.toggle('hidden', !watchedDisplay.length);
        watchedBox.classList.toggle('hidden', !watchedDisplay.length);

        var otherBox = $('other-row');
        otherBox.textContent = '';
        otherSvcs.forEach(function (svc) { otherBox.appendChild(queueRow(svc, { watched: false })); });
        var otherLabel = $('other-label');
        otherLabel.textContent = '';
        otherLabel.appendChild(document.createTextNode('Other Services'));
        otherLabel.appendChild(el('span', 'qgroup-sub', otherSvcs.length + (otherSvcs.length === 1 ? ' queue' : ' queues') + ' not being watched'));
        otherLabel.classList.toggle('hidden', !otherSvcs.length);
        otherBox.classList.toggle('hidden', !otherSvcs.length || state.hideOther);

        // A full-width button at the bottom of the sidebar, rather than a small link up top, so
        // it reads as a deliberate action alongside the list instead of being easy to miss.
        var showAllBtn = $('show-all-btn');
        if (otherSvcs.length) {
          showAllBtn.classList.remove('hidden');
          showAllBtn.textContent = state.hideOther ? 'Show all services' : 'Hide other services';
        } else {
          showAllBtn.classList.add('hidden');
        }
        renderDefaultBox();
        renderRestoreButton();
      }

      // A customer is mine when I am the one who called them. Tickets keep the name of the person who called them.
      function isMine(t) {
        return !!(state.user && t.calledBy && t.calledBy === state.user.displayName);
      }

      // Call and Complete are only for queues being watched. Watching one is a click on its row in the list on the left.
      function isWatched(code) {
        return watchedCodes().indexOf(code) >= 0;
      }

      function watchFirst(code, what) {
        return 'Watch ' + nameOf(code) + ' to ' + what + ' its customers. Click it under queues not being watched.';
      }

      function renderServing() {
        var rows = [];
        state.queue.forEach(function (svc) {
          svc.serving.forEach(function (t) { rows.push(t); });
        });
        // Mine first, then the others, each in the order they were called.
        rows.sort(function (a, b) { return (isMine(b) ? 1 : 0) - (isMine(a) ? 1 : 0) || new Date(a.calledAt) - new Date(b.calledAt); });
        var mineCount = rows.filter(isMine).length;
        $('serving-summary').textContent = rows.length ? mineCount + ' with you · ' + (rows.length - mineCount) + ' with others' : '';

        var grid = $('serving-grid');
        grid.textContent = '';
        if (!rows.length) {
          grid.appendChild(el('div', 'empty', 'No one is being helped right now.'));
          return;
        }
        rows.forEach(function (t) {
          var mine = isMine(t);
          var card = el('div', 'acard ' + (mine ? 'mine' : 'theirs'));

          // Name leads, top-left, sized down a touch to make room; elapsed time moves into a
          // quiet pill opposite it instead of plain text competing on the same line.
          var head = el('div', 'acard-head');
          var nameWrap = el('span', 'aname-wrap');
          nameWrap.appendChild(el('span', 'aname', t.customerName));
          head.appendChild(nameWrap);
          var elapsed = el('span', 'elapsed');
          elapsed.innerHTML = ICON_CLOCK;
          elapsed.appendChild(document.createTextNode(waitText(minutesSince(t.calledAt))));
          head.appendChild(elapsed);
          card.appendChild(head);

          var svcLine = el('div', 'acard-line');
          svcLine.innerHTML = iconFor(t.serviceCode).outerHTML;
          svcLine.appendChild(el('span', null, nameOf(t.serviceCode)));
          card.appendChild(svcLine);
          if (t.appointmentWith) card.appendChild(el('div', 'acard-line', 'Appointment with ' + t.appointmentWith + ' at ' + t.appointmentTime));
          // Who is helping them, and where — "Jane Doe · Window 1". Falls back gracefully for
          // any ticket called before staff accounts tracked this.
          var who = mine ? [t.calledBy, t.counter].filter(Boolean).join(' · ') : (t.calledBy ? 'Helped by ' + [t.calledBy, t.counter].filter(Boolean).join(' · ') : '—');
          var staffLine = el('div', 'acard-line');
          staffLine.innerHTML = ICON_PERSON;
          staffLine.appendChild(el('span', 'acard-who', who));
          card.appendChild(staffLine);

          var actions = el('div', 'acard-actions-row');
          var complete = el('button', 'icon-btn complete', '');
          complete.type = 'button';
          complete.title = 'Complete';
          complete.innerHTML = ICON_CHECK + '<span>Complete</span>';
          complete.addEventListener('click', function (e) { e.stopPropagation(); ticketAction(t, 'complete'); });
          if (!isWatched(t.serviceCode)) { complete.disabled = true; complete.title = watchFirst(t.serviceCode, 'complete'); }
          var transfer = el('button', 'icon-btn transfer', '');
          transfer.type = 'button';
          transfer.title = 'Reassign';
          transfer.innerHTML = ICON_TRANSFER;
          transfer.addEventListener('click', function (e) { e.stopPropagation(); openTransfer(t); });
          var requeue = el('button', 'icon-btn requeue', '');
          requeue.type = 'button';
          requeue.title = 'Return to Waiting';
          requeue.innerHTML = ICON_RETURN;
          requeue.addEventListener('click', function (e) { e.stopPropagation(); ticketAction(t, 'return'); });
          var remove = el('button', 'icon-btn remove', '');
          remove.type = 'button';
          remove.title = 'Remove';
          remove.innerHTML = ICON_TRASH;
          remove.addEventListener('click', function (e) { e.stopPropagation(); ticketAction(t, 'remove'); });
          actions.appendChild(complete);
          actions.appendChild(transfer);
          actions.appendChild(requeue);
          actions.appendChild(remove);
          card.appendChild(actions);

          grid.appendChild(card);
        });
      }

      function lobbyList() {
        var scope = state.scope === 'all' ? null : watchedCodes();
        var list = [];
        state.queue.forEach(function (svc) {
          if (!scope || scope.indexOf(svc.code) >= 0) svc.waiting.forEach(function (t) { list.push(t); });
        });
        list.sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); });
        return list;
      }

      function renderLobby() {
        var list = lobbyList();
        var oldest = list.length ? Math.max.apply(null, list.map(function (t) { return minutesSince(t.createdAt); })) : null;
        $('oldest').textContent = oldest === null ? '—' : waitText(oldest);

        var body = $('lobby-body');
        body.textContent = '';
        $('lobby-empty').classList.toggle('hidden', list.length > 0);
        $('lobby-empty').textContent = state.scope === 'all'
          ? 'No one is waiting in the lobby.'
          : 'No one is waiting in your watched queues. Switch to All Lobby Customers to see everyone.';

        list.forEach(function (t, i) {
          var tr = document.createElement('tr');
          tr.appendChild(el('td', 'num', String(i + 1)));
          tr.appendChild(el('td', null, t.customerName));
          tr.appendChild(el('td', null, nameOf(t.serviceCode)));
          var m = minutesSince(t.createdAt);
          tr.appendChild(el('td', waitClass(m), waitText(m)));
          tr.appendChild(el('td', null, t.appointmentWith ? t.appointmentTime + ' with ' + t.appointmentWith : '—'));
          var actions = el('td', 'actions');
          var call = el('button', 'call', 'Call');
          call.type = 'button';
          call.addEventListener('click', function () { callTicket(t); });
          if (!isWatched(t.serviceCode)) { call.disabled = true; call.title = watchFirst(t.serviceCode, 'call'); }
          var more = el('button', 'menu-btn', '⋯');
          more.type = 'button';
          more.title = 'More actions';
          more.style.marginLeft = '8px';
          more.addEventListener('click', function (e) {
            e.stopPropagation();
            openMenu(more, [
              { label: 'Transfer…', run: function () { openTransfer(t); } },
              { label: 'Remove', danger: true, run: function () { ticketAction(t, 'remove'); } }
            ]);
          });
          actions.appendChild(call);
          actions.appendChild(more);
          tr.appendChild(actions);
          body.appendChild(tr);
        });
      }

      function render() {
        renderQueueRow();
        renderServing();
        renderLobby();
        $('scope').querySelectorAll('button').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-scope') === state.scope);
        });
      }

      // Completed today. The count is always shown; the table opens on request.
      var historyOpen = false;

      function clock(iso) {
        return iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '—';
      }

      async function loadHistory() {
        try {
          var rows = await api('/api/staff/history');
          renderHistory(rows);
        } catch (err) {
          $('history-count').textContent = '';
        }
      }

      function renderHistory(rows) {
        $('history-count').textContent = '(' + rows.length + ')';
        var body = $('history-body');
        body.textContent = '';
        if (!rows.length) {
          var empty = document.createElement('tr');
          empty.appendChild(el('td', 'empty', 'No completed customers yet today.'));
          body.appendChild(empty);
          return;
        }
        rows.forEach(function (t) {
          var tr = document.createElement('tr');
          tr.appendChild(el('td', null, t.customerName));
          tr.appendChild(el('td', null, nameOf(t.serviceCode)));
          tr.appendChild(el('td', null, t.calledBy || '—'));
          tr.appendChild(el('td', null, clock(t.calledAt)));
          tr.appendChild(el('td', null, clock(t.completedAt)));
          tr.appendChild(el('td', null, t.appointmentWith ? t.appointmentTime + ' with ' + t.appointmentWith : '—'));
          body.appendChild(tr);
        });
      }

      $('history-toggle').addEventListener('click', function () {
        historyOpen = !historyOpen;
        $('history-wrap').classList.toggle('hidden', !historyOpen);
        this.textContent = historyOpen ? 'Hide' : 'Show';
      });

      // One refresh at a time. A live update that arrives while one is under way asks for another straight after,
      // so a change is never missed.
      var refreshing = false;
      var refreshAgain = false;
      async function refresh() {
        if (!state.user) return;
        if (refreshing) { refreshAgain = true; return; }
        refreshing = true;
        try {
          var data;
          try {
            data = await api('/api/staff/queue');
          } catch (err) {
            // Being signed out is not a lost connection; api() has already sent the person to sign in.
            if (!err.auth) noteRefresh(false);
            return;
          }
          noteRefresh(true);
          state.queue = data;
          try {
            checkNewArrivals(state.queue);
            render();
            loadHistory();
            $('updated').textContent = 'Updated ' + connClock(conn.lastOk);
            showMsg('');
          } catch (err) {
            console.error(err);
          }
        } finally {
          refreshing = false;
          if (refreshAgain) { refreshAgain = false; refresh(); }
        }
      }

      // ---- Sign in / out ----
      var ROLE_LABEL = { staff: 'Staff', manager: 'Manager', admin: 'Admin' };

      // Signing in happens on one page (index.html). It brings the person back here afterwards.
      function showLogin() {
        window.location.href = BASE + 'index.html?next=queue.html';
      }

      function renderCounterDisplay() {
        $('counter-display').textContent = state.counter + ' ✎';
      }

      function showDashboard() {
        $('dashboard').classList.remove('hidden');
        $('signout').classList.remove('hidden');
        $('manage-link').classList.toggle('hidden', state.user.role === 'staff');
        $('signed-in').textContent = state.user.displayName + ' · ' + ROLE_LABEL[state.user.role] + ' · ';
        renderCounterDisplay();
        $('counter-display').classList.remove('hidden');
      }

      // Lets a signed-in staff member rename their station without signing out and back in —
      // the name is only ever client-side (sent along with each "call" action), so this just
      // updates state + the saved copy in localStorage. Edits in place rather than a prompt()
      // dialog, consistent with the inline-form pattern used elsewhere in this app.
      function startCounterEdit() {
        var input = $('counter-edit');
        input.value = state.counter;
        $('counter-display').classList.add('hidden');
        input.classList.remove('hidden');
        input.focus();
        input.select();
      }

      function commitCounterEdit() {
        var input = $('counter-edit');
        var next = input.value.trim().slice(0, 20);
        input.classList.add('hidden');
        $('counter-display').classList.remove('hidden');
        if (next && next !== state.counter) {
          state.counter = next;
          localStorage.setItem('staffCounter', next);
        }
        renderCounterDisplay();
      }

      $('counter-display').addEventListener('click', startCounterEdit);
      $('counter-edit').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commitCounterEdit(); }
        else if (e.key === 'Escape') {
          e.preventDefault();
          // Hiding the box makes it lose focus, and losing focus saves what is in it, so put the current name back first.
          $('counter-edit').value = state.counter;
          $('counter-edit').classList.add('hidden');
          $('counter-display').classList.remove('hidden');
        }
      });
      $('counter-edit').addEventListener('blur', commitCounterEdit);

      // Wait for the server to clear the session before leaving the page. Otherwise the sign-in
      // page can run before the cookie is cleared, see the session still active and send the person back.
      $('signout').addEventListener('click', function () {
        state.user = null;
        closeMenu();
        api('/api/auth/logout', { method: 'POST' })
          .catch(function () {})
          .then(function () { window.location.href = BASE + 'index.html'; });
      });

      // ---- Controls ----

      $('scope').querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          state.scope = b.getAttribute('data-scope');
          render();
        });
      });

      // Calls the customer who has waited longest among the customers in scope.
      $('add-customer').addEventListener('click', openAddCustomer);

      $('call-next').addEventListener('click', function () {
        var first = lobbyList().filter(function (t) { return isWatched(t.serviceCode); })[0];
        if (!first) { showMsg('No one is waiting in your watched queues.'); return; }
        callTicket(first);
      });

      $('show-all-btn').addEventListener('click', function () { setHideOther(!state.hideOther); });
      $('save-default').addEventListener('click', saveDefault);
      $('restore-default').addEventListener('click', restoreDefaults);

      loadWatched();
      loadHideOther();
      loadNotifyPref();
      renderNotifyToggle();
      if (window.io) {
        var socket = io({ path: BASE + 'socket.io' });
        socket.on('queue:changed', refresh);
        // On the first connection and every reconnection: catch up on anything missed while it was down.
        socket.on('connect', refresh);
        // A dropped live connection is a reason to check the server now rather than at the next regular check.
        socket.on('disconnect', function () { pollSoon(); });
      }
      // Socket.IO delivers updates instantly in the normal case; this check is the fallback for a dropped or
      // unsupported socket connection, and how quickly a desktop notification can arrive for a watched queue.
      // It runs every 10 seconds, and every 3 while the last check failed so the page recovers quickly.
      var pollTimer = null;
      function pollQueue() {
        refresh().catch(function () {}).then(function () {
          clearTimeout(pollTimer);
          pollTimer = setTimeout(pollQueue, conn.failures ? 3000 : 10000);
        });
      }
      function pollSoon() {
        clearTimeout(pollTimer);
        pollTimer = setTimeout(pollQueue, 3000);
      }
      pollTimer = setTimeout(pollQueue, 10000);

      // The browser noticing the network come or go, and the tab coming back into view, are quicker signals than the
      // next check. A tab left in the background can have its timers slowed right down, so on return the list
      // is refreshed and the "out of date" warning waits a few seconds for that to finish.
      window.addEventListener('online', function () { refresh(); renderConnection(); });
      window.addEventListener('offline', renderConnection);
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) return;
        conn.suspendUntil = Date.now() + 4000;
        refresh();
      });
      setInterval(renderConnection, 1000);
      $('conn-retry').addEventListener('click', function () { if (conn.waiting) start(); else refresh(); });

      // A session cookie may already be valid from an earlier visit; check before showing the login form. If the
      // server cannot be reached the person is not sent to sign in, since they may well be signed in: the page says it
      // cannot reach the server and tries again every few seconds until it can.
      var startTimer = null;
      function setWaiting(on) {
        var banner = $('conn-banner');
        if (on) {
          conn.waiting = true;
          banner.className = 'conn-banner';
          $('conn-title').textContent = 'Can\'t reach the server.';
          $('conn-detail').textContent = ' Trying again…';
        } else if (conn.waiting) {
          conn.waiting = false;
          banner.className = 'conn-banner hidden';
        }
      }
      async function start() {
        clearTimeout(startTimer);
        if (!state.counter) { showLogin(); return; }
        try {
          state.user = await api('/api/auth/me');
          setWaiting(false);
          if (state.user.mustChangePassword) { window.location.href = BASE + 'account.html'; return; }
          applyDefaultQueues();
          showDashboard();
          refresh();
        } catch (err) {
          if (err.network) { setWaiting(true); startTimer = setTimeout(start, 3000); return; }
          showLogin();
        }
      }
      start();
    })();
  </script>
  <script src="app-settings.js"></script>
</body>
</html>
