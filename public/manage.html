      // ---- Kiosk, monitor, security, branding and audit log settings ----
      // Each group saves its own fields. The server checks every value and returns a plain message if one is wrong.
      var APP_GROUPS = [
        { title: 'Kiosk', note: 'Kiosks pick up these changes within a minute, without a reload.', keys: ['kiosk_idle_seconds', 'kiosk_done_seconds', 'kiosk_theme', 'checkin_rate_per_minute'] },
        { title: 'Lobby monitor', note: 'Monitors pick up these changes within a minute, without a reload. Pick at least one department for each side.', keys: ['monitor_call_seconds', 'monitor_chime', 'monitor_scroll', 'monitor_theme', 'monitor_left', 'monitor_right'] },
        { title: 'Security and sessions', note: 'A new session length applies at each sign-in. The idle sign-out applies from each person\'s next request. Sign-in lockout counts failed attempts in the audit log.', keys: ['session_hours', 'session_idle_minutes', 'min_password_length', 'new_account_change_password', 'lockout_attempts', 'lockout_minutes'] },
        { title: 'Branding', note: 'The organisation name appears above the page headings and in the page titles. The logo appears in the page headers. With no logo set, the headers show none.', keys: ['org_name'], logo: true },
        { title: 'End of day', note: 'At this time each day, every ticket still waiting, called or being served is closed as removed, and the screens update. It runs once a day, using the server\'s clock, and the audit log records how many were closed. Leave blank to turn it off.', keys: ['auto_close_time'] },
        { title: 'Audit log retention', note: 'Entries older than this are removed each day. Lockouts depend on recent failed sign-ins, so keep at least 30 days, or 0 to keep everything.', keys: ['audit_retention_days'] }
      ];

      function loadAppSettings() {
        return api('/api/admin/app-settings').then(function (data) {
          settingsUi.appData = data;
          settingsUi.appInputs = {};
          settingsUi.appContainer.textContent = '';
          APP_GROUPS.forEach(function (g) {
            settingsUi.appContainer.appendChild(settingsGroup(g.title, [buildAppPanel(g, data)]));
          });
        }).catch(function (err) {
          settingsUi.appContainer.textContent = err.message;
        });
      }

      function buildAppPanel(g, data) {
        var panel = el('div', 'panel');
        panel.appendChild(el('p', 'muted', g.note));
        // No buttons here: the Save settings button at the foot of the tab saves every group.
        var form = el('form', 'inline');
        form.addEventListener('submit', function (e) { e.preventDefault(); });
        // Department lists share one full-width row, side by side. Other fields flow in the grid above it.
        var keyRow = el('div', 'key-row');
        g.keys.forEach(function (key) {
          var field = appField(key, data);
          if (data.definitions[key].type === 'keys') keyRow.appendChild(field); else form.appendChild(field);
        });
        if (keyRow.childNodes.length) form.appendChild(keyRow);
        panel.appendChild(form);
        if (g.logo) panel.appendChild(logoBlock(data));
        return panel;
      }

      // One field, and a reader that returns its value in the form the server expects.
      function appField(key, data) {
        var def = data.definitions[key];
        var value = data.values[key];
        var input, row;
        if (def.type === 'bool') {
          input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = !!value;
          row = el('label', 'check-row');
          row.appendChild(input);
          row.appendChild(document.createTextNode(' ' + def.label));
          settingsUi.appInputs[key] = function () { return input.checked; };
          return row;
        }
        if (def.type === 'choice') {
          input = document.createElement('select');
          def.options.forEach(function (o) {
            var opt = el('option', null, o);
            opt.value = o;
            input.appendChild(opt);
          });
          input.value = value;
          settingsUi.appInputs[key] = function () { return input.value; };
          return labelled(def.label, input);
        }
        if (def.type === 'keys') {
          var options = data.departments.map(function (d) { return { value: d.id, label: d.label + ' (whole department)' }; })
            .concat(data.services.map(function (s) { return { value: s.code, label: s.name }; }));
          var picks = el('div', 'key-picks');
          var boxes = options.map(function (o) {
            var c = document.createElement('input');
            c.type = 'checkbox';
            c.value = o.value;
            c.checked = value.indexOf(o.value) >= 0;
            var l = el('label', 'check-row');
            l.appendChild(c);
            l.appendChild(document.createTextNode(' ' + o.label));
            picks.appendChild(l);
            return c;
          });
          settingsUi.appInputs[key] = function () {
            return boxes.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
          };
          var wrap = el('div', 'key-field');
          wrap.appendChild(el('span', 'field-label', def.label));
          wrap.appendChild(picks);
          return wrap;
        }
        if (def.type === 'clock') {
          input = document.createElement('input');
          input.type = 'time';
          input.value = value;
          settingsUi.appInputs[key] = function () { return input.value; };
          return labelled(def.label, input);
        }
        input = document.createElement('input');
        if (def.type === 'int') {
          input.type = 'number';
          input.min = def.min;
          input.max = def.max;
          input.step = '1';
          input.required = true;
          input.value = value;
          settingsUi.appInputs[key] = function () { return Number(input.value); };
        } else {
          input.type = 'text';
          input.maxLength = def.max;
          input.value = value;
          settingsUi.appInputs[key] = function () { return input.value; };
        }
        return labelled(def.label, input);
      }

      // Saves every setting on the Settings tab in one go: the kiosk, monitor, security, branding and audit
      // groups, then the old-records rule. A failure stops the save and shows the message beside the button.
      function saveAllSettings() {
        if (!settingsUi.appInputs) return;
        var btn = settingsUi.saveAll;
        var msg = settingsUi.saveMsg;
        var r = settingsUi.retention;
        var body = {};
        APP_GROUPS.forEach(function (g) { g.keys.forEach(function (key) { body[key] = settingsUi.appInputs[key](); }); });
        btn.disabled = true;
        msg.className = 'msg';
        msg.textContent = '';
        api('/api/admin/app-settings', { method: 'PUT', body: JSON.stringify(body) }).then(function () {
          return api('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ retentionDays: Number(r.days.value), retentionAction: r.action.value }) });
        }).then(function () {
          msg.className = 'health-ok';
          msg.textContent = 'Settings saved.';
          loadRetention();
          loadAudit();
        }).catch(function (err) {
          msg.textContent = err.message;
        }).finally(function () { btn.disabled = false; });
      }

      // Logo: PNG, JPEG or WebP up to 300 KB. Stored in the database, so it follows the app to any host.
      function logoBlock(data) {
        var wrap = el('div', 'key-field');
        wrap.appendChild(el('span', 'field-label', 'Logo'));
        var row = el('div', 'logo-row');
        if (data.logoUrl) {
          var img = document.createElement('img');
          img.className = 'logo-preview';
          img.alt = 'Current logo';
          img.src = BASE + data.logoUrl;
          // A saved logo the browser can't draw: say so, and point to the way to fix it.
          img.addEventListener('error', function () {
            img.replaceWith(el('span', 'msg', 'The saved logo could not be displayed. Remove it, then upload it again.'));
          });
          row.appendChild(img);
        } else {
          row.appendChild(el('span', 'muted', 'No logo set. The headers show no logo.'));
        }
        var msg = el('p', 'msg');
        var file = document.createElement('input');
        file.type = 'file';
        file.accept = 'image/png,image/jpeg,image/webp';
        file.addEventListener('change', function () {
          var picked = file.files && file.files[0];
          if (!picked) return;
          if (picked.size > 300 * 1024) { msg.textContent = 'Choose an image under 300 KB.'; file.value = ''; return; }
          var reader = new FileReader();
          reader.onload = function () {
            api('/api/admin/logo', { method: 'PUT', body: JSON.stringify({ dataUrl: reader.result }) }).then(function () {
              loadAppSettings();
            }).catch(function (err) { msg.textContent = err.message; });
          };
          reader.readAsDataURL(picked);
        });
        var upload = el('div', 'logo-actions');
        upload.appendChild(file);
        if (data.logoUrl) {
          var remove = el('button', 'secondary', 'Remove logo');
          remove.type = 'button';
          remove.addEventListener('click', function () {
            api('/api/admin/logo', { method: 'DELETE' }).then(loadAppSettings).catch(function (err) { msg.textContent = err.message; });
          });
          upload.appendChild(remove);
        }
        wrap.appendChild(row);
        wrap.appendChild(upload);
        wrap.appendChild(msg);
        return wrap;
      }

      // Each check is shown with a plain result. Problems are listed first so they stand out.
      function runDatabaseCheck() {
        var out = settingsUi.dbOut;
        out.textContent = 'Checking the database…';
        api('/api/admin/database').then(function (result) {
          var problems = result.checks.filter(function (c) { return !c.ok; }).length;
          out.textContent = '';
          out.appendChild(el('p', problems ? 'msg' : 'health-ok',
            problems ? problems + ' check(s) need attention.' : 'The database is working as expected.'));
          var rows = result.checks
            .slice()
            .sort(function (a, b) { return a.ok - b.ok; })
            .map(function (c) { return [c.name, c.detail, c.ok ? 'OK' : 'Problem']; });
          out.appendChild(reportTable([{ label: 'Check' }, { label: 'Result' }, { label: 'Status' }], rows));
        }).catch(function (err) {
          out.textContent = err.message;
        });
      }

      function runHealthCheck() {
        var out = settingsUi.healthOut;
        out.textContent = 'Checking…';
        api('/api/admin/health').then(function (h) {
          var db = h.database;
          var clockOff = Math.abs(db.clockDifferenceSeconds) > 60;
          var slow = db.latencyMs > 1000;
          var rows = [
            ['App running for', fmtUptime(h.app.uptimeSeconds)],
            ['Node.js version', h.app.nodeVersion],
            ['Database response', db.latencyMs + ' ms' + (slow ? ' (slow)' : '')],
            ['Clocks agree', clockOff ? 'No: database and app differ by ' + db.clockDifferenceSeconds + ' seconds' : 'Yes'],
            ['Waiting today', String(db.waitingToday)],
            ['Being served today', String(db.servingToday)],
            ['Active admin accounts', String(db.activeAdmins) + (db.activeAdmins < 2 ? ' (consider a second admin)' : '')],
            ['Old-record cleanup', h.oldRecords.retentionDays ? 'After ' + h.oldRecords.retentionDays + ' days' : 'Off (keeping everything)']
          ];
          var healthy = !clockOff && !slow;
          out.textContent = '';
          out.appendChild(el('p', healthy ? 'health-ok' : 'msg', healthy ? 'Everything looks healthy.' : 'Something needs attention. See below.'));
          out.appendChild(reportTable([{ label: 'Check' }, { label: 'Result' }], rows));
        }).catch(function (err) {
          out.textContent = err.message;
        });
      }

      function runTests() {
        var btn = settingsUi.testsBtn;
        btn.disabled = true;
        settingsUi.testsSummary.textContent = 'Running the tests…';
        settingsUi.testsOut.classList.add('hidden');
        api('/api/admin/tests', { method: 'POST' }).then(function (result) {
          // The runner's summary lines are "ℹ pass N" or "# pass N", depending on its output format.
          var counts = /(?:ℹ|#) pass (\d+)[\s\S]*?(?:ℹ|#) fail (\d+)/.exec(result.output);
          var summary = result.passed ? 'All tests passed.' : 'Some tests failed. See the output below.';
          if (counts) summary += ' (' + counts[1] + ' passed, ' + counts[2] + ' failed)';
          settingsUi.testsSummary.textContent = summary;
          settingsUi.testsSummary.className = result.passed ? 'health-ok' : 'msg';
          settingsUi.testsOut.textContent = result.output || 'No output.';
          settingsUi.testsOut.classList.remove('hidden');
          loadAudit();
        }).catch(function (err) {
          settingsUi.testsSummary.textContent = err.message;
        }).finally(function () { btn.disabled = false; });
      }

      function loadRetention() {
        api('/api/admin/settings').then(function (s) {
          settingsUi.retention.days.value = s.retentionDays;
          settingsUi.retention.action.value = s.retentionAction;
          settingsUi.retentionInfo.textContent = 'Last cleanup: ' + fmtStamp(s.lastCleanupAt) + '.';
        }).catch(function (err) {
          settingsUi.retentionInfo.textContent = err.message;
        });
      }

      function runCleanupNow() {
        var days = Number(settingsUi.retention.days.value);
        if (!days) { alert('Set a number of days, then save, before running the cleanup.'); return; }
        var deleting = settingsUi.retention.action.value === 'delete';
        var message = deleting
          ? 'Delete every finished ticket older than ' + days + ' days? Reports will no longer include them. This cannot be undone.'
          : 'Blank out customer names on finished tickets older than ' + days + ' days?';
        if (!confirm(message)) return;
        api('/api/admin/cleanup', { method: 'POST' }).then(function (result) {
          alert(result.changed + ' ticket(s) changed.');
          loadRetention();
          loadAudit();
        }).catch(function (err) { alert(err.message); });
      }

      function loadAudit() {
        var out = settingsUi.auditOut;
        out.textContent = 'Loading…';
        var term = settingsUi.auditSearch.value.trim();
        api('/api/admin/audit?limit=200&q=' + encodeURIComponent(term)).then(function (rows) {
          out.textContent = '';
          if (!rows.length) {
            out.appendChild(el('p', 'empty', term ? 'Nothing in the log matches "' + term + '".' : 'Nothing logged yet.'));
            return;
          }
          out.appendChild(reportTable(
            [{ label: 'When' }, { label: 'Who' }, { label: 'Action' }, { label: 'Target' }, { label: 'Details' }],
            rows.map(function (r) {
              return [fmtStamp(r.createdAt), r.actorName, AUDIT_LABEL[r.action] || r.action, r.target || '—', r.detail || '—'];
            })
          ));
        }).catch(function (err) {
          out.textContent = err.message;
        });
      }

      // ================= Tabs & boot =================

      function showTab(tab) {
        Object.keys(TAB_ACCESS).forEach(function (t) {
          $('panel-' + t).classList.toggle('hidden', t !== tab);
        });
        document.querySelectorAll('.tab-btn').forEach(function (b) {
          b.classList.toggle('active', b.dataset.tab === tab);
        });
        var params = new URLSearchParams(location.search);
        params.set('tab', tab);
        history.replaceState(null, '', location.pathname + '?' + params.toString());
        // The report reloads each time its tab is opened, so it always shows current data.
        if (tab === 'reports') loadReportRange();
        if (tab === 'settings') loadSettingsTab();
        if (tab === 'health') loadAudit();
      }

      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { showTab(btn.dataset.tab); });
      });

      (async function start() {
        // The password rules and other settings are read from the server before the page is drawn.
        await window.appSettingsReady;
        try {
          state.user = await api('/api/auth/me');
        } catch (err) {
          renderDenied('Sign in to access management.');
          return;
        }
        if (state.user.mustChangePassword) { window.location.href = BASE + 'account.html'; return; }
        if (state.user.role === 'staff') {
          renderDenied('Your account does not have access to this page.');
          return;
        }
        $('signed-in').textContent = state.user.displayName + ' · ' + ROLE_LABEL[state.user.role];

        // Only show tabs this role is actually allowed into — see TAB_ACCESS above.
        var availableTabs = Object.keys(TAB_ACCESS).filter(function (t) {
          return TAB_ACCESS[t].indexOf(state.user.role) >= 0;
        });
        if (!availableTabs.length) {
          renderDenied('Your account does not have access to this page.');
          return;
        }
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
          btn.classList.toggle('hidden', availableTabs.indexOf(btn.dataset.tab) < 0);
        });

        var app = $('app');
        app.textContent = '';
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-services';
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-staff';
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-reports';
        buildReports(app.lastChild);
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-health';
        var healthTab = app.lastChild;
        app.appendChild(el('div', 'tab-panel hidden', undefined));
        app.lastChild.id = 'panel-settings';
        buildSettings(app.lastChild, healthTab);

        try {
          var toLoad = [];
          if (availableTabs.indexOf('services') >= 0) toLoad.push(loadServices());
          if (availableTabs.indexOf('staff') >= 0) toLoad.push(loadUsers());
          await Promise.all(toLoad);
        } catch (err) {
          renderDenied(err.message || 'Could not load management data.');
          return;
        }

        $('tabs').classList.remove('hidden');
        var requested = new URLSearchParams(location.search).get('tab');
        showTab(availableTabs.indexOf(requested) >= 0 ? requested : availableTabs[0]);
      })();
    })();
  </script>
</body>
</html>
